" style=\"width:100%; height:clamp(150px,26vh,220px);\" shape=\"rounded\" radius=\"12\" placeholder=\"{{ modal.slotHint }}\"><\u002Fimage-slot>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ modal.hasUserAudio }}\" hint-placeholder-val=\"{{ false }}\">\n            <audio src=\"{{ modal.userAudio }}\" controls=\"{{ true }}\" style=\"width:100%; margin-top:10px; display:block;\"><\u002Faudio>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ modal.imgCredit }}\" hint-placeholder-val=\"{{ false }}\">\n            <a href=\"{{ modal.imgPage }}\" target=\"_blank\" rel=\"noopener\" style=\"display:block; margin-top:6px; text-align:right; font-family:Helvetica, Arial, sans-serif; font-size:11px; color:#9a9a9a; text-decoration:none;\">{{ modal.imgCredit }}<\u002Fa>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ modalBodyShown }}\" hint-placeholder-val=\"{{ true }}\">\n          <sc-if value=\"{{ modalCanEdit }}\" hint-placeholder-val=\"{{ false }}\">\n            <button type=\"button\" sc-camel-on-click=\"{{ modalEdit }}\" style=\"display:flex; align-items:center; gap:6px; margin:14px 24px 0; padding:0; background:none; border:none; cursor:pointer; font-family:Helvetica, Arial, sans-serif; font-size:13px; color:#0f9d76; text-decoration:underline; text-underline-offset:3px;\">✎ Edit text<\u002Fbutton>\n          <\u002Fsc-if>\n          <div sc-camel-on-click=\"{{ modalEdit }}\" title=\"{{ modalEditTitle }}\" style=\"overflow-y:auto; max-height:266px; padding:16px 24px 8px; cursor:{{ modalTextCursor }};\">\n            <p style=\"font-size:17px; line-height:1.62; color:#4a4a4a; margin:0;\">{{ modal.full }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ pollNeedsName }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex; flex-wrap:wrap; align-items:center; gap:10px; padding:12px 24px 0; border-top:1px solid #f0f0f0;\">\n            <span style=\"font-family:Helvetica, Arial, sans-serif; font-size:13px; color:#6a6a6a;\">Your member name, phone# or email to vote:<\u002Fspan>\n            <input type=\"text\" value=\"{{ member }}\" sc-camel-on-change=\"{{ onMember }}\" placeholder=\"member name\" style=\"flex:1 1 180px; box-sizing:border-box; background:rgba(217,217,217,0.45); border:none; border-radius:10px; padding:9px 12px; font-family:Georgia, serif; font-size:16px; color:#2f2f2f; outline:none;\">\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"display:flex; flex-wrap:wrap; align-items:center; gap:10px; padding:12px 24px; border-top:1px solid #f0f0f0;\">\n          <button sc-camel-on-click=\"{{ voteYes }}\" style=\"cursor:pointer; border:1px solid {{ yesBorder }}; background:{{ yesBg }}; color:{{ yesColor }}; border-radius:999px; padding:9px 18px; min-height:40px; font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:11px; letter-spacing:0.09em; text-transform:uppercase;\">Vote YES · {{ yesCount }}<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ voteNo }}\" style=\"cursor:pointer; border:1px solid {{ noBorder }}; background:{{ noBg }}; color:{{ noColor }}; border-radius:999px; padding:9px 18px; min-height:40px; font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:11px; letter-spacing:0.09em; text-transform:uppercase;\">Vote NO · {{ noCount }}<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ toggleComments }}\" style=\"margin-left:auto; cursor:pointer; border:1px solid {{ commentBorder }}; background:{{ commentBg }}; color:{{ commentColor }}; border-radius:999px; padding:9px 18px; font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:11px; letter-spacing:0.09em; text-transform:uppercase;\">{{ commentLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n        <sc-if value=\"{{ pollStatus }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:0 24px 12px; font-family:Helvetica, Arial, sans-serif; font-size:12px; color:#8a8a8a;\">{{ pollStatus }}<\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ delCanAsk }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex; justify-content:flex-end; gap:8px; padding:0 24px 12px;\">\n            <sc-if value=\"{{ modalCanEdit }}\" hint-placeholder-val=\"{{ false }}\">\n              <button type=\"button\" sc-camel-on-click=\"{{ modalEdit }}\" style=\"cursor:pointer; border:1px solid #0f9d76; border-radius:999px; min-height:36px; padding:0 16px; background:#ffffff; color:#0f9d76; font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:11px; letter-spacing:0.08em; text-transform:uppercase;\" style-hover=\"background:#e8f6f0;\">Edit post<\u002Fbutton>\n            <\u002Fsc-if>\n            <button type=\"button\" sc-camel-on-click=\"{{ askDelete }}\" style=\"cursor:pointer; border:1px solid #f4511e; border-radius:999px; min-height:36px; padding:0 16px; background:#ffffff; color:#f4511e; font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:11px; letter-spacing:0.08em; text-transform:uppercase;\" style-hover=\"background:#fff1ec;\">Delete post<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ delAsking }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex; flex-direction:column; gap:8px; margin:0 24px 14px; padding:14px; border:1px dashed #f4511e; border-radius:12px; background:#fff8f5;\">\n            <div style=\"font-family:Helvetica, Arial, sans-serif; font-size:13px; line-height:1.5; color:#4a4a4a;\">Delete this post for everyone? Your name, the post and your reason are saved for admin review, and the post moves to the <a href=\"./freedom-of-speech.html\" style=\"color:#0f9d76;\">Freedom of Speech<\u002Fa> page.<\u002Fdiv>\n            <div style=\"display:flex; flex-wrap:wrap; gap:6px;\">\n              <sc-for list=\"{{ delCats }}\" as=\"dc\" hint-placeholder-count=\"6\">\n                <button type=\"button\" sc-camel-on-click=\"{{ dc.onClick }}\" style=\"cursor:pointer; border:1px solid {{ dc.border }}; border-radius:999px; min-height:34px; padding:0 12px; background:{{ dc.bg }}; color:{{ dc.color }}; font-family:Helvetica, Arial, sans-serif; font-size:12px;\">{{ dc.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <textarea rows=\"2\" value=\"{{ delReason }}\" sc-camel-on-change=\"{{ onDelReason }}\" placeholder=\"Reason (required)\" style=\"box-sizing:border-box; width:100%; background:#ffffff; border:1px solid #f0d6cc; border-radius:10px; padding:10px 12px; font-family:Georgia, serif; font-size:16px; color:#2f2f2f; outline:none; resize:vertical;\"><\u002Ftextarea>\n            <sc-if value=\"{{ delError }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font-family:Helvetica, Arial, sans-serif; font-size:12px; color:#f4511e;\">{{ delError }}<\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"display:flex; gap:8px; justify-content:flex-end;\">\n              <button type=\"button\" sc-camel-on-click=\"{{ cancelDelete }}\" style=\"cursor:pointer; border:1px solid #e2e2e2; border-radius:999px; min-height:40px; padding:0 16px; background:#ffffff; color:#6a6a6a; font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:11px; letter-spacing:0.08em; text-transform:uppercase;\">Keep it<\u002Fbutton>\n              <button type=\"button\" sc-camel-on-click=\"{{ confirmDelete }}\" style=\"cursor:pointer; border:none; border-radius:999px; min-height:40px; padding:0 18px; background:#f4511e; color:#ffffff; font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:11px; letter-spacing:0.08em; text-transform:uppercase;\" style-hover=\"background:#d93f10;\">Delete<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ commentsShown }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"overflow-y:auto; max-height:300px; padding:4px 24px 22px; border-top:1px solid #f0f0f0;\">\n            <sc-for list=\"{{ modalComments }}\" as=\"c\" hint-placeholder-count=\"4\">\n              <div style=\"padding:14px 0; border-bottom:1px solid #f4f4f4;\">\n                <div style=\"display:flex; gap:10px; align-items:center; margin-bottom:6px;\">\n                  <span style=\"font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:11px; color:#2f2f2f;\">{{ c.author }}<\u002Fspan>\n                  <span style=\"font-family:Helvetica, Arial, sans-serif; font-size:11px; color:#9a9a9a;\">{{ c.when }}<\u002Fspan>\n                <\u002Fdiv>\n                <sc-if value=\"{{ c.notEditing }}\" hint-placeholder-val=\"{{ true }}\">\n                  <p style=\"font-size:15px; line-height:1.55; color:#5a5a5a; margin:0;\">{{ c.text }}<\u002Fp>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ c.isMine }}\" hint-placeholder-val=\"{{ false }}\">\n                  <sc-if value=\"{{ c.notEditing }}\" hint-placeholder-val=\"{{ true }}\">\n                    <div style=\"display:flex; justify-content:flex-end; margin-top:6px;\">\n                      <button type=\"button\" sc-camel-on-click=\"{{ c.onEdit }}\" style=\"cursor:pointer; border:1px solid #0f9d76; border-radius:999px; min-height:36px; padding:0 16px; background:#ffffff; color:#0f9d76; font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:11px; letter-spacing:0.08em; text-transform:uppercase;\" style-hover=\"background:#e8f6f0;\">Edit<\u002Fbutton>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ c.editing }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"display:flex; flex-direction:column; gap:8px;\">\n                      <textarea rows=\"3\" value=\"{{ c.editText }}\" sc-camel-on-change=\"{{ c.onEditText }}\" aria-label=\"Edit your comment\" style=\"box-sizing:border-box; width:100%; background:rgba(217,217,217,0.45); border:none; border-radius:10px; padding:11px 14px; font-family:Georgia, serif; font-size:16px; line-height:1.5; color:#2f2f2f; outline:none; resize:vertical;\"><\u002Ftextarea>\n                      <div style=\"display:flex; gap:8px; justify-content:flex-end;\">\n                        <button type=\"button\" sc-camel-on-click=\"{{ c.onCancel }}\" style=\"cursor:pointer; border:1px solid #e2e2e2; border-radius:999px; min-height:36px; padding:0 16px; background:#ffffff; color:#6a6a6a; font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:11px; letter-spacing:0.08em; text-transform:uppercase;\">Cancel<\u002Fbutton>\n                        <button type=\"button\" sc-camel-on-click=\"{{ c.onSave }}\" style=\"cursor:pointer; border:1px solid #0f9d76; border-radius:999px; min-height:36px; padding:0 16px; background:#0f9d76; color:#ffffff; font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:11px; letter-spacing:0.08em; text-transform:uppercase;\" style-hover=\"background:#0b7f5f;\">Save<\u002Fbutton>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <div style=\"display:flex; flex-direction:column; gap:10px; padding-top:14px;\">\n              <textarea rows=\"3\" value=\"{{ pcText }}\" sc-camel-on-change=\"{{ onPcText }}\" placeholder=\"{{ pcPlaceholder }}\" aria-label=\"Add a comment\" style=\"box-sizing:border-box; width:100%; background:rgba(217,217,217,0.45); border:none; border-radius:10px; padding:11px 14px; font-family:Georgia, serif; font-size:16px; line-height:1.5; color:#2f2f2f; outline:none; resize:vertical;\"><\u002Ftextarea>\n              <div style=\"display:flex; flex-wrap:wrap; align-items:center; gap:12px;\">\n                <button type=\"button\" sc-camel-on-click=\"{{ postPc }}\" style=\"cursor:pointer; border:1px solid #0f9d76; border-radius:999px; min-height:36px; padding:0 16px; background:#0f9d76; color:#ffffff; font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; min-height:44px; padding:0 22px;\" style-hover=\"background:#0b7f5f;\">{{ pcBtn }}<\u002Fbutton>\n                <span style=\"font-family:Helvetica, Arial, sans-serif; font-size:13px; color:#0f9d76;\">{{ pcStatus }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n  <div style=\"display:flex; gap:24px; margin-top:clamp(48px,8vh,72px); font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:12px; letter-spacing:0.1em; text-transform:uppercase;\">\n    <a href=\"./meeting-of-the-minds.html\" style=\"color:#0f9d76; text-decoration:none;\">← Meeting of the Minds<\u002Fa>\n    <a href=\"./index.html\" style=\"color:#0f9d76; text-decoration:none;\">Home<\u002Fa>\n  <\u002Fdiv>\n  <div style=\"text-align:center; font-family:Helvetica, Arial, sans-serif; font-size:12px; color:#a8a8a8; margin-top:56px;\">© 2026 DL Thomas. All Rights Reserved.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  railHover = -1;\n  railWide = typeof window !== 'undefined' ? window.innerWidth >= 700 : true;\n  railDefs = [\n    { label: 'Issues, Topics, Posts', href: '#' },\n    { label: 'Meeting of the Minds', href: './meeting-of-the-minds.html' },\n    { label: 'Your Invitation', href: './invitation.html', always: true },\n    { label: 'Majaii', href: './majaii.html', always: true },\n    { label: 'Library+Letters', href: './open-letter.html' },\n    { label: 'Donors, Sponsors, Partners', href: './sponsors.html', always: true },\n    { label: '', href: '', inert: true },\n    { label: 'JanuaryAI Summit 2027', href: './summit.html', always: true },\n    { label: 'Global AI Community', href: './global-ai-community.html' },\n    { label: '', href: '', inert: true },\n    { label: 'JAI-Charter', href: './charter.html', always: true },\n    { label: '', href: '', inert: true },\n    { label: 'Contact', href: './contact.html' },\n    { label: 'Freedom', href: './freedom-of-speech.html' }\n  ];\n\n  railOpen = false;\n  railLockedByTouch = false;\n  setRailOpen = (v) => {\n    if (this.railLockedByTouch) return;\n    if (this.railOpen !== v) { this.railOpen = v; this.forceUpdate(); }\n  };\n  toggleRailOpen = () => {\n    this.railOpen = !this.railOpen;\n    this.railLockedByTouch = this.railOpen;\n    this.railTouchedAt = Date.now();\n    this.forceUpdate();\n  };\n  railTap = (e) => {\n    if (e && e.target && e.target.closest && e.target.closest('[href]')) return;\n    if (this.railTouchedAt && Date.now() - this.railTouchedAt < 700) return;\n    this.toggleRailOpen();\n  };\n\n  setRailHover = (i) => { this.railHover = i; this.forceUpdate(); };\n\n  watchRailWidth() {\n    this.onRailResize = () => {\n      const wide = window.innerWidth >= 700;\n      if (wide !== this.railWide) { this.railWide = wide; this.forceUpdate(); }\n    };\n    window.addEventListener('resize', this.onRailResize);\n    this.onRailResize();\n  }\n\n  buildRailItems() {\n    return this.railDefs.map((d, i) => ({\n      label: d.label,\n      href: d.href,\n      dotBg: this.railHover === i ? '#0f9d76' : '#a7ddc9',\n      dotScale: this.railHover === i ? 'scale(1.45)' : 'scale(1)',\n      labelOpacity: (d.label && (this.railWide || this.railOpen || this.railHover === i)) ? 1 : 0,\n      labelPointer: (d.label && (this.railWide || this.railOpen || this.railHover === i)) ? 'auto' : 'none',\n      onClick: (e) => {\n        e.preventDefault();\n        if (d.inert) return;\n        const h = d.href;\n        if (h.charAt(0) === '#') { window.scrollTo({ top: 0, behavior: 'smooth' }); return; }\n        const u = new URL(h, window.location.href);\n        const hash = u.hash;\n        u.hash = '';\n        u.search = window.location.search;\n        window.location.href = u.toString() + hash;\n      },\n      onEnter: () => this.setRailHover(i),\n      onLeave: () => this.setRailHover(-1)\n    }));\n  }\n\n  basePosts = [\n    { id: 'p1', anchor: 'workforce', topic: 'Workforce', title: 'Retraining that actually places people in jobs — what worked in our county', body: 'A community college pilot moved 61 displaced logistics workers into maintenance and robotics support roles in nine months. Sharing the curriculum and the placement data.', author: 'r.alvarez', comments: 148, base: 412, hours: 6, full: \"A community college pilot moved 61 displaced logistics workers into maintenance and robotics support roles in nine months. Here is the whole picture, including the parts that did not work. We started with 94 enrollees; 18 left in the first six weeks, almost all for scheduling reasons rather than difficulty — evening cohorts cut that attrition by more than half in the second round. Instruction was two days of shop floor for every day of classroom, and the AI tutor was used for diagnostics and drills only, never as the primary instructor. Employers committed to interviews before the cohort began, which turned out to be the single most important variable: every placement traced back to an employer who had skin in the game from week one. Median wage after placement was $27.40 an hour against $19.10 before. Two employers later reported that graduates were troubleshooting faster than incumbent staff on the same equipment. The curriculum, the intake screen, the employer agreement template, and the twelve-month placement data are all attached, unedited. What we still do not know is durability — whether these roles exist in the same form in five years — and that is exactly the kind of question a working group should take up before we recommend replication anywhere else.\", thread: [{ author: 'm.tanaka', when: '4h', text: \"The employer-interview-first detail is the whole finding. Everything else is implementation.\" }, { author: 's.reyes', when: '3h', text: \"Did the 18 who left get any follow-up? Curious whether evening cohorts recovered them specifically.\" }, { author: 'r.alvarez', when: '3h', text: \"Nine of the 18 re-enrolled in the evening cohort. Seven of those nine placed.\" }, { author: 'k.osei', when: '2h', text: \"Requesting the intake screen for a district workforce program. Will report back with results.\" }, { author: 'd.bell', when: '1h', text: \"Wage delta is the number that will move our county commission. Thank you for publishing it plainly.\" }] },\n    { id: 'p2', anchor: 'education', topic: 'Education', title: 'Proposal: every district publishes its AI tutoring outcomes', body: 'Districts are adopting tutors fast and reporting nothing. A one-page standard disclosure would let parents compare and let the working group evaluate honestly.', author: 'k.osei', comments: 96, base: 388, hours: 11, full: \"Districts are adopting AI tutoring at speed and reporting almost nothing about outcomes. Parents cannot compare, school boards cannot evaluate, and vendors are left grading their own homework. The proposal is deliberately small: a one-page standard disclosure, published annually by every district that deploys an AI tutoring product. Six fields — which product, which grades and subjects, hours of use per student, the assessment used, results against a comparison group, and cost per student. No district is required to prove effectiveness; they are only required to say what they know. Districts that decline to publish should say that too. The point is not to shame anyone. It is that a working group cannot design a good recommendation from vendor case studies, and a community cannot govern what it cannot see. If a hundred districts publish this page, the Commons has a real dataset by the second Summit and the beginnings of an evidence base by the third.\", thread: [{ author: 'j.whitcomb', when: '8h', text: \"Six fields is the right size. Twelve and nobody files it.\" }, { author: 'a.nkemdi', when: '6h', text: \"Add a field for who paid for the product. Some deployments are vendor-funded pilots.\" }, { author: 'k.osei', when: '5h', text: \"Fair. That is a seventh field and probably worth the cost.\" }, { author: 'l.fournier', when: '3h', text: \"Our district would publish this tomorrow. The obstacle is not willingness, it is that nobody asked.\" }] },\n    { id: 'p3', anchor: 'healthcare', topic: 'Healthcare', title: 'Rural clinics: who is liable when the model reads the scan first?', body: 'Two clinics in our network want AI triage but cannot get clear answers on liability or override authority. Requesting a governance brief before the Summit.', author: 'j.whitcomb', comments: 203, base: 351, hours: 4, full: \"Two rural clinics in our network want AI triage for imaging and cannot get a straight answer on two questions: who carries liability when the model reads a scan first, and who holds override authority when a clinician disagrees. Both clinics operate with one radiologist covering three counties, so triage is not a convenience — it is the difference between a same-day read and a four-day wait. Vendors offer indemnity language that our counsel considers unusable. The state has no guidance. Our malpractice carrier will not commit in writing. Meanwhile the clinics are making the decision by default: they are not adopting, and patients are waiting. This is precisely the coordination gap January AI exists to close. Requesting a governance brief before the Summit that covers liability allocation, override documentation, patient disclosure, and the minimum audit trail a small clinic can realistically maintain. If the brief concludes that adoption is premature for facilities this size, that is a useful answer too — but the absence of any answer is what is failing patients right now.\", thread: [{ author: 'm.tanaka', when: '3h', text: \"This is a governance brief, not a technology question. Agreed it belongs before the Summit.\" }, { author: 's.reyes', when: '2h', text: \"Same situation in two clinics here. Happy to co-sign and share our counsel's memo.\" }, { author: 'j.whitcomb', when: '2h', text: \"Please do. Two clinics is an anecdote, ten is a case.\" }, { author: 'a.nkemdi', when: '1h', text: \"Worth asking what the override documentation burden looks like for a two-person imaging team.\" }] },\n    { id: 'p4', anchor: 'governance', topic: 'AI Governance', title: 'Publish the vote log with every authorized project', body: 'If the community authorizes funding, the record of how the community voted should ship alongside the budget. Trust is built by receipts.', author: 'm.tanaka', comments: 74, base: 297, hours: 21, full: \"If the community authorizes funding, the record of how the community voted should ship alongside the budget. Not a summary, not a headline vote count — the log: who voted, on what, in which direction, and when. We already accept this in civic life. Legislatures publish roll calls. Boards publish minutes. An institution asking for public trust while keeping its voting record private is asking to be taken on faith, and faith is exactly the thing January AI proposed to replace with evidence. The objection is privacy, and it is a serious one. My answer is that members who cast votes that direct money are acting in a public capacity, and the log should be attributed by member name, with a documented process for a member to request shielding in genuine cases of risk. The second objection is that transparency invites pressure campaigns. Also true — and visible pressure campaigns are easier to govern than invisible ones. Trust is built by receipts.\", thread: [{ author: 'a.nkemdi', when: '18h', text: \"Support, with the shielding process defined before the first vote, not after.\" }, { author: 'd.bell', when: '14h', text: \"Roll calls are the right precedent. This is not a novel ask.\" }, { author: 'l.fournier', when: '9h', text: \"Concerned about pressure campaigns, but I take the point that visible ones are governable.\" }] },\n    { id: 'p5', anchor: 'opportunity', topic: 'Economic Opportunity', title: 'Small-town main street is the best AI test bed nobody is funding', body: 'Twelve businesses, one shared implementation grant, measured revenue and hours saved. Draft budget attached — looking for a working group sponsor.', author: 'd.bell', comments: 61, base: 264, hours: 30, full: \"Twelve businesses on one main street, one shared implementation grant, and a measurement plan that tracks revenue, hours saved, and owner-reported stress. Small-town commercial districts are the best AI test bed nobody is funding, because everything is legible at that scale: you can see the whole system, talk to every owner, and measure what changed within a quarter. Our draft budget is modest — a shared implementer for six months, tooling costs, and a stipend for owners to attend a monthly working session, because their time is the real cost. What makes this worth a working group rather than a grant application is that the interesting result is not whether AI helps one bakery. It is whether a shared implementer across twelve unrelated small businesses is more effective per dollar than twelve separate adoptions, which is a question about coordination, not technology. If it holds, the model replicates to every main street in the country. If it fails, we will know why within a year and the finding is worth publishing either way.\", thread: [{ author: 'r.alvarez', when: '1d', text: \"The shared-implementer question is the actual research question. Sharpen the proposal around it.\" }, { author: 's.reyes', when: '22h', text: \"Owner stipend is right. Their time is the binding constraint every time.\" }, { author: 'k.osei', when: '20h', text: \"Would want the twelve businesses to be genuinely unrelated. Easy to accidentally pick a friendly cluster.\" }] },\n    { id: 'p6', anchor: 'climate', topic: 'Climate Resilience', title: 'Wildfire early-warning: the data exists, the coordination does not', body: 'Three agencies collect overlapping sensor data and none of it reaches the county in time. This is a coordination problem, which makes it ours.', author: 's.reyes', comments: 118, base: 231, hours: 44, full: \"Three agencies collect overlapping sensor and satellite data relevant to wildfire ignition in our region, and none of it reaches the county emergency manager in a usable window. The technical problem is largely solved; the coordination problem is untouched. Each agency has its own retention rules, its own format, and its own reason not to share raw feeds. The county has a spreadsheet and a phone tree. In last season’s two near-misses, the useful signal existed in one agency’s data roughly four hours before the county learned anything. Nobody withheld anything maliciously — the pipe simply does not exist. What we need is a data-sharing agreement, a common format, and one person accountable for the handoff, which is unglamorous work that no vendor will do for free and no agency will lead alone. That makes it ours. The proposal is a twelve-month pilot in one county with published latency metrics: time from signal to county notification, before and after.\", thread: [{ author: 'm.tanaka', when: '1d', text: \"Four hours is the entire story. Lead with the latency number.\" }, { author: 'j.whitcomb', when: '1d', text: \"Who would hold the accountable-handoff role in the pilot? That person is the pilot.\" }, { author: 's.reyes', when: '20h', text: \"County emergency manager, with a working-group liaison for the first six months.\" }] },\n    { id: 'p7', anchor: 'civic', topic: 'Civic Participation', title: 'How do we keep the loudest 2% from setting the agenda?', body: 'Ranking is useful and gameable. Proposing participation weighting by contribution history, fully published, reviewed each cycle.', author: 'a.nkemdi', comments: 172, base: 189, hours: 52, full: \"Ranking is useful and gameable, and any honest design has to start there. In every online community I have participated in, a small and highly engaged minority sets the agenda long before the majority notices there is one. We should assume the same will happen here, and design for it in the open rather than being surprised by it in year three. My proposal is participation weighting by contribution history — not by seniority, not by donation, and not by reputation score in any hidden sense. A member who has shown up across cycles, whose proposals have been reviewed, and whose voting record is consistent carries somewhat more weight in ranking than a brand-new account. Every parameter is published, the weighting is recalculated in public, and the whole scheme is reviewed at each Summit with a standing option to abolish it. The alternative is not neutrality; the alternative is unweighted voting that quietly advantages whoever has the most free time.\", thread: [{ author: 'l.fournier', when: '2d', text: \"The standing option to abolish is what makes this acceptable to me.\" }, { author: 'd.bell', when: '2d', text: \"Skeptical. Weighting by history entrenches the early cohort, which is us.\" }, { author: 'a.nkemdi', when: '1d', text: \"That is the strongest objection and I do not have a full answer. Hence publishing the parameters.\" }, { author: 'r.alvarez', when: '1d', text: \"Try it for one cycle with a hard sunset. Measure whether new accounts disengage.\" }] },\n    { id: 'p8', anchor: 'discovery', topic: 'Scientific Discovery', title: 'Open the failed experiments too', body: 'Funded pilots that did not work are the most valuable thing the Commons could publish. Proposing a standing negative-results archive kept by JAN.', author: 'l.fournier', comments: 44, base: 156, hours: 66, full: \"Funded pilots that did not work are the most valuable thing this community could publish, and they are the first thing every institution buries. Proposing a standing negative-results archive kept by JAN: every authorized project files a closeout, successful or not, with the same structure — what we expected, what we did, what happened, what we would do differently, and what we would tell someone attempting this next. No spin, no reframing failure as learning, just the record. Two conditions make it work. First, filing a negative result must carry no penalty in future authorization; the moment it does, everything becomes a partial success. Second, the archive has to be searchable by problem rather than by project name, or nobody will find the thing that would have saved them a year. Science has known for decades that suppressed negative results distort entire fields. We have the rare chance to start an institution that never acquires the habit.\", thread: [{ author: 'k.osei', when: '2d', text: \"No penalty for filing is the load-bearing condition. Everything else is format.\" }, { author: 'm.tanaka', when: '2d', text: \"Searchable by problem, not project. This is the detail that gets ignored and then costs a year.\" }, { author: 'j.whitcomb', when: '1d', text: \"Would read this archive before every proposal I write.\" }] }\n  ].concat(this.predictivePosts());\n\n  predictivePosts() { return [\n    {\"id\":\"dlt-r1-1\",\"anchor\":\"predictive\",\"topic\":\"Predictive AI Market\",\"title\":\"Will a U.S. government AI evaluation program publicly report that a frontier model demonstrated materially higher cyber capability than the most capable model it evaluated in 2026?\",\"body\":\"Round 1 · Original 30 long-term questions · Q1 · AI Safety. Resolves by Dec. 31, 2027. Resolution source: NIST/CAISI.\",\"author\":\"dlt\",\"comments\":0,\"base\":160,\"hours\":1,\"full\":\"Will s && e.target.files[0]; e.target.value = '';\n    const p = (this.allPostsById || {})[this.state.modalId];\n    if (!f || !p || !this.canEditPost(p)) return;\n    const key = p.localId || p.id;\n    this.shrinkImage(f).then(blob => this.idbGet(key).then(prev => {\n      const rec = Object.assign({}, prev || {}, { image: blob });\n      return this.idbPut(key, rec).then(() => {\n        const url = URL.createObjectURL(blob);\n        this.setState(st => ({ mediaUrls: Object.assign({}, st.mediaUrls, { [key]: Object.assign({}, st.mediaUrls[key] || {}, { image: url }), [p.id]: Object.assign({}, st.mediaUrls[p.id] || {}, { image: url }) }) }));\n        const mine = (this.state.mine || []).map(m => m.id === key ? Object.assign({}, m, { hasMedia: true }) : m);\n        try { localStorage.setItem(this.MINE_STORE, JSON.stringify(mine)); } catch (e2) {}\n        this.setState({ mine: mine });\n        const row = p.rowId ? p : (this.state.remote || []).filter(r => r.localId === key)[0];\n        if (row && row.rowId) this.uploadMedia(key, row.rowId);\n      });\n    }));\n  };\n  canEditPost(p) {\n    if (!p) return false;\n    { const cl = this.claims()[p.id]; if (cl && cl === this.sessionKey()) return true; }\n    if (this.isAdminView()) return true;\n    if (p.mine && !p.ownerKey) return true;\n    const me = this.sessionKey(); if (!me) return false;\n    if (p.ownerKey) return p.ownerKey === me;\n    if (p.mine) return true;\n    // Older posts saved before ownership was recorded: match the author name to this member.\n    const a = String(p.author || '').trim().toLowerCase();\n    if (!a || a === 'a member') return false;\n    const names = [this.displayName ? this.displayName(me) : '', me, me.split('@')[0], this.state.member, this.state.draftMember].map(x => String(x || '').trim().toLowerCase()).filter(Boolean);\n    return names.indexOf(a) >= 0;\n  }\n  openCtx = (p, e) => {\n    if (e && e.preventDefault) e.preventDefault();\n    const W = window.innerWidth, H = window.innerHeight;\n    const x = Math.max(8, Math.min((e && e.clientX) || 40, W - 240));\n    const y = Math.max(8, Math.min((e && e.clientY) || 40, H - 240));\n    this.setState({ ctx: { id: p.id, x: x, y: y }, ctxCopied: false });\n  };\n  closeCtx = (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ ctx: null }); };\n  ctxPost() { return this.state.ctx ? (this.allPostsById || {})[this.state.ctx.id] : null; }\n  ctxOpenPost = () => { const id = this.state.ctx && this.state.ctx.id; this.setState({ ctx: null }); if (id) this.openPost(id); };\n  ctxDelete = () => { const id = this.state.ctx && this.state.ctx.id; this.setState({ ctx: null }); if (!id) return; this.openPost(id); setTimeout(() => this.askDelete(), 0); };\n  ctxCopy = () => {\n    const p = this.ctxPost(); if (!p) return;\n    const u = new URL(window.location.href); u.hash = p.anchor || p.id;\n    const done = () => { this.setState({ ctxCopied: true }); setTimeout(() => this.setState({ ctx: null, ctxCopied: false }), 700); };\n    try { navigator.clipboard.writeText(u.toString()).then(done, done); } catch (e) { done(); }\n  };\n  ctxEdit = () => { const p = this.ctxPost(); this.setState({ ctx: null }); this.startEdit(p); };\n  modalEdit = () => { const p = (this.allPostsById || {})[this.state.modalId]; this.setState({ delAsking: false }); this.startEdit(p); };\n  startEdit(p) {\n    if (!p || !this.canEditPost(p)) return;\n    this.setState({ editId: p.id, editTitle: p.title || '', editBody: p.full || p.body || '', editTopic: p.topic || 'Workforce', editError: '' });\n  }\n  closeEdit = () => this.setState({ editId: null, editError: '' });\n  onEditTitle = (e) => this.setState({ editTitle: e.target.value, editError: '' });\n  onEditBody = (e) => this.setState({ editBody: e.target.value, editError: '' });\n  saveEdit = () => {\n    const s = this.state; const p = (this.allPostsById || {})[s.editId];\n    if (!p || !this.canEditPost(p)) { this.setState({ editError: 'Only the author (or an admin) can edit this post.' }); return; }\n    const title = (s.editTitle || '').trim(), body = (s.editBody || '').trim(), topic = s.editTopic || p.topic;\n    if (!title) { this.setState({ editError: 'Give the post a title.' }); return; }\n    if (body.length < 20) { this.setState({ editError: 'Add a few sentences.' }); return; }\n    const now = Date.now(); const me = this.sessionKey() || 'admin';\n    const prev = { title: p.title || '', body: p.full || p.body || '', topic: p.topic || '' };\n    const patch = { title: title, body: body, full: body, topic: topic, editedAt: now };\n    let mine = s.mine || [];\n    const isMine = mine.some(m => m.id === p.id || m.id === p.localId);\n    if (isMine) {\n      mine = mine.map(m => (m.id === p.id || m.id === p.localId) ? Object.assign({}, m, patch) : m);\n      try { localStorage.setItem(this.MINE_STORE, JSON.stringify(mine)); } catch (e) {}\n    }\n    const edits = Object.assign({}, s.edits, { [p.id]: patch });\n    if (p.localId) edits[p.localId] = patch;\n    try { localStorage.setItem(this.EDIT_STORE, JSON.stringify(edits)); } catch (e) {}\n    this.setState({ mine: mine, edits: edits, editId: null, editError: '' });\n    if (this.isConfigured()) {\n      const inst = window.__instant;\n      const lid = p.localId || (p.mine ? p.id : '');\n      const row = (s.remote || []).filter(r => r.rowId && (r.id === p.id || (lid && r.localId === lid)))[0];\n      try {\n        if (row) inst.db.transact(inst.tx.commonsPosts[row.rowId].update(Object.assign({ title: title, body: body, topic: topic, editedAt: now }, !row.ownerKey && this.sessionKey() ? { ownerKey: this.sessionKey() } : {})));\n        inst.db.transact(inst.tx.postEdits[inst.id()].update({ postId: p.id, localId: lid, editedBy: this.displayName ? this.displayName(me) : me, editedByKey: me, previous: prev, next: { title: title, body: body, topic: topic }, createdAt: now }));\n      } catch (e) {}\n    }\n  };\n  applyEdits(p) { const e = this.state.edits[p.id] || (p.localId && this.state.edits[p.localId]); return e && (!p.editedAt || e.editedAt >= p.editedAt) ? Object.assign({}, p, e) : p; }\n  ctxVals(topics) {\n    const s = this.state; const p = this.ctxPost(); const can = this.canEditPost(p);\n    return {\n      ctxOpen: !!(s.ctx && p), ctxX: s.ctx ? s.ctx.x : 0, ctxY: s.ctx ? s.ctx.y : 0, ctxTitle: p ? p.title : '',\n      ctxCanEdit: !!p && can, ctxNoEdit: !!p && !can,\n      ctxNoEditMsg: this.sessionKey() ? 'Only the author can edit this post.' : 'Your post? Log in (Coin-Up ?) to edit it.',\n      ctxCopyLabel: s.ctxCopied ? 'Link copied ✓' : 'Copy link',\n      modalCanEdit: !!s.modalId && this.canEditPost((this.allPostsById || {})[s.modalId]), modalEdit: this.modalEdit,\n      modalCanClaim: !!s.modalId && this.canClaimPost((this.allPostsById || {})[s.modalId]), claimPost: this.claimPost, onReplaceImage: this.onReplaceImage,\n      modalTextCursor: s.modalId && this.canEditPost((this.allPostsById || {})[s.modalId]) ? 'text' : 'auto',\n      modalEditTitle: s.modalId && this.canEditPost((this.allPostsById || {})[s.modalId]) ? 'Click to edit' : '',\n      closeCtx: this.closeCtx, ctxOpenPost: this.ctxOpenPost, ctxEdit: this.ctxEdit, ctxCopy: this.ctxCopy, ctxDelete: this.ctxDelete,\n      editOpen: !!s.editId, editTitle: s.editTitle, editBody: s.editBody, editError: s.editError,\n      onEditTitle: this.onEditTitle, onEditBody: this.onEditBody, saveEdit: this.saveEdit, closeEdit: this.closeEdit,\n      editTopics: topics.filter(x => x !== 'All').map(x => {\n        const st = this.styleFor(x); const on = s.editTopic === x;\n        return { label: x, iconCss: this.iconCssFor(st.key), border: on ? st.color : '#e2e2e2', bg: on ? st.tint : '#ffffff', color: on ? st.color : '#6a6a6a', onClick: () => this.setState({ editTopic: x }) };\n      })\n    };\n  }\n  DEL_STORE = 'jai-commons-deleted';\n  loadDeletions() { try { const r = localStorage.getItem(this.DEL_STORE); if (r) this.setState({ deletions: JSON.parse(r) }
