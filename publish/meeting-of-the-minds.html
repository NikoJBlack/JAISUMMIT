document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

n      <\u002Fa>\n      <a href=\"./issues-topics-posts.html#civic\" style=\"width:170px; flex:none; text-decoration:none;\">\n        <image-slot id=\"mom-topic-civic\" src=\"6fb9da80-a3f9-4670-aaa0-b0d535bc301b\" style=\"width:100%; height:110px; object-fit:cover;\" shape=\"rounded\" radius=\"12\" placeholder=\"Civic Participation image\"><\u002Fimage-slot>\n        <div style=\"margin-top:8px; font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:11px; letter-spacing:0.06em; text-transform:uppercase; color:#2f2f2f;\">Civic Participation<\u002Fdiv>\n      <\u002Fa>\n      <a href=\"./issues-topics-posts.html#discovery\" style=\"width:170px; flex:none; text-decoration:none;\">\n        <image-slot id=\"mom-topic-discovery\" src=\"752ecd44-db5f-4e12-82b9-d1260ed2fe7a\" style=\"width:100%; height:110px; object-fit:cover;\" shape=\"rounded\" radius=\"12\" placeholder=\"Scientific Discovery image\"><\u002Fimage-slot>\n        <div style=\"margin-top:8px; font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:11px; letter-spacing:0.06em; text-transform:uppercase; color:#2f2f2f;\">Scientific Discovery<\u002Fdiv>\n      <\u002Fa>\n        <\u002Fdiv>\n        <div aria-hidden=\"true\" style=\"display:flex; gap:14px;\">\n      <a href=\"./issues-topics-posts.html#workforce\" style=\"width:170px; flex:none; text-decoration:none;\">\n        <image-slot id=\"mom-topic-workforce\" src=\"546e2842-db22-4646-87b0-817486fd8545\" style=\"width:100%; height:110px; object-fit:cover;\" shape=\"rounded\" radius=\"12\" placeholder=\"Workforce image\"><\u002Fimage-slot>\n        <div style=\"margin-top:8px; font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:11px; letter-spacing:0.06em; text-transform:uppercase; color:#2f2f2f;\">Workforce<\u002Fdiv>\n      <\u002Fa>\n      <a href=\"./issues-topics-posts.html#education\" style=\"width:170px; flex:none; text-decoration:none;\">\n        <image-slot id=\"mom-topic-education\" src=\"bc9ab335-14d1-4f83-9c29-8c2134698b95\" style=\"width:100%; height:110px; object-fit:cover;\" shape=\"rounded\" radius=\"12\" placeholder=\"Education image\"><\u002Fimage-slot>\n        <div style=\"margin-top:8px; font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:11px; letter-spacing:0.06em; text-transform:uppercase; color:#2f2f2f;\">Education<\u002Fdiv>\n      <\u002Fa>\n      <a href=\"./issues-topics-posts.html#healthcare\" style=\"width:170px; flex:none; text-decoration:none;\">\n        <image-slot id=\"mom-topic-healthcare\" src=\"fd1d8828-adec-48a2-a4b3-ab3091e29089\" style=\"width:100%; height:110px; object-fit:cover;\" shape=\"rounded\" radius=\"12\" placeholder=\"Healthcare image\"><\u002Fimage-slot>\n        <div style=\"margin-top:8px; font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:11px; letter-spacing:0.06em; text-transform:uppercase; color:#2f2f2f;\">Healthcare<\u002Fdiv>\n      <\u002Fa>\n      <a href=\"./issues-topics-posts.html#opportunity\" style=\"width:170px; flex:none; text-decoration:none;\">\n        <image-slot id=\"mom-topic-opportunity\" src=\"3c647819-44f1-407a-bf51-63c2d431ecbf\" style=\"width:100%; height:110px; object-fit:cover;\" shape=\"rounded\" radius=\"12\" placeholder=\"Opportunity image\"><\u002Fimage-slot>\n        <div style=\"margin-top:8px; font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:11px; letter-spacing:0.06em; text-transform:uppercase; color:#2f2f2f;\">Opportunity<\u002Fdiv>\n      <\u002Fa>\n      <a href=\"./issues-topics-posts.html#climate\" style=\"width:170px; flex:none; text-decoration:none;\">\n        <image-slot id=\"mom-topic-climate\" src=\"13ac565f-f98a-49a0-ad70-9b53224a4252\" style=\"width:100%; height:110px; object-fit:cover;\" shape=\"rounded\" radius=\"12\" placeholder=\"Climate image\"><\u002Fimage-slot>\n        <div style=\"margin-top:8px; font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:11px; letter-spacing:0.06em; text-transform:uppercase; color:#2f2f2f;\">Climate<\u002Fdiv>\n      <\u002Fa>\n      <a href=\"./issues-topics-posts.html#governance\" style=\"width:170px; flex:none; text-decoration:none;\">\n        <image-slot id=\"mom-topic-governance\" src=\"c9658a83-69ee-486d-9ee7-3d8dd2e024f4\" style=\"width:100%; height:110px; object-fit:cover;\" shape=\"rounded\" radius=\"12\" placeholder=\"Governance image\"><\u002Fimage-slot>\n        <div style=\"margin-top:8px; font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:11px; letter-spacing:0.06em; text-transform:uppercase; color:#2f2f2f;\">AI Governance<\u002Fdiv>\n      <\u002Fa>\n      <a href=\"./issues-topics-posts.html#civic\" style=\"width:170px; flex:none; text-decoration:none;\">\n        <image-slot id=\"mom-topic-civic\" src=\"6fb9da80-a3f9-4670-aaa0-b0d535bc301b\" style=\"width:100%; height:110px; object-fit:cover;\" shape=\"rounded\" radius=\"12\" placeholder=\"Civic Participation image\"><\u002Fimage-slot>\n        <div style=\"margin-top:8px; font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:11px; letter-spacing:0.06em; text-transform:uppercase; color:#2f2f2f;\">Civic Participation<\u002Fdiv>\n      <\u002Fa>\n      <a href=\"./issues-topics-posts.html#discovery\" style=\"width:170px; flex:none; text-decoration:none;\">\n        <image-slot id=\"mom-topic-discovery\" src=\"752ecd44-db5f-4e12-82b9-d1260ed2fe7a\" style=\"width:100%; height:110px; object-fit:cover;\" shape=\"rounded\" radius=\"12\" placeholder=\"Scientific Discovery image\"><\u002Fimage-slot>\n        <div style=\"margin-top:8px; font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:11px; letter-spacing:0.06em; text-transform:uppercase; color:#2f2f2f;\">Scientific Discovery<\u002Fdiv>\n      <\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"max-width:640px; width:100%; margin-top:clamp(48px,8vh,72px);\">\n    <p style=\"font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">Artificial intelligence is changing how we work, learn, create, and live, and the future will not be shaped by one company or one voice. It will be shaped by people willing to learn from each other.<\u002Fp>\n\n    <p style=\"font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">As ideas mature within the Commons, some demonstrate exceptional promise. Those ideas move into the second phase of the annual cycle: the Meeting of the Minds. Entrepreneurs, educators, researchers, artists, students, policy makers, and curious citizens are selected for expertise, lived experience, professional perspective, or demonstrated commitment to a particular challenge, and they take up a simple question: how can AI expand human potential and serve the common good? The objective is not to debate whether a problem exists. The objective is to design solutions.<\u002Fp>\n\n    <p style=\"font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">Bring your questions, your ideas, and your work. Your voice stays yours. If others want to learn from your ideas, we encourage them to visit your website, read your research, listen to your podcast, and bring that perspective back to the circle. What you find here reflects our best thinking today — a beginning, not a finish line.<\u002Fp>\n\n    <p style=\"font-family:Georgia, 'Times New Roman', serif; font-style:italic; font-size:clamp(18px,3.4vw,22px); line-height:1.55; color:#0f9d76; margin:0 0 22px;\">Pull up a chair. The circle is forming. We’d be honored to hear your perspective.<\u002Fp>\n\n    <p style=\"font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:clamp(20px,4vw,24px); color:#2f2f2f; margin:36px 0 18px;\">The Working Groups<\u002Fp>\n    <p style=\"font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 18px;\">Groups are organized around specific themes, and new ones emerge as the community identifies new priorities.<\u002Fp>\n    <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:10px 22px; margin:0 0 26px;\">\n      <div style=\"font-size:clamp(16px,3vw,18px); line-height:1.5; color:#4a4a4a;\">Workforce transformation<\u002Fdiv>\n      <div style=\"font-size:clamp(16px,3vw,18px); line-height:1.5; color:#4a4a4a;\">Education<\u002Fdiv>\n      <div style=\"font-size:clamp(16px,3vw,18px); line-height:1.5; color:#4a4a4a;\">Healthcare<\u002Fdiv>\n      <div style=\"font-size:clamp(16px,3vw,18px); line-height:1.5; color:#4a4a4a;\">Entrepreneurship<\u002Fdiv>\n      <div style=\"font-size:clamp(16px,3vw,18px); line-height:1.5; color:#4a4a4a;\">Scientific discovery<\u002Fdiv>\n      <div style=\"font-size:clamp(16px,3vw,18px); line-height:1.5; color:#4a4a4a;\">Government innovation<\u002Fdiv>\n      <div style=\"font-size:clamp(16px,3vw,18px); line-height:1.5; color:#4a4a4a;\">Climate resilience<\u002Fdiv>\n      <div style=\"font-size:clamp(16px,3vw,18px); line-height:1.5; color:#4a4a4a;\">Civic participation<\u002Fdiv>\n      <div style=\"font-size:clamp(16px,3vw,18px); line-height:1.5; color:#4a4a4a;\">Economic opportunity<\u002Fdiv>\n      <div style=\"font-size:clamp(16px,3vw,18px); line-height:1.5; color:#4a4a4a;\">AI governance<\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">Each group functions as a multidisciplinary design studio. Researchers contribute evidence. Entrepreneurs contribute practical experience. Community leaders contribute lived reality. Investors contribute financial insight. Policy experts contribute regulatory perspective. AI systems contribute analysis, synthesis, and scenario planning. Together they produce something none could create independently.<\u002Fp>\n\n    <p style=\"font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:clamp(20px,4vw,24px); color:#2f2f2f; margin:36px 0 18px;\">The Deliverables<\u002Fp>\n    <p style=\"font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 18px;\">Every Meeting of the Minds concludes with tangible outputs. Each proposal includes:<\u002Fp>\n    <div style=\"display:flex; flex-direction:column; gap:9px; margin:0 0 26px;\">\n      <div style=\"font-size:clamp(16px,3vw,18px); line-height:1.5; color:#4a4a4a;\">A clearly defined societal challenge<\u002Fdiv>\n      <div style=\"font-size:clamp(16px,3vw,18px); line-height:1.5; color:#4a4a4a;\">The opportunity created by AI<\u002Fdiv>\n      <div style=\"font-size:clamp(16px,3vw,18px); line-height:1.5; color:#4a4a4a;\">A proposed solution<\u002Fdiv>\n      <div style=\"font-size:clamp(16px,3vw,18px); line-height:1.5; color:#4a4a4a;\">Stakeholders and beneficiaries<\u002Fdiv>\n      <div style=\"font-size:clamp(16px,3vw,18px); line-height:1.5; color:#4a4a4a;\">Governance considerations and ethical implications<\u002Fdiv>\n      <div style=\"font-size:clamp(16px,3vw,18px); line-height:1.5; color:#4a4a4a;\">Budget requirements and success metrics<\u002Fdiv>\n      <div style=\"font-size:clamp(16px,3vw,18px); line-height:1.5; color:#4a4a4a;\">Pilot implementation strategy and scaling potential<\u002Fdiv>\n      <div style=\"font-size:clamp(16px,3vw,18px); line-height:1.5; color:#4a4a4a;\">Risks and mitigation plans<\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0;\">By the conclusion of this phase, ideas are no longer conversations. They are investment-ready initiatives, carried forward to the January Summit where the community decides what gets built.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"display:flex; gap:24px; margin-top:clamp(48px,8vh,72px); font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:12px; letter-spacing:0.1em; text-transform:uppercase;\">\n    <a href=\"./home.html\" style=\"color:#0f9d76; text-decoration:none;\">← Home<\u002Fa>\n    <a href=\"./charter.html#cycle\" style=\"color:#0f9d76; text-decoration:none;\">The Virtuous Cycle →<\u002Fa>\n  <\u002Fdiv>\n  <div style=\"text-align:center; font-family:Helvetica, Arial, sans-serif; font-size:12px; color:#a8a8a8; margin-top:56px;\">© 2026 DL Thomas. All Rights Reserved.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  railHover = -1;\n  railDefs = [\n    { label: 'Majaii', href: './index.html', always: true },\n    { label: 'Invitation', href: './home.html', always: true },\n    { label: 'JanuaryAI Summit 2027', href: './summit.html', always: true },\n    { label: 'Partners, Donors, Sponsors', href: './sponsors.html', always: true },\n    { label: '', href: '', inert: true },\n    { label: 'Open Letter', href: './open-letter.html' },\n    { label: 'Meeting of the Minds', href: '#' },\n    { label: 'Issues, Topics, Posts', href: './issues-topics-posts.html' },\n    { label: 'Global AI Community', href: './global-ai-community.html' },\n    { label: '', href: '', inert: true },\n    { label: 'JAI-Charter', href: './charter.html#plan', always: true },\n    { label: '', href: '', inert: true },\n    { label: 'Contact', href: './contact.html' }\n  ];\n\n  railWide = typeof window !== 'undefined' ? window.innerWidth >= 700 : true;\n\n  railOpen = false;\n  railLockedByTouch = false;\n  setRailOpen = (v) => {\n    if (this.railLockedByTouch) return;\n    if (this.railOpen !== v) { this.railOpen = v; this.forceUpdate(); }\n  };\n  toggleRailOpen = () => {\n    this.railOpen = !this.railOpen;\n    this.railLockedByTouch = this.railOpen;\n    this.railTouchedAt = Date.now();\n    this.forceUpdate();\n  };\n  railTap = (e) => {\n    if (e && e.target && e.target.closest && e.target.closest('[href]')) return;\n    if (this.railTouchedAt && Date.now() - this.railTouchedAt < 700) return;\n    this.toggleRailOpen();\n  };\n\n  setRailHover = (i) => { this.railHover = i; this.forceUpdate(); };\n\n  watchRailWidth() {\n    this.onRailResize = () => {\n      const wide = window.innerWidth >= 700;\n      if (wide !== this.railWide) { this.railWide = wide; this.forceUpdate(); }\n    };\n    window.addEventListener('resize', this.onRailResize);\n    this.onRailResize();\n  }\n\n  buildRailItems() {\n    return this.railDefs.map((d, i) => ({\n      label: d.label,\n      href: d.href,\n      dotBg: this.railHover === i ? '#0f9d76' : '#a7ddc9',\n      dotScale: this.railHover === i ? 'scale(1.45)' : 'scale(1)',\n      labelOpacity: (d.label && (this.railWide || this.railOpen || this.railHover === i)) ? 1 : 0,\n      labelPointer: (d.label && (this.railWide || this.railOpen || this.railHover === i)) ? 'auto' : 'none',\n      onClick: (e) => {\n        e.preventDefault();\n        if (d.inert) return;\n        const h = d.href;\n        if (h.charAt(0) === '#') { window.scrollTo({ top: 0, behavior: 'smooth' }); return; }\n        const u = new URL(h, window.location.href);\n        const hash = u.hash;\n        u.hash = '';\n        u.search = window.location.search;\n        window.location.href = u.toString() + hash;\n      },\n      onEnter: () => this.setRailHover(i),\n      onLeave: () => this.setRailHover(-1)\n    }));\n  }\n\n  componentDidMount() { this.watchRailWidth(); }\n\n  renderVals() { return { railItems: this.buildRailItems(), railEnter: () => this.setRailOpen(true), railLeave: () => this.setRailOpen(false), railToggle: this.toggleRailOpen, railTap: this.railTap }; }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
