  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"c09985fc-649e-4fcc-b4a5-b7eadb24ff67\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<style>\n  .majaii-navscroll { scrollbar-width:none; -ms-overflow-style:none; }\n  .majaii-navscroll::-webkit-scrollbar { display:none; }\n  /* Mouse/trackpad only: enlarge the hovered pill for readability. Touch devices keep the resting size. */\n  @media (hover: hover) and (pointer: fine) {\n    .majaii-navscroll > a { transition:transform 0.16s ease, font-size 0.16s ease, background 0.18s ease, color 0.18s ease, box-shadow 0.18s ease; }\n    .majaii-navscroll > a:hover { font-size:14px !important; letter-spacing:0.04em !important; transform:translateY(-1px); box-shadow:0 4px 14px rgba(15,157,118,0.22) !important; z-index:2; }\n  }\n  body { margin: 0; background: #ffffff; -webkit-text-size-adjust: 100%; overflow-x: hidden; }\n  a { color: #0f9d76; }\n  a:hover { color: #0b7a5c; }\n  @keyframes orbitEllipse {\n    0%    { transform: translate(var(--rx), 0); }\n    25%   { transform: translate(0, var(--ry)); }\n    50%   { transform: translate(calc(var(--rx) * -1), 0); }\n    75%   { transform: translate(0, calc(var(--ry) * -1)); }\n    100%  { transform: translate(var(--rx), 0); }\n  }\n<\u002Fstyle>\n<script type=\"module\">\n  import { init, tx, id } from 'https://esm.sh/@instantdb/core@0.17.31';\n  const APP_ID = '1610ad39-5a25-423e-913a-483b67bfed79';\n  window.__instant = { db: init({ appId: APP_ID }), tx, id, appId: APP_ID };\n<\u002Fscript>\n<\u002Fhelmet>\n<div style=\"background:#ffffff; min-height:100vh; box-sizing:border-box; display:flex; flex-direction:column; align-items:center; padding:clamp(56px,12vh,120px) clamp(24px,7vw,80px) 80px; font-family:Georgia, 'Times New Roman', serif;\">\n<nav style=\"position:sticky; top:0; z-index:60; align-self:stretch; width:auto; margin:0 0 clamp(18px,3vh,28px); background:rgba(255,255,255,0.94); backdrop-filter:blur(8px); padding:10px 0;\" style-before=\"content:''; position:absolute; left:0; top:0; bottom:0; width:38px; pointer-events:none; z-index:2; background:linear-gradient(to right, #ffffff, rgba(255,255,255,0));\" style-after=\"content:''; position:absolute; right:0; top:0; bottom:0; width:38px; pointer-events:none; z-index:2; background:linear-gradient(to left, #ffffff, rgba(255,255,255,0));\">\n  <div class=\"majaii-navscroll\" ref=\"{{ navScrollRef }}\" style=\"display:flex; flex-wrap:nowrap; gap:8px; overflow-x:auto; overflow-y:hidden; scroll-snap-type:x proximity; -webkit-overflow-scrolling:touch; scroll-behavior:smooth; padding:6px 30px;\">\n    <sc-for list=\"{{ navItems }}\" as=\"item\" hint-placeholder-count=\"10\">\n      <a href=\"{{ item.href }}\" data-nav-index=\"{{ item.index }}\" sc-camel-on-click=\"{{ item.onClick }}\" style=\"flex:none; scroll-snap-align:center; display:inline-flex; align-items:center; min-height:34px; padding:0 16px; border-radius:999px; text-decoration:none; white-space:nowrap; font-family:'Arial Black','Helvetica Neue',Helvetica,sans-serif; font-weight:900; font-size:11px; letter-spacing:0.03em; text-transform:uppercase; box-shadow:0 1px 8px rgba(0,0,0,0.10); transition:background 0.2s ease, color 0.2s ease, border-color 0.2s ease; background:{{ item.bg }}; color:{{ item.color }}; border:1px solid {{ item.border }};\">{{ item.label }}<\u002Fa>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fnav>\n\n  <div style=\"width:100%; max-width:1000px;\">\n    <img src=\"f119034e-355c-4a4e-8f2c-1d2b6cc22508\" alt=\"Dot-portrait of the founder\" style=\"display:block; width:clamp(180px,26vw,280px); height:auto; margin-bottom:clamp(18px,3vh,28px);\">\n    <div style=\"font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; text-transform:uppercase; line-height:0.92; letter-spacing:-0.015em; font-size:clamp(30px,7vw,60px);\">\n      <div style=\"color:#c7c9c8;\">Become<\u002Fdiv>\n      <div style=\"color:#8fd6bd; margin-top:clamp(-6px,-1.6vw,-11px);\">A<\u002Fdiv>\n      <div style=\"color:#c7c9c8; margin-top:clamp(-6px,-1.6vw,-11px);\">Partner<\u002Fdiv>\n      <div style=\"color:#8fd6bd; margin-top:clamp(-6px,-1.6vw,-11px);\">Donor<\u002Fdiv>\n      <div style=\"color:#c7c9c8; margin-top:clamp(-6px,-1.6vw,-11px);\">Sponsor<\u002Fdiv>\n    <\u002Fdiv>\n\n    <p style=\"margin:clamp(26px,4vh,40px) 0 0; max-width:680px; font-size:clamp(17px,2.4vw,21px); line-height:1.6; color:#4a4a4a; text-wrap:pretty;\">Sponsorship pays for the room, the record, and the seats of people who could not otherwise be there. It does not buy a vote, a seat on the board, or a line in the Charter — the Commons decides what proceeds, and that stays true no matter who writes the check.<\u002Fp>\n\n    <div style=\"display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-top:26px;\">\n      <span style=\"background:#eef7f3; color:#0f9d76; font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:10px; letter-spacing:0.1em; text-transform:uppercase; padding:8px 14px; border-radius:999px;\">JanuaryAI Project Summit<\u002Fspan>\n      <span style=\"background:#eef7f3; color:#0f9d76; font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:10px; letter-spacing:0.1em; text-transform:uppercase; padding:8px 14px; border-radius:999px;\">Boulder / Denver<\u002Fspan>\n      <a href=\"./sponsor-handout.html?print=1\" target=\"_blank\" rel=\"noopener\" sc-camel-on-click=\"{{ printHandout }}\" style=\"background:#eef7f3; color:#0d1512; text-decoration:none; cursor:pointer; font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:10px; letter-spacing:0.1em; text-transform:uppercase; padding:8px 14px; border-radius:999px;\" style-hover=\"background:#c9ecdf;\">Print this Page<\u002Fa>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:clamp(40px,7vh,64px); border-top:1px solid #e2e2e2; padding-top:14px; font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:#0f9d76;\">Sponsor options<\u002Fdiv>\n\n    <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:clamp(16px,2.4vw,24px); margin-top:20px;\">\n      <sc-for list=\"{{ tiers }}\" as=\"tier\" hint-placeholder-count=\"5\">\n        <div style=\"border:1px solid #ececec; border-radius:16px; padding:22px 22px 24px; display:flex; flex-direction:column; gap:12px; background:#ffffff;\">\n          <div style=\"height:6px; width:56px; border-radius:999px; background:{{ tier.color }};\"><\u002Fdiv>\n          <p style=\"margin:0; font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; text-transform:uppercase; font-size:clamp(17px,2.2vw,21px); line-height:1.05; letter-spacing:-0.01em; color:#2f2f2f;\">{{ tier.name }}<\u002Fp>\n          <p style=\"margin:0; font-family:Helvetica, Arial, sans-serif; font-weight:700; font-size:20px; color:#0f9d76;\">{{ tier.amount }}<\u002Fp>\n          <p style=\"margin:0; font-size:16px; line-height:1.55; color:#5a5a5a; text-wrap:pretty;\">{{ tier.funds }}<\u002Fp>\n          <div style=\"display:flex; flex-direction:column; gap:7px; margin-top:2px;\">\n            <sc-for list=\"{{ tier.gets }}\" as=\"g\" hint-placeholder-count=\"3\">\n              <div style=\"display:flex; gap:9px; align-items:flex-start; font-family:Helvetica, Arial, sans-serif; font-size:14px; line-height:1.45; color:#4a4a4a;\">\n                <span style=\"flex:none; width:7px; height:7px; border-radius:50%; margin-top:6px; background:{{ tier.color }};\"><\u002Fspan>\n                <span>{{ g.text }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ tier.onRsvp }}\" style=\"margin-top:auto; align-self:flex-start; cursor:pointer; border:none; background:#c9ecdf; color:#0d1512; font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; text-transform:uppercase; font-size:11px; letter-spacing:0.12em; padding:13px 22px; border-radius:6px;\" style-hover=\"background:#a7ddc9;\">RSVP<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:clamp(40px,7vh,64px); border-top:1px solid #e2e2e2; padding-top:26px; display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:clamp(18px,3vw,30px);\">\n      <div>\n        <p style=\"margin:0; font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; text-transform:uppercase; font-size:clamp(16px,2vw,19px); color:#2f2f2f;\">What every sponsor gets<\u002Fp>\n        <p style=\"margin:10px 0 0; font-size:16px; line-height:1.6; color:#5a5a5a;\">Your name on the published record of the Summit, the full proceedings and vote log, and a written account of exactly what your money paid for.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <p style=\"margin:0; font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; text-transform:uppercase; font-size:clamp(16px,2vw,19px); color:#2f2f2f;\">What no sponsor gets<\u002Fp>\n        <p style=\"margin:10px 0 0; font-size:16px; line-height:1.6; color:#5a5a5a;\">Agenda control, a vote, veto over a working group, or a private edit to the Charter. Every dollar is disclosed; influence is not for sale.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:clamp(36px,6vh,52px); background:#eef7f3; border-radius:16px; padding:clamp(22px,3vw,32px); display:flex; flex-wrap:wrap; align-items:center; gap:18px; justify-content:space-between;\">\n      <div style=\"min-width:240px; flex:1;\">\n        <p style=\"margin:0; font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; text-transform:uppercase; font-size:clamp(17px,2.2vw,22px); line-height:1.1; color:#0d1512;\">Not sure how to fund and contribute?<\u002Fp>\n        <p style=\"margin:10px 0 0; font-size:16px; line-height:1.6; color:#3f5049;\">Tell us the how to match your contribution to your cause. What do you care about? Privately share your interest and your contribution. We will match it to the part of the Summit that needs it and put it in writing.<\u002Fp>\n      <\u002Fdiv>\n      <button sc-camel-on-click=\"{{ openRsvpAny }}\" style=\"flex:none; cursor:pointer; border:none; background:#c9ecdf; color:#0d1512; font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; text-transform:uppercase; font-size:12px; letter-spacing:0.12em; padding:16px 26px; border-radius:6px;\" style-hover=\"background:#a7ddc9;\">RSVP<\u002Fbutton>\n    <\u002Fdiv>\n\n    <div style=\"display:flex; gap:24px; margin-top:clamp(48px,8vh,72px); font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:12px; letter-spacing:0.1em; text-transform:uppercase;\">\n      <a href=\"./summit.html\" style=\"color:#0f9d76; text-decoration:none;\">← Summit 2027<\u002Fa>\n      <a href=\"./charter.html#funding\" style=\"color:#0f9d76; text-decoration:none;\">Funding in the Charter →<\u002Fa>\n    <\u002Fdiv>\n    <div style=\"display:flex; flex-direction:column; align-items:center; gap:10px; margin-top:clamp(40px,7vh,64px); text-align:center;\">\n      <p style=\"margin:0; max-width:520px; font-family:Georgia, serif; font-style:italic; font-size:12px; line-height:1.65; color:#a8a8a8;\">The JanuaryAI Summit is a project developed and produced by<br>BODEN Summit LLC, a Colorado company.<br>(303) 720-6633<\u002Fp>\n      <p style=\"margin:0; font-family:Georgia, serif; font-style:italic; font-size:12px; line-height:1.65; color:#a8a8a8;\">© 2026 DL Thomas. All Rights Reserved.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:{{ rsvpDisplay }}; position:fixed; inset:0; z-index:200; background:rgba(13,21,18,0.72); align-items:flex-start; justify-content:center; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; padding:calc(clamp(14px,3vw,40px) + env(safe-area-inset-top)) calc(clamp(14px,3vw,40px) + env(safe-area-inset-right)) calc(clamp(14px,3vw,40px) + env(safe-area-inset-bottom)) calc(clamp(14px,3vw,40px) + env(safe-area-inset-left));\">\n    <div style=\"width:100%; max-width:900px; background:#ffffff; border-radius:8px; box-shadow:0 24px 70px rgba(0,0,0,0.35); padding:clamp(18px,2.6vw,30px); box-sizing:border-box;\">\n      <div style=\"display:flex; justify-content:flex-end; margin-bottom:6px;\">\n        <button sc-camel-on-click=\"{{ closeRsvp }}\" title=\"Close\" style=\"cursor:pointer; background:none; border:none; padding:0; line-height:1;\">\n          <img src=\"0a108179-bce4-4b1a-a5d1-64ba51620c8f\" alt=\"Close\" style=\"width:32px; height:32px; display:block;\">\n        <\u002Fbutton>\n      <\u002Fdiv>\n\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:clamp(20px,3vw,34px); align-items:start;\">\n        <div>\n          <p style=\"margin:0; text-align:center; font-family:Helvetica, Arial, sans-serif; font-weight:700; font-size:22px; color:#3a3a3a;\">Sponsor the JanuaryAI Summit<\u002Fp>\n          <p style=\"margin:6px 0 0; text-align:center; font-family:Georgia, 'Times New Roman', serif; font-style:italic; font-size:14px; color:#8a8a8a;\">Monday-Wednesday Jan 18–20, 2027<\u002Fp>\n\n          <div style=\"position:relative; display:flex; align-items:center; justify-content:center; padding:44px 0; margin-top:10px;\">\n            <div style=\"position:absolute; left:50%; top:50%; width:0; height:0; pointer-events:none;\">\n              <span style=\"--rx:110px; --ry:52px; position:absolute; left:-7px; top:-7px; width:14px; height:14px; border-radius:50%; background:#1d8fe1; opacity:0.85; animation:orbitEllipse 9s linear infinite;\"><\u002Fspan>\n              <span style=\"--rx:96px; --ry:62px; position:absolute; left:-8px; top:-8px; width:16px; height:16px; border-radius:50%; background:#7b2d8b; opacity:0.85; animation:orbitEllipse 14s linear infinite reverse; animation-delay:-3s;\"><\u002Fspan>\n              <span style=\"--rx:124px; --ry:44px; position:absolute; left:-8px; top:-8px; width:16px; height:16px; border-radius:50%; background:#3ab54a; opacity:0.85; animation:orbitEllipse 20s linear infinite; animation-delay:-8s;\"><\u002Fspan>\n              <span style=\"--rx:104px; --ry:58px; position:absolute; left:-9px; top:-9px; width:18px; height:18px; border-radius:50%; background:#f26522; opacity:0.85; animation:orbitEllipse 26s linear infinite reverse; animation-delay:-14s;\"><\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"position:relative; display:flex; flex-direction:column; align-items:center; text-align:center; font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; text-transform:uppercase; line-height:0.9; letter-spacing:-0.015em;\">\n              <span style=\"font-size:22px; color:#c7c9c8;\">Become<\u002Fspan>\n              <span style=\"font-size:22px; color:#8fd6bd; margin-top:-4px;\">A<\u002Fspan>\n              <span style=\"font-size:22px; color:#c7c9c8; margin-top:-4px;\">Partner<\u002Fspan>\n              <span style=\"font-size:22px; color:#8fd6bd; margin-top:-4px;\">Donor<\u002Fspan>\n              <span style=\"font-size:22px; color:#c7c9c8; margin-top:-4px;\">Sponsor<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"background:#f7931e; padding:16px 18px; margin-top:8px;\">\n            <p style=\"margin:0; font-family:Helvetica, Arial, sans-serif; font-weight:700; font-size:16px; line-height:1.4; color:#ffffff;\">“The future of AI will not be determined solely by the intelligence we create, but by the wisdom with which we choose to govern, finance, and apply it.”<\u002Fp>\n          <\u002Fdiv>\n\n          <p style=\"margin:20px 0 0; font-family:Georgia, 'Times New Roman', serif; font-style:italic; font-weight:bold; font-size:14px; color:#3a3a3a;\">Nothing is charged here. RSVP puts you on the sponsor list and we follow up with the written agreement.<\u002Fp>\n\n          <div style=\"display:grid; grid-template-columns:110px 1fr; gap:16px; margin-top:16px; align-items:start;\">\n            <p style=\"margin:0; font-family:Helvetica, Arial, sans-serif; font-weight:700; font-size:19px; line-height:1.25; color:#2eaee0;\">Give a<br>Gift<\u002Fp>\n            <p style=\"margin:0; padding-left:16px; border-left:1px solid #d8dad9; font-family:Georgia, 'Times New Roman', serif; font-style:italic; font-size:13px; line-height:1.5; color:#8a8a8a;\">Every table and seat you sponsor is filled by open application, chosen by the Commons rather than by the sponsor.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"order:{{ formOrder }};\">\n          <p style=\"margin:0; background:#2eaee0; color:#ffffff; text-align:center; font-family:Helvetica, Arial, sans-serif; font-weight:700; text-transform:uppercase; font-size:14px; letter-spacing:0.04em; padding:11px 14px;\">Choose your levels — add as many as you like<\u002Fp>\n\n          <sc-for list=\"{{ rsvpTiers }}\" as=\"row\" hint-placeholder-count=\"7\">\n            <div style=\"display:flex; align-items:center; gap:10px; width:100%; border-left:6px solid {{ row.rule }}; background:{{ row.bg }}; padding:10px 12px; box-sizing:border-box;\">\n              <button sc-camel-on-click=\"{{ row.onDot }}\" aria-label=\"{{ row.name }}\" style=\"flex:none; width:22px; height:22px; padding:0; cursor:pointer; border-radius:50%; border:2px solid {{ row.dotBorder }}; background:{{ row.dotFill }};\"><\u002Fbutton>\n              <span style=\"flex:1; min-width:0; display:flex; flex-direction:column;\">\n                <span style=\"font-family:Helvetica, Arial, sans-serif; font-size:14px; line-height:1.2; color:#3a3a3a;\">{{ row.name }}<\u002Fspan>\n                <sc-if value=\"{{ row.isPriced }}\" hint-placeholder-val=\"{{ true }}\">\n                  <span style=\"font-family:Helvetica, Arial, sans-serif; font-size:11px; line-height:1.4; color:#8a8a8a;\">{{ row.unit }}<\u002Fspan>\n                <\u002Fsc-if>\n              <\u002Fspan>\n              <sc-if value=\"{{ row.isPriced }}\" hint-placeholder-val=\"{{ true }}\">\n                <span style=\"flex:none; display:flex; align-items:center; gap:4px;\">\n                  <button sc-camel-on-click=\"{{ row.dec }}\" aria-label=\"Remove one\" style=\"width:26px; height:26px; padding:0; cursor:pointer; border:1px solid #c2c4c3; background:#ffffff; font-family:Helvetica, Arial, sans-serif; font-weight:700; font-size:15px; line-height:1; color:#3a3a3a; border-radius:2px;\">−<\u002Fbutton>\n                  <span style=\"min-width:18px; text-align:center; font-family:Helvetica, Arial, sans-serif; font-weight:700; font-size:14px; color:#3a3a3a;\">{{ row.qty }}<\u002Fspan>\n                  <button sc-camel-on-click=\"{{ row.inc }}\" aria-label=\"Add one\" style=\"width:26px; height:26px; padding:0; cursor:pointer; border:1px solid #c2c4c3; background:#ffffff; font-family:Helvetica, Arial, sans-serif; font-weight:700; font-size:15px; line-height:1; color:#3a3a3a; border-radius:2px;\">+<\u002Fbutton>\n                <\u002Fspan>\n              <\u002Fsc-if>\n              <span style=\"flex:none; min-width:72px; text-align:right; font-family:Helvetica, Arial, sans-serif; font-weight:700; font-size:14px; color:{{ row.totalInk }};\">{{ row.lineTotal }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n\n          <div style=\"display:flex; align-items:center; justify-content:space-between; gap:12px; background:#2eaee0; padding:12px 14px;\">\n            <span style=\"font-family:Helvetica, Arial, sans-serif; font-weight:700; text-transform:uppercase; font-size:13px; letter-spacing:0.04em; color:#ffffff;\">{{ orderCount }}<\u002Fspan>\n            <span style=\"font-family:Helvetica, Arial, sans-serif; font-weight:700; font-size:16px; color:#ffffff;\">{{ orderTotal }}<\u002Fspan>\n          <\u002Fdiv>\n\n          <div style=\"display:flex; flex-direction:column; gap:10px; margin-top:16px;\">\n            <input type=\"text\" value=\"{{ rsvpName }}\" sc-camel-on-change=\"{{ onRsvpName }}\" placeholder=\"Your name\" style=\"box-sizing:border-box; background:#d9dbda; border:none; padding:13px 12px; font-family:Helvetica, Arial, sans-serif; font-size:16px; color:#3a3a3a; outline:none;\">\n            <input type=\"text\" value=\"{{ rsvpOrg }}\" sc-camel-on-change=\"{{ onRsvpOrg }}\" placeholder=\"Company or organization (optional)\" style=\"box-sizing:border-box; background:#d9dbda; border:none; padding:13px 12px; font-family:Helvetica, Arial, sans-serif; font-size:16px; color:#3a3a3a; outline:none;\">\n            <input type=\"text\" value=\"{{ rsvpContact }}\" sc-camel-on-change=\"{{ onRsvpContact }}\" placeholder=\"Email or phone\" style=\"box-sizing:border-box; background:#d9dbda; border:none; padding:13px 12px; font-family:Helvetica, Arial, sans-serif; font-size:16px; color:#3a3a3a; outline:none;\">\n            <textarea value=\"{{ rsvpNote }}\" sc-camel-on-change=\"{{ onRsvpNote }}\" placeholder=\"What do you care about? (optional)\" style=\"box-sizing:border-box; min-height:74px; resize:vertical; background:#d9dbda; border:none; padding:13px 12px; font-family:Helvetica, Arial, sans-serif; font-size:16px; line-height:1.45; color:#3a3a3a; outline:none;\"><\u002Ftextarea>\n          <\u002Fdiv>\n\n          <p style=\"margin:12px 0 0; text-align:center; font-family:Georgia, 'Times New Roman', serif; font-style:italic; font-weight:bold; font-size:11px; line-height:1.5; color:#4a4a4a;\">No payment is taken on this page. Sponsor amounts are confirmed in writing and disclosed in the published ledger.<\u002Fp>\n\n          <button sc-camel-on-click=\"{{ submitRsvp }}\" style=\"width:100%; margin-top:14px; cursor:pointer; border:none; background:#2eaee0; color:#ffffff; font-family:Helvetica, Arial, sans-serif; font-weight:700; text-transform:uppercase; font-size:15px; letter-spacing:0.04em; padding:15px; border-radius:2px;\" style-hover=\"background:#1e97c7;\">RSVP &gt;&gt;<\u002Fbutton>\n          <sc-if value=\"{{ rsvpStatus }}\" hint-placeholder-val=\"{{ false }}\">\n            <p style=\"margin:12px 0 0; font-family:Georgia, 'Times New Roman', serif; font-size:14px; line-height:1.5; color:#0f9d76;\">{{ rsvpStatus }}<\u002Fp>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  railHover = -1;\n  railWide = typeof window !== 'undefined' ? window.innerWidth >= 700 : true;\n  railDefs = [\n    { label: 'Library+Letters', href: './open-letter.html' },\n    { label: 'Majaii', href: './index.html', always: true },\n    { label: 'Invitation', href: './invitation.html', always: true },\n    { label: 'Partners, Donors, Sponsors', href: '#', always: true },\n    { label: '', href: '', inert: true },\n    { label: 'Meeting of the Minds', href: './meeting-of-the-minds.html' },\n    { label: 'JanuaryAI Summit 2027', href: './summit.html', always: true },\n    { label: 'Issues, Topics, Posts', href: './issues-topics-posts.html' },\n    { label: 'Global AI Community', href: './global-ai-community.html' },\n    { label: '', href: '', inert: true },\n    { label: 'JAI-Charter', href: './charter.html#plan', always: true },\n    { label: '', href: '', inert: true },\n    { label: 'Contact', href: './contact.html' }\n  ];\n\n  tierDefs = [\n    {\n      name: 'Founding Partner', amount: '$100,000', color: '#7b2d8b', cta: 'Start the conversation',\n      funds: 'Corporation or Individual who underwrites the hall, the record, the livestream, and the travel fund that fills a third of the room.',\n      gets: ['Named as a founding partner of the first Summit', 'Two seats at every working group session', 'A written account of the full budget, published']\n    },\n    {\n      name: 'Founding Sponsor', amount: '$50,000', color: '#1d8fe1', cta: 'Start the conversation',\n      funds: 'Pays for the Charter work itself — drafting, plain-language review, legal read, and the printed edition every attendee takes home.',\n      gets: ['Name on the printed Charter edition', 'Four Summit passes', 'Invitation to the drafting review']\n    },\n    {\n      name: 'Impact Sponsor', amount: '$25,000', color: '#0f9d76', cta: 'Pick a team',\n      funds: 'Adopts 1 of 12 Meeting of the Minds Impact categories for the year, its meeting, its research support and the report it shares with the community.',\n      gets: ['Named with the team in its published report', 'Two Summit passes', 'Quarterly briefing from the team lead']\n    },\n    {\n      name: 'Event Table Sponsor', amount: '$10,000', color: '#f7931e', cta: 'Sponsor a table',\n      funds: 'Buys a table of ten for people from one town, one clinic, one district, or one trade — chosen by the Commons, not by the sponsor.',\n      gets: ['Ten seats, assigned by open application', 'Named in the attendance record', 'One Summit pass for your own team']\n    },\n    {\n      name: 'Event Essentials Sponsor', amount: '$10,000 / $1,000', color: '#8e6bd4', cta: 'Claim an essential',\n      funds: 'Covers one of the things the Summit cannot run without — badges, water stations, charging, the shuttle, the gift bag itself.',\n      gets: ['$10,000: exclusive logo on the essential you fund', '$1,000: one item of your own in every gift bag', 'Named in the Summit program']\n    },\n    {\n      name: 'Mentor VIP Seating', amount: '$1,000', color: '#f4511e', cta: 'Reserve a seat',\n      funds: 'Reserves one seat in the Mentor VIP Seating.',\n      gets: ['One seat in the Mentors seating area during keynotes and stage programs', 'Full Event Pass ticket holder upgrade', 'Mentor name badge']\n    },\n    {\n      name: 'Private Contribution', hideCard: true, amount: 'Thank You', color: '#0f9d76', cta: 'Give privately',\n      funds: 'Tell us the how to match your contribution to your cause. What do you care about? Privately share your interest and your contribution. We will match it to the part of the Summit that needs it and put it in writing.',\n      gets: []\n    }\n  ];\n\n  railOpen = false;\n  railLockedByTouch = false;\n  setRailOpen = (v) => {\n    if (this.railLockedByTouch) return;\n    if (this.railOpen !== v) { this.railOpen = v; this.forceUpdate(); }\n  };\n  toggleRailOpen = () => {\n    this.railOpen = !this.railOpen;\n    this.railLockedByTouch = this.railOpen;\n    this.railTouchedAt = Date.now();\n    this.forceUpdate();\n  };\n  railTap = (e) => {\n    if (e && e.target && e.target.closest && e.target.closest('[href]')) return;\n    if (this.railTouchedAt && Date.now() - this.railTouchedAt < 700) return;\n    this.toggleRailOpen();\n  };\n\n  setRailHover = (i) => { this.railHover = i; this.forceUpdate(); };\n\n  state = { rsvpOpen: false, pick: '', qty: {}, name: '', org: '', contact: '', note: '', status: '', thanked: false };\n\n  lockScroll = (on) => {\n    if (typeof document === 'undefined') return;\n    document.body.style.overflow = on ? 'hidden' : '';\n  };\n\n  openRsvp = (name) => { this.lockScroll(true); this.setState({ rsvpOpen: true, pick: name || '', status: '' }); };\n  openRsvpAny = () => this.openRsvp('');\n\n  printHandout = (e) => {\n    if (e && e.preventDefault) e.preventDefault();\n    const existing = document.getElementById('jai-handout-print');\n    if (existing) existing.remove();\n    const f = document.createElement('iframe');\n    f.id = 'jai-handout-print';\n    f.setAttribute('aria-hidden', 'true');\n    f.style.cssText = 'position:fixed; right:0; bottom:0; width:816px; height:1056px; opacity:0; pointer-events:none; border:0;';\n    f.src = './sponsor-handout.html';\n    f.onload = () => {\n      setTimeout(() => {\n        try {\n          f.contentWindow.focus();\n          f.contentWindow.print();\n        } catch (err) {\n          window.open('./sponsor-handout.html?print=1', '_blank');\n        }\n        setTimeout(() => f.remove(), 60000);\n      }, 1600);\n    };\n    document.body.appendChild(f);\n  };\n  closeRsvp = () => { this.lockScroll(false); this.setState({ rsvpOpen: false }); };\n  pickTier = (name) => this.setState({ pick: name, status: '', thanked: name === 'Private Contribution' });\n\n  unitPrice = (amount) => {\n    const m = String(amount || '').replace(/,/g, '').match(/\\$\\s*(\\d+)/);\n    return m ? parseInt(m[1], 10) : 0;\n  };\n  money = (n) => '$' + n.toLocaleString('en-US');\n  bumpQty = (name, delta) => {\n    const q = Object.assign({}, this.state.qty || {});\n    const next = Math.max(0, Math.min(99, (q[name] || 0) + delta));\n    if (next === 0) { delete q[name]; } else { q[name] = next; }\n    this.setState({ qty: q, status: '' });\n  };\n  orderLines = () => {\n    const q = this.state.qty || {};\n    return this.tierDefs\n      .filter(d => (q[d.name] || 0) > 0)\n      .map(d => ({ name: d.name, qty: q[d.name], unit: this.unitPrice(d.amount) }));\n  };\n\n  submitRsvp = () => {\n    const s = this.state;\n    const name = (s.name || '').trim();\n    const contact = (s.contact || '').trim();\n    const lines = this.orderLines();\n    if (!lines.length) { this.setState({ status: 'Add at least one level to your order.' }); return; }\n    if (!name) { this.setState({ status: 'Add your name so we know who to write to.' }); return; }\n    if (!contact) { this.setState({ status: 'Add an email or phone number.' }); return; }\n\n    const total = lines.reduce((t, l) => t + l.unit * l.qty, 0);\n    const summary = lines.map(l => l.name + ' \\u00d7' + l.qty).join(', ');\n    const row = {\n      level: summary,\n      items: JSON.stringify(lines),\n      amount: this.money(total),\n      name: name,\n      org: (s.org || '').trim(),\n      contact: contact,\n      note: (s.note || '').trim(),\n      createdAt: Date.now()\n    };\n\n    try {\n      const stored = JSON.parse(window.localStorage.getItem('jai-sponsor-rsvp') || '[]');\n      stored.push(row);\n      window.localStorage.setItem('jai-sponsor-rsvp', JSON.stringify(stored));\n    } catch (e) {}\n\n    const inst = window.__instant;\n    if (!inst) { this.setState({ status: 'Saved locally \\u2014 reconnecting to the RSVP list.' }); return; }\n\n    this.setState({ status: 'Sending\\u2026' });\n    Promise.resolve(inst.db.transact(inst.tx.sponsorRsvp[inst.id()].update(row)))\n      .then(() => this.setState({\n        status: 'You are on the sponsor list for ' + summary + '. We will follow up with the written agreement \\u2014 nothing was charged.',\n        name: '', org: '', contact: '', note: ''\n      }))\n      .catch(() => this.setState({ status: 'Saved. We had trouble reaching the list and will retry \\u2014 your RSVP is not lost.' }));\n  };\n\n  onRsvpName = (e) => this.setState({ name: e.target.value, status: '' });\n  onRsvpOrg = (e) => this.setState({ org: e.target.value, status: '' });\n  onRsvpContact = (e) => this.setState({ contact: e.target.value, status: '' });\n  onRsvpNote = (e) => this.setState({ note: e.target.value, status: '' });\n\n  componentDidMount() {\n    this.onRailResize = () => {\n      const wide = window.innerWidth >= 700;\n      if (wide !== this.railWide) { this.railWide = wide; this.forceUpdate(); }\n    };\n    window.addEventListener('resize', this.onRailResize);\n  }\n\n  componentWillUnmount() { window.removeEventListener('resize', this.onRailResize); this.lockScroll(false); }\n\n  buildRailItems() {\n    return this.railDefs.map((d, i) => ({\n      label: d.label,\n      href: d.href,\n      dotBg: this.railHover === i ? '#0f9d76' : '#a7ddc9',\n      dotScale: this.railHover === i ? 'scale(1.45)' : 'scale(1)',\n      labelOpacity: (d.label && (this.railWide || this.railOpen || this.railHover === i)) ? 1 : 0,\n      labelPointer: (d.label && (this.railWide || this.railOpen || this.railHover === i)) ? 'auto' : 'none',\n      onClick: (e) => {\n        e.preventDefault();\n        if (d.inert) return;\n        const h = d.href;\n        if (h.charAt(0) === '#') { window.scrollTo({ top: 0, behavior: 'smooth' }); return; }\n        const u = new URL(h, window.location.href);\n        const hash = u.hash;\n        u.hash = '';\n        u.search = window.location.search;\n        window.location.href = u.toString() + hash;\n      },\n      onEnter: () => this.setRailHover(i),\n      onLeave: () => this.setRailHover(-1)\n    }));\n  }\n\n  navScrollRef = React.createRef();\n  navActive = -1;\n\n  centerNavItem(i) {\n    const box = this.navScrollRef.current;\n    if (!box) return;\n    const el = box.querySelector('[data-nav-index=\"' + i + '\"]');\n    if (!el) return;\n    box.scrollTo({ left: Math.max(0, el.offsetLeft - (box.clientWidth - el.offsetWidth) / 2), behavior: 'smooth' });\n  }\n\n  buildNavItems() {\n    const defs = this.railDefs.filter(d => d.label && !d.inert);\n    return defs.map((d, i) => {\n      const on = this.navActive === i;\n      return {\n        index: String(i),\n        label: d.label,\n        href: d.href || '#',\n        bg: on ? '#0f9d76' : '#ffffff',\n        color: on ? '#ffffff' : '#0f9d76',\n        border: on ? '#0f9d76' : 'rgba(15,157,118,0.28)',\n        onClick: (e) => {\n          e.preventDefault();\n          this.navActive = i;\n          this.forceUpdate();\n          this.centerNavItem(i);\n          const href = d.href || '';\n          setTimeout(() => {\n            if (!href || href.charAt(0) === '#') {\n              const t = href.length > 1 ? document.querySelector(href) : null;\n              if (t) { window.scrollTo({ top: t.getBoundingClientRect().top + window.pageYOffset - 70, behavior: 'smooth' }); }\n              else { window.scrollTo({ top: 0, behavior: 'smooth' }); }\n              return;\n            }\n            const u = new URL(href, window.location.href);\n            const hash = u.hash; u.hash = ''; u.search = window.location.search;\n            window.location.href = u.toString() + hash;\n          }, 260);\n        }\n      };\n    });\n  }\n\n  renderVals() {\n    const s = this.state;\n    return {\n      navItems: this.buildNavItems(),\n      navScrollRef: this.navScrollRef,\n      railEnter: () => this.setRailOpen(true),\n      railLeave: () => this.setRailOpen(false),\n      railToggle: this.toggleRailOpen, railTap: this.railTap,\n      printHandout: this.printHandout,\n      tiers: this.tierDefs.filter(d => !d.hideCard).map(d => ({\n        name: d.name,\n        amount: d.amount,\n        color: d.color,\n        funds: d.funds,\n        cta: d.cta,\n        gets: d.gets.map(t => ({ text: t })),\n        onRsvp: () => this.openRsvp(d.name)\n      })),\n      rsvpDisplay: s.rsvpOpen ? 'flex' : 'none',\n      formOrder: this.railWide ? 0 : -1,\n      openRsvpAny: this.openRsvpAny,\n      closeRsvp: this.closeRsvp,\n      submitRsvp: this.submitRsvp,\n      rsvpStatus: s.status,\n      rsvpName: s.name,\n      rsvpOrg: s.org,\n      rsvpContact: s.contact,\n      rsvpNote: s.note,\n      onRsvpName: this.onRsvpName,\n      onRsvpOrg: this.onRsvpOrg,\n      onRsvpContact: this.onRsvpContact,\n      onRsvpNote: this.onRsvpNote,\n      thanked: !!s.thanked,\n      orderCount: (() => {\n        const n = this.orderLines().reduce((t, l) => t + l.qty, 0);\n        return n === 0 ? 'JanuaryAI Summit 2027' : (n === 1 ? '1 item' : n + ' items');\n      })(),\n      orderTotal: (() => {\n        const lines = this.orderLines();\n        const total = lines.reduce((t, l) => t + l.unit * l.qty, 0);\n        const hasGift = lines.filter(l => l.unit === 0).length > 0;\n        if (!lines.length) return '';\n        return hasGift && total === 0 ? 'Thank You' : this.money(total);\n      })(),\n      rsvpTiers: this.tierDefs.map((d, i) => {\n        const qty = (s.qty || {})[d.name] || 0;\n        const on = qty > 0;\n        const unit = this.unitPrice(d.amount);\n        return {\n          name: d.name,\n          unit: unit === 0 ? '' : this.money(unit) + ' each',\n          isPriced: unit > 0,\n          totalInk: on ? '#0d1512' : '#0f6b52',\n          rule: d.color,\n          qty: qty,\n          lineTotal: !on ? '' : (unit === 0 ? 'Thank You' : this.money(unit * qty)),\n          bg: on ? '#fbcfe0' : (i % 2 === 1 ? '#f6f8f7' : '#ffffff'),\n          dotBorder: on ? d.color : '#b8bab9',\n          dotFill: on ? d.color : '#ffffff',\n          inc: () => this.bumpQty(d.name, 1),\n          dec: () => this.bumpQty(d.name, -1),\n          onDot: () => this.bumpQty(d.name, qty > 0 ? -qty : 1)\n        };\n      })\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
