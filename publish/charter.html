document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"6903c6b1-5f66-40a0-b5ce-b61b4d70e5b2\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<meta charset=\"utf-8\">\n<style>\n  .majaii-navscroll { scrollbar-width:none; -ms-overflow-style:none; }\n  .majaii-navscroll::-webkit-scrollbar { display:none; }\n  /* Mouse/trackpad only: enlarge the hovered pill for readability. Touch devices keep the resting size. */\n  @media (hover: hover) and (pointer: fine) {\n    .majaii-navscroll > a { transition:transform 0.16s ease, font-size 0.16s ease, background 0.18s ease, color 0.18s ease, box-shadow 0.18s ease; }\n    .majaii-navscroll > a:hover { transform:translateY(-1px) scale(1.08); box-shadow:0 4px 14px rgba(15,157,118,0.22) !important; z-index:2; }\n  }\n  html { scroll-behavior: smooth; }\n  body { margin: 0; background: #ffffff; -webkit-text-size-adjust: 100%; overflow-x: hidden; }\n  a { color: #0f9d76; }\n  a:hover { color: #0b7a5c; }\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"background:#ffffff; min-height:100vh; padding:clamp(48px,8vh,96px) clamp(24px,7vw,120px) 120px; font-family:Georgia, 'Times New Roman', serif;\">\n<nav style=\"position:sticky; top:0; z-index:60; align-self:stretch; width:auto; margin:0 0 clamp(18px,3vh,28px); background:rgba(255,255,255,0.94); backdrop-filter:blur(8px); padding:10px 0;\" style-before=\"content:''; position:absolute; left:0; top:0; bottom:0; width:38px; pointer-events:none; z-index:2; background:linear-gradient(to right, #ffffff, rgba(255,255,255,0));\" style-after=\"content:''; position:absolute; right:0; top:0; bottom:0; width:38px; pointer-events:none; z-index:2; background:linear-gradient(to left, #ffffff, rgba(255,255,255,0));\">\n  <div class=\"majaii-navscroll\" ref=\"{{ navScrollRef }}\" style=\"display:flex; flex-wrap:nowrap; gap:8px; overflow-x:auto; overflow-y:hidden; scroll-snap-type:x proximity; -webkit-overflow-scrolling:touch; scroll-behavior:smooth; padding:6px 30px;\">\n    <sc-for list=\"{{ navItems }}\" as=\"item\" hint-placeholder-count=\"10\">\n      <a href=\"{{ item.href }}\" data-nav-index=\"{{ item.index }}\" sc-camel-on-click=\"{{ item.onClick }}\" style=\"flex:none; scroll-snap-align:center; display:inline-flex; align-items:center; min-height:34px; padding:0 16px; border-radius:999px; text-decoration:none; white-space:nowrap; font-family:'Arial Black','Helvetica Neue',Helvetica,sans-serif; font-weight:900; font-size:11px; letter-spacing:0.03em; text-transform:uppercase; box-shadow:0 1px 8px rgba(0,0,0,0.10); transition:background 0.2s ease, color 0.2s ease, border-color 0.2s ease; background:{{ item.bg }}; color:{{ item.color }}; border:1px solid {{ item.border }};\">{{ item.label }}<\u002Fa>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fnav>\n  <header style=\"max-width:640px; width:100%; margin:0 auto clamp(56px,9vh,88px);\">\n    <div style=\"display:flex; flex-direction:column; align-items:center; text-align:center; font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; text-transform:uppercase; line-height:0.92; letter-spacing:-0.01em;\">\n      <span style=\"font-size:clamp(34px,8vw,58px); color:#c7c9c8;\">JanuaryAI<\u002Fspan>\n      <span style=\"font-size:clamp(34px,8vw,58px); color:#c7c9c8; margin-top:clamp(-8px,-2vw,-14px);\">Project<\u002Fspan>\n      <span style=\"font-size:clamp(34px,8vw,58px); color:#8fd6bd; margin-top:clamp(-8px,-2vw,-14px);\">Charter<\u002Fspan>\n      <span style=\"font-size:clamp(34px,8vw,58px); color:#c7c9c8; margin-top:clamp(-8px,-2vw,-14px);\">Overview<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex; justify-content:center; margin-top:clamp(28px,5vh,40px);\">\n      <a href=\"./home.html\" style=\"font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:12px; letter-spacing:0.1em; text-transform:uppercase; color:#0f9d76; text-decoration:none;\">← Back to invitation<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fheader>\n  <section id=\"principals\" data-screen-label=\"The Principles\" style=\"max-width:640px; width:100%; margin:0 auto; padding-top:0;\">\n    <div style=\"border-top:none; padding-top:0;\">\n      <button sc-camel-on-click=\"{{ toggle_principals }}\" style=\"display:flex; align-items:center; gap:16px; width:100%; background:none; border:none; cursor:pointer; padding:0; text-align:left; font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:clamp(20px,4vw,26px); line-height:1.2; color:#2f2f2f; text-transform:uppercase; letter-spacing:0.01em;\">\n        <span style=\"font-size:28px; color:#a7ddc9; display:inline-block; transition:transform 0.2s ease; transform:{{ arrow_principals }};\">▶<\u002Fspan>\n        <span>The Principles<\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fdiv>\n    <sc-if value=\"{{ open_principals }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"padding-top:22px;\">\n    <div style=\"text-align:left;\">\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-style:italic; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px; text-align:center;\">The Charter of January AI<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">Every enduring institution requires more than a mission statement.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">A mission explains what an organization seeks to accomplish.<br>Principles explain how it chooses to behave while accomplishing it. Over time, strategies change. Technologies change. Leaders change. Circumstances change.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">Principles endure.<br>The founding principles of January AI are therefore not intended to be a list of aspirations. They are intended to be a compass. They define the decisions the institution will make when the answers are difficult, when interests compete, and when the future is uncertain.<\u002Fp>\n        <p style=\"font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:clamp(20px,4vw,24px); color:#2f2f2f; margin:0 0 18px;\">Principle One: AI Must Expand Human Potential<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">Artificial intelligence should not be measured only by what machines can accomplish.<br>It should be measured by what people become capable of accomplishing because of AI.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">The purpose of January AI is not to accelerate technology for its own sake.<br>It is to increase human opportunity.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">AI should help people: learn faster, create more freely, solve more complex problems, discover new opportunities, participate more fully in society.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">The measure of progress is not machine capability alone.<br>It is human capability multiplied.<\u002Fp>\n        <p style=\"font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:clamp(20px,4vw,24px); color:#2f2f2f; margin:0 0 18px;\">Principle Two: Those Affected by AI Should Help Shape AI<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">The future of artificial intelligence cannot be designed only by those who build it.<br>Technologists are essential.<br>But so are educators, workers, entrepreneurs, policymakers, community leaders, researchers, and citizens.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">The people experiencing the effects of AI must have meaningful opportunities to influence its direction.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">January AI exists to create those opportunities.<br>Participation is not symbolic.<br>It is foundational.<\u002Fp>\n        <p style=\"font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:clamp(20px,4vw,24px); color:#2f2f2f; margin:0 0 18px;\">Principle Three: Intelligence Should Be Distributed, Not Concentrated<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">Throughout history, transformative technologies have created both opportunity and concentration of power.<br>Artificial intelligence presents the same possibility.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">January AI believes the greatest benefit comes when intelligence becomes more accessible.<br>Knowledge should be shared.<br>Capabilities should expand.<br>Communities should be empowered.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">The institution exists not to centralize intelligence, but to distribute it.<\u002Fp>\n        <p style=\"font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:clamp(20px,4vw,24px); color:#2f2f2f; margin:0 0 18px;\">Principle Four: Evidence Before Ideology<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">The challenges surrounding AI are complex.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">They cannot be solved through enthusiasm alone.<br>They cannot be solved through fear alone.<br>They require curiosity, experimentation, and evidence.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">January AI commits to asking:<br>What do we know?<br>What do we not know?<br>What can we test?<br>What did we learn?<br>What should change?<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">The institution values optimism without naivety and caution without paralysis.<\u002Fp>\n        <p style=\"font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:clamp(20px,4vw,24px); color:#2f2f2f; margin:0 0 18px;\">Principle Five: Innovation Requires Experimentation<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">A society that fears failure will fail to innovate.<br>Responsible experimentation is essential.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">January AI recognizes that not every promising idea will succeed. However, every responsible experiment can produce knowledge. Failure becomes valuable when it improves future decisions.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">The goal is not perfection.<br>The goal is continuous learning.<\u002Fp>\n        <p style=\"font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:clamp(20px,4vw,24px); color:#2f2f2f; margin:0 0 18px;\">Principle Six: Capital Is a Responsibility<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">Resources are entrusted, not owned.<br>Every dollar, every hour, every contribution of expertise represents confidence from someone who believes the mission matters.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">January AI treats capital as stewardship.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">The question is not merely:<br>“How much can we raise?”<br>The question is:<br>“How much meaningful progress can we create with what we are entrusted?”<\u002Fp>\n        <p style=\"font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:clamp(20px,4vw,24px); color:#2f2f2f; margin:0 0 18px;\">Principle Seven: Transparency Creates Trust<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">Trust cannot be requested.<br>It must be earned.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">January AI commits to transparency in: decision-making, funding, partnerships, governance, outcomes, and lessons learned.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">Transparency is not a burden.<br>It is the foundation of credibility.<\u002Fp>\n        <p style=\"font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:clamp(20px,4vw,24px); color:#2f2f2f; margin:0 0 18px;\">Principle Eight: Commercial Success and Public Benefit Can Coexist<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">Innovation requires entrepreneurship.<br>Society requires institutions dedicated to public benefit.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">These goals are not inherently opposed. January AI recognizes that commercial innovation can be a powerful force for societal improvement when relationships are transparent and governed responsibly. Entrepreneurship creates possibilities. Stewardship ensures those possibilities serve a broader purpose.<\u002Fp>\n        <p style=\"font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:clamp(20px,4vw,24px); color:#2f2f2f; margin:0 0 18px;\">Principle Nine: Communities Are Smarter Than Individuals Alone<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">The world’s greatest challenges exceed the capability of any single person or organization.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">The future requires collective intelligence.<br>January AI exists because collaboration creates possibilities that competition alone cannot.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">Different perspectives are not obstacles.<br>They are assets.<br>The community becomes stronger when many forms of intelligence contribute.<\u002Fp>\n        <p style=\"font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:clamp(20px,4vw,24px); color:#2f2f2f; margin:0 0 18px;\">Principle Ten: Build for Generations, Not Moments<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">Artificial intelligence is a defining technology of this era.<br>The institutions created around it will influence generations.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">January AI therefore rejects short-term thinking.<br>Decisions should be evaluated not only by immediate results, but by whether they strengthen the future.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">The question is:<br>“Will this help those who come after us build an even better institution?”<\u002Fp>\n        <p style=\"font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:clamp(20px,4vw,24px); color:#2f2f2f; margin:0 0 18px;\">The Founder’s Commitment<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">Every founding document contains an implicit promise.<br>The promise is not that every decision will be correct.<br>The promise is that decisions will be made with integrity.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">January AI begins with a vision:<br>That artificial intelligence can become one of humanity’s greatest tools for expanding opportunity.<br>That communities can participate meaningfully in shaping its future.<br>That innovation and responsibility can advance together.<br>That wealth and expertise can be aligned with public benefit.<br>That technology can strengthen rather than diminish human potential.<\u002Fp>\n        <p style=\"font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:clamp(20px,4vw,24px); color:#2f2f2f; margin:0 0 18px;\">The January AI Declaration<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">We believe artificial intelligence represents not only a technological transformation, but a societal one.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">We believe the future of AI should not be determined exclusively by those with the greatest resources, technical expertise, or institutional power.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">We believe every community should have the opportunity to participate in shaping how AI affects their lives.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">We believe responsible innovation requires curiosity, courage, transparency, and humility.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">We believe abundance created through technology carries an obligation to expand opportunity.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">We believe humanity’s greatest intelligence emerges when people work together.<br>Therefore, we commit to building an institution where knowledge is shared, ideas are tested, resources are aligned, and solutions are developed for the benefit of society.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">This is the purpose of January AI.<\u002Fp>\n        <p style=\"font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:clamp(20px,4vw,24px); color:#2f2f2f; margin:0 0 18px;\">Conclusion: Building the Civic Institution for the Age of Artificial Intelligence<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">Every generation inherits challenges created by the choices of those who came before.<br>Every generation also inherits opportunities.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">Artificial intelligence may become one of the most powerful tools humanity has ever created.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">The question before us is not simply:<br>“What can AI do?”<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">The deeper question is:<br>“What will we choose to do with AI?”<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">January AI exists to help answer that question.<br>It brings together communities and technology.<br>Ideas and resources.<br>Innovation and responsibility.<br>Ambition and stewardship.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0;\">Its purpose is not to predict the future.<br>Its purpose is to help humanity participate in creating it.<\u002Fp>\n    <\u002Fdiv>\n    <button sc-camel-on-click=\"{{ toggle_principals }}\" style=\"display:flex; align-items:center; justify-content:center; width:100%; background:none; border:none; cursor:pointer; padding:20px 0 4px;\">\n        <img src=\"0032e619-25d1-43f8-b719-020703ed33e2\" alt=\"Close section\" style=\"width:32px; height:32px; display:block;\">\n      <\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fsection>\n  <section id=\"why\" data-screen-label=\"Why JanuaryAI\" style=\"max-width:640px; width:100%; margin:0 auto; padding-top:64px;\">\n    <div style=\"border-top:1px solid #e2e2e2; padding-top:32px;\">\n      <button sc-camel-on-click=\"{{ toggle_why }}\" style=\"display:flex; align-items:center; gap:16px; width:100%; background:none; border:none; cursor:pointer; padding:0; text-align:left; font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:clamp(20px,4vw,26px); line-height:1.2; color:#2f2f2f; text-transform:uppercase; letter-spacing:0.01em;\">\n        <span style=\"font-size:28px; color:#a7ddc9; display:inline-block; transition:transform 0.2s ease; transform:{{ arrow_why }};\">▶<\u002Fspan>\n        <span>Why JanuaryAI<\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fdiv>\n    <sc-if value=\"{{ open_why }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"padding-top:22px;\">\n    <div style=\"text-align:left;\">\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">Artificial Intelligence is transforming civilization at a pace unmatched by any previous technological revolution. New capabilities emerge weekly. Entire industries are being reshaped. Scientific discovery is accelerating. Productivity is increasing. Yet alongside these extraordinary advances come equally profound questions.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">How should society respond to workforce displacement?<br>How should communities participate in decisions that affect them?<br>How can wealth created through AI contribute to broad societal prosperity?<br>How do we distinguish promising ideas from solutions that genuinely improve people’s lives?<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-weight:700; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#2f2f2f; margin:0 0 22px;\">Most importantly:<br>Who decides?<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">Today’s AI ecosystem provides many excellent forums for discussion. Universities conduct research. Technology companies develop increasingly capable models. Governments consider regulation. Venture capital funds commercial innovation. Philanthropic organizations support important social initiatives.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">Yet one critical capability remains underdeveloped.<br>There is no enduring institution whose primary purpose is to bring these communities together—not merely to discuss the implications of AI, but to continuously transform collective intelligence into tested, measurable solutions that improve society.<br>January AI is conceived to fill that role.<br>It is not simply another conference.<br>It is not solely a nonprofit foundation.<br>It is not a think tank.<br>It is not an accelerator.<br>It is not a venture fund.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">Instead, January AI proposes a new institutional model.<br>An institution whose purpose is to orchestrate conversation, knowledge, governance, and capital into a continuous process that discovers, develops, tests, funds, and measures AI solutions capable of creating broad public benefit.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">Rather than asking, “What should society think about AI?”, January AI asks:<br>“What can society accomplish together because of AI?”<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">This distinction changes everything.<br>Discussion becomes action.<br>Ideas become experiments.<br>Experiments become measurable outcomes.<br>Successful outcomes become scalable initiatives.<br>Knowledge becomes institutional wisdom.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">Rather than producing reports that describe problems, January AI seeks to establish a repeatable process for solving them.<\u002Fp>\n        <p style=\"font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:clamp(20px,4vw,24px); color:#2f2f2f; margin:0 0 18px;\">A Different Kind of Institution<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">Throughout history, societies have created institutions when existing structures became insufficient for new realities.<br>The Industrial Revolution gave rise to modern universities, labor organizations, standards bodies, and professional associations.<br>The Information Age produced the Internet Engineering Task Force, the World Wide Web Consortium, open-source foundations, and countless new models of global collaboration.<br>Artificial Intelligence now presents an equally significant transition.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">The challenge is not merely technological.<br>It is organizational.<br>Economic.<br>Ethical.<br>Educational.<br>Political.<br>Human.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">Existing institutions each address part of this landscape.<br>Few address the whole.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">January AI therefore proposes something different:<br>an institution specifically designed to coordinate collective intelligence across sectors while remaining dedicated to measurable public benefit.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">Its purpose is neither advocacy nor regulation.<br>It is orchestration.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">The institution itself does not presume to possess every answer.<br>Instead, it creates the conditions through which better answers continuously emerge.<\u002Fp>\n        <p style=\"font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:clamp(20px,4vw,24px); color:#2f2f2f; margin:0 0 18px;\">The Central Premise<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">January AI begins with one foundational belief.<br>Artificial Intelligence should increase human opportunity—not merely human efficiency.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">Efficiency is valuable.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">Opportunity is transformational.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">A future where AI merely reduces costs may produce extraordinary wealth while simultaneously increasing inequality, displacement, and uncertainty.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">A future where AI expands opportunity creates new entrepreneurs, new scientific discoveries, new educational pathways, stronger communities, healthier institutions, and broader prosperity.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">The distinction matters.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">Technology alone cannot guarantee this outcome.<br>Only intentional governance, transparent collaboration, and aligned investment can.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">January AI exists to make that coordination possible.<\u002Fp>\n        <p style=\"font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:clamp(20px,4vw,24px); color:#2f2f2f; margin:0 0 18px;\">From Conversation to Implementation<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">Many organizations successfully identify problems.<br>Many organizations publish recommendations.<br>Far fewer create mechanisms capable of transforming recommendations into funded experiments.<br>Fewer still measure those experiments and distribute what is learned across an open community.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">January AI proposes that the greatest opportunity lies not in discovering more problems.<br>It lies in constructing an institutional process that repeatedly converts insight into implementation.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">This process forms the heartbeat of the January AI ecosystem.<br>Ideas emerge.<br>Communities refine them.<br>Experts evaluate them.<br>Capital supports them.<br>Pilots test them.<br>Evidence measures them.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">Knowledge returns to the community.<br>The cycle begins again.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">Over time, this creates something far more valuable than isolated successes.<br>It creates institutional learning.<\u002Fp>\n        <p style=\"font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:clamp(20px,4vw,24px); color:#2f2f2f; margin:0 0 18px;\">Our Vision<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">We envision a future in which every community has meaningful access to the benefits of artificial intelligence.<br>A future where innovators, educators, entrepreneurs, researchers, policymakers, philanthropists, investors, and citizens collaborate within trusted institutions rather than isolated silos.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">A future where AI-generated abundance is intentionally directed toward expanding opportunity rather than concentrating advantage.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">A future where public trust is earned through transparency, measurable outcomes, and responsible stewardship.<br>Most importantly, we envision a future in which the collective intelligence of society becomes the most valuable resource for solving society’s greatest challenges.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">January AI exists to help build that future.<\u002Fp>\n        <p style=\"font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:clamp(20px,4vw,24px); color:#2f2f2f; margin:0 0 18px;\">Closing Thought<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">Every technological revolution eventually creates institutions that help society realize its greatest benefits while managing its greatest risks.<br>The AI revolution is no different.<br>The question is not whether such an institution will emerge.<br>The question is who will build it—and what principles will guide its design.<br>January AI is offered as one possible answer.<\u002Fp>\n    <\u002Fdiv>\n    <button sc-camel-on-click=\"{{ toggle_why }}\" style=\"display:flex; align-items:center; justify-content:center; width:100%; background:none; border:none; cursor:pointer; padding:20px 0 4px;\">\n        <img src=\"0032e619-25d1-43f8-b719-020703ed33e2\" alt=\"Close section\" style=\"width:32px; height:32px; display:block;\">\n      <\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fsection>\n  <section id=\"opportunity\" data-screen-label=\"The Opportunity\" style=\"max-width:640px; width:100%; margin:0 auto; padding-top:64px;\">\n    <div style=\"border-top:1px solid #e2e2e2; padding-top:32px;\">\n      <button sc-camel-on-click=\"{{ toggle_opportunity }}\" style=\"display:flex; align-items:center; gap:16px; width:100%; background:none; border:none; cursor:pointer; padding:0; text-align:left; font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:clamp(20px,4vw,26px); line-height:1.2; color:#2f2f2f; text-transform:uppercase; letter-spacing:0.01em;\">\n        <span style=\"font-size:28px; color:#a7ddc9; display:inline-block; transition:transform 0.2s ease; transform:{{ arrow_opportunity }};\">▶<\u002Fspan>\n        <span>The Opportunity<\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fdiv>\n    <sc-if value=\"{{ open_opportunity }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"padding-top:22px;\">\n    <div style=\"text-align:left;\">\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-style:italic; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px; text-align:center;\">Why the World Needs a New AI Institution<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">Every generation inherits a defining technology.<br>Steam power transformed manufacturing.<br>Electricity transformed civilization.<br>The Internet transformed communication.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">Artificial Intelligence is different.<br>Unlike previous technologies, AI is not confined to a single industry or profession. It is a general-purpose capability that can reason, generate knowledge, automate cognitive work, discover scientific insights, personalize education, augment creativity, and increasingly collaborate with humans in solving complex problems.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">Its impact will be universal.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">The question before society is therefore not whether AI will change the world.<br>It already is.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">The more important question is whether humanity will develop institutions capable of directing that change toward outcomes that are equitable, measurable, and broadly beneficial.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">History suggests that technology alone does not determine societal progress.<br>Institutions do.<\u002Fp>\n        <p style=\"font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:clamp(20px,4vw,24px); color:#2f2f2f; margin:0 0 18px;\">The Institutional Gap<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">Today’s AI landscape is rich with innovation but fragmented in execution.<br>Technology companies build increasingly capable models.<br>Universities conduct groundbreaking research.<br>Governments explore regulatory frameworks.<br>Investors finance commercial innovation.<br>Foundations support social initiatives.<br>Open-source communities advance technical collaboration.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">Each performs an essential function.<br>Yet each necessarily operates within its own mission, incentives, and governance.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">The result is an ecosystem that produces extraordinary innovation but lacks an enduring mechanism for aligning these diverse efforts around shared societal outcomes.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">This is not a failure of any single institution.<br>It is a consequence of specialization.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">As AI becomes more capable, society requires a complementary capability:<br>the ability to coordinate across disciplines, sectors, and communities.<br>That coordinating function is largely absent today.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">January AI is designed to address that absence.<\u002Fp>\n        <p style=\"font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:clamp(20px,4vw,24px); color:#2f2f2f; margin:0 0 18px;\">Beyond Conversation<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">Over the past several years, thousands of conferences, reports, podcasts, panels, and policy papers have explored the implications of artificial intelligence.<br>These conversations have enormous value.<br>They educate.<br>They inspire.<br>They warn.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">They connect people who might never otherwise meet.<br>But conversation alone does not change society.<br>Implementation does.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">A recurring pattern can be observed across nearly every major discussion surrounding AI.<br>Participants identify important problems.<br>Recommendations are generated.<br>Reports are published.<br>Attention shifts elsewhere.<br>Momentum dissipates.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">January AI proposes a different model.<br>Rather than concluding with recommendations, it begins there.<br>Its purpose is to transform collective insight into measurable action.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">The institution therefore measures its success not by the number of conversations it hosts, but by the number of solutions those conversations produce, test, improve, and ultimately scale.<\u002Fp>\n        <p style=\"font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:clamp(20px,4vw,24px); color:#2f2f2f; margin:0 0 18px;\">The Age of Collective Intelligence<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">Artificial intelligence is often described as a technological revolution. It is equally a coordination revolution. Never before have individuals, organizations, and intelligent systems possessed the ability to collaborate at such scale. A scientist in Boston can work with a student in Nairobi, an entrepreneur in Denver, a policymaker in Brussels, and a language model trained on centuries of accumulated human knowledge—all within the same afternoon.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">The limiting factor is no longer access to information.<br>The limiting factor is our ability to organize it.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">This observation leads to one of the central principles of January AI:<br>The greatest opportunity created by AI is not artificial intelligence alone. It is collective intelligence.<br>Collective intelligence emerges when diverse perspectives, expertise, lived experience, institutional knowledge, and computational capability work together toward a common objective.<br>Technology enables it.<br>Governance sustains it.<br>Community strengthens it.<br>Capital accelerates it.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">January AI exists to orchestrate all four.<\u002Fp>\n        <p style=\"font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:clamp(20px,4vw,24px); color:#2f2f2f; margin:0 0 18px;\">From Scarcity to Abundance<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">Much of society’s discussion surrounding AI has focused on disruption.<br>Will jobs disappear?<br>Will industries be displaced?<br>Will existing institutions survive?<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">These are important questions.<br>They deserve careful attention.<br>Yet they represent only one side of the equation.<br>History demonstrates that technological revolutions create new forms of abundance even as they disrupt established systems.<br>Agricultural innovation reduced food scarcity.<br>Industrial innovation expanded manufacturing capacity.<br>Digital technologies democratized access to information.<br>Artificial intelligence has the potential to create abundance in knowledge, creativity, healthcare, scientific discovery, education, entrepreneurship, and productivity.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">The challenge is ensuring that this abundance is widely distributed rather than narrowly concentrated.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">This distinction is foundational to January AI.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">The institution is not organized around preventing technological progress.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">It is organized around expanding participation in its benefits.<br>Rather than asking how society can slow AI, January AI asks how society can responsibly accelerate positive outcomes while ensuring that individuals, communities, and future generations share in the value created.<\u002Fp>\n        <p style=\"font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:clamp(20px,4vw,24px); color:#2f2f2f; margin:0 0 18px;\">A New Philosophy of Capital<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">Innovation has always required capital.<br>Traditionally, capital flows toward opportunities that maximize financial return.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">This mechanism has produced extraordinary advances.<br>Yet many of society’s most important challenges cannot be evaluated solely through the lens of financial performance.<br>Some initiatives generate measurable public value long before they generate commercial value. Others may never become profitable while remaining enormously beneficial.<br>January AI therefore proposes a broader understanding of capital. Financial capital remains essential. But equally important are intellectual capital, social capital, institutional capital, and civic capital.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">The role of January AI is not simply to raise money.<br>Its role is to orchestrate these forms of capital so that promising ideas receive the resources appropriate to their stage of development.<br>Operating support sustains the institution.<br>Innovation capital funds experimentation.<br>Implementation capital scales successful solutions.<br>Knowledge generated through each initiative returns to the community, increasing the value of the ecosystem as a whole.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">In this model, capital becomes more than funding.<br>It becomes stewardship.<\u002Fp>\n        <p style=\"font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:clamp(20px,4vw,24px); color:#2f2f2f; margin:0 0 18px;\">Trust as Infrastructure<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">Artificial intelligence cannot fulfill its potential without public trust. Trust cannot be demanded. It must be earned.<br>Transparency earns trust.<br>Evidence earns trust.<br>Participation earns trust.<br>Accountability earns trust.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">January AI therefore treats trust not as a communications objective but as institutional infrastructure.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">Every decision, every initiative, every allocation of resources, and every measurement of impact should reinforce the community’s confidence that the institution exists to serve the public interest.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">Trust is not an outcome of governance.<br>Trust is the reason governance exists.<\u002Fp>\n        <p style=\"font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:clamp(20px,4vw,24px); color:#2f2f2f; margin:0 0 18px;\">Why January AI—and Why Now?<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">The coming decade will determine how AI is integrated into nearly every aspect of human life. The decisions made during this period will influence education, employment, healthcare, scientific research, entrepreneurship, public policy, and civic life for generations. Institutions created during periods of transformation often shape society long after the technologies themselves have matured.<br>Universities outlived the printing press.<br>Standards organizations outlived the Industrial Revolution.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">The institutions established during the early Internet era continue to influence the digital world today. The AI era deserves institutions of similar ambition. Not because AI needs another advocate. But because society needs better mechanisms for translating intelligence into public benefit.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">January AI is offered as one such mechanism.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0;\">Its ambition is not to control artificial intelligence.<br>Its ambition is to help society organize around it—with wisdom, transparency, evidence, and a commitment to expanding opportunity for all.<\u002Fp>\n    <\u002Fdiv>\n    <button sc-camel-on-click=\"{{ toggle_opportunity }}\" style=\"display:flex; align-items:center; justify-content:center; width:100%; background:none; border:none; cursor:pointer; padding:20px 0 4px;\">\n        <img src=\"0032e619-25d1-43f8-b719-020703ed33e2\" alt=\"Close section\" style=\"width:32px; height:32px; display:block;\">\n      <\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fsection>\n  <section id=\"ecosystem\" data-screen-label=\"The JanuaryAI Ecosystem\" style=\"max-width:640px; width:100%; margin:0 auto; padding-top:64px;\">\n    <div style=\"border-top:1px solid #e2e2e2; padding-top:32px;\">\n      <button sc-camel-on-click=\"{{ toggle_ecosystem }}\" style=\"display:flex; align-items:center; gap:16px; width:100%; background:none; border:none; cursor:pointer; padding:0; text-align:left; font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:clamp(20px,4vw,26px); line-height:1.2; color:#2f2f2f; text-transform:uppercase; letter-spacing:0.01em;\">\n        <span style=\"font-size:28px; color:#a7ddc9; display:inline-block; transition:transform 0.2s ease; transform:{{ arrow_ecosystem }};\">▶<\u002Fspan>\n        <span>The JanuaryAI Ecosystem<\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fdiv>\n    <sc-if value=\"{{ open_ecosystem }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"padding-top:22px;\">\n    <div style=\"text-align:left;\">\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-style:italic; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px; text-align:center;\">Orchestrating Transition<\u002Fp>\n        <p style=\"font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:clamp(20px,4vw,24px); color:#2f2f2f; margin:0 0 18px;\">Designing an Institution for Continuous Innovation<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">If the previous section answered why January AI should exist, this section answers a more practical question:<br>How should it be designed?<br>The answer is neither as a traditional nonprofit nor as a conventional company.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">Instead, January AI is envisioned as an ecosystem of complementary organizations, each with a distinct mission, governance model, and source of value. Together, they create a self-reinforcing system capable of generating ideas, evaluating them, funding them, implementing them, and learning from the results.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">This architecture is intentional.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">No single organization can simultaneously maximize public trust, commercial innovation, community governance, and entrepreneurial agility. Attempting to combine these missions within one entity inevitably creates competing incentives.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">The January AI ecosystem recognizes these differences and assigns each responsibility to the organization best suited to fulfill it.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">The result is not a single institution, but an institutional ecosystem.<\u002Fp>\n        <p style=\"font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:clamp(20px,4vw,24px); color:#2f2f2f; margin:0 0 18px;\">The Ecosystem at a Glance<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">The January AI ecosystem is built around five interconnected components:<br>The January AI Foundation<br>The January AI Community<br>JAN, the community’s AI knowledge companion<br>BÕDEN, the commercial innovation partner<br>Capital Partners, who finance experimentation and implementation<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">Each performs a unique function.<br>None replaces the others.<br>Each strengthens the entire ecosystem.<br>Together they create a continuous cycle of innovation, governance, learning, and public benefit.<\u002Fp>\n        <p style=\"font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:clamp(20px,4vw,24px); color:#2f2f2f; margin:0 0 18px;\">The January AI Foundation<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">At the center of the ecosystem is the January AI Foundation.<br>The Foundation exists for one purpose:<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">To steward the public-interest mission of the ecosystem.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">Its responsibility is not to own innovation.<br>Its responsibility is to enable innovation that serves society.<br>Accordingly, the Foundation serves as:<br>convener of the community,<br>steward of governance,<br>curator of the Knowledge Commons,<br>organizer of the annual Summit,<br>facilitator of collaboration,<br>evaluator of outcomes,<br>publisher of results,<br>and guardian of institutional trust.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">Unlike many nonprofit organizations, the Foundation is not measured primarily by funds raised or grants awarded.<br>Its success is measured by the quality of the ecosystem it enables and the measurable public benefit that ecosystem produces.<br>The Foundation’s role is stewardship.<br>Its product is trust.<\u002Fp>\n        <p style=\"font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:clamp(20px,4vw,24px); color:#2f2f2f; margin:0 0 18px;\">The Community<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">If the Foundation is the steward, the community is the source of intelligence.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">January AI is built on a simple but profound belief:<br>The best solutions rarely emerge from isolated experts alone.<br>Instead, meaningful innovation arises when entrepreneurs, researchers, educators, technologists, policymakers, investors, philanthropists, students, artists, and citizens contribute diverse perspectives to shared challenges.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">Accordingly, the community is not an audience.<br>It is not a mailing list.<br>It
