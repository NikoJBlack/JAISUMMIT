n: orbitSpin 7s linear infinite reverse;\">\n      <circle cx=\"84\" cy=\"60\" r=\"6\" fill=\"#7b2d8b\" opacity=\"0.8\"><\u002Fcircle>\n    <\u002Fg>\n    <g style=\"transform-origin: 60px 60px; animation: orbitSpin 10s linear infinite;\">\n      <circle cx=\"60\" cy=\"88\" r=\"6\" fill=\"#3ab54a\" opacity=\"0.8\"><\u002Fcircle>\n    <\u002Fg>\n    <g style=\"transform-origin: 60px 60px; animation: orbitSpin 13s linear infinite reverse;\">\n      <circle cx=\"26\" cy=\"60\" r=\"7\" fill=\"#f26522\" opacity=\"0.8\"><\u002Fcircle>\n    <\u002Fg>\n  <\u002Fsvg>\n  <div style=\"display:flex; flex-direction:column; align-items:center; text-align:center; font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; text-transform:uppercase; line-height:0.92; letter-spacing:-0.01em;\">\n    <span style=\"font-size:clamp(34px,8vw,58px); color:#c7c9c8;\">Issues<\u002Fspan>\n    <span style=\"font-size:clamp(34px,8vw,58px); color:#c7c9c8; margin-top:clamp(-8px,-2vw,-14px);\">Topics<\u002Fspan>\n    <span style=\"font-size:clamp(34px,8vw,58px); color:#8fd6bd; margin-top:clamp(-8px,-2vw,-14px);\">Posts<\u002Fspan>\n  <\u002Fdiv>\n  <p style=\"max-width:600px; margin:clamp(28px,5vh,40px) 0 0; text-align:center; font-style:italic; font-size:clamp(18px,3.4vw,22px); line-height:1.55; color:#6a6a6a;\">The Commons in the open — what the community is discussing, ranked by the community.<\u002Fp>\n\n\n  <div style=\"width:min(820px,100%); margin-top:clamp(40px,7vh,64px); display:flex; flex-wrap:wrap; gap:10px 14px; align-items:center;\">\n    <div style=\"display:flex; gap:8px;\">\n      <sc-for list=\"{{ sorts }}\" as=\"s\" hint-placeholder-count=\"3\">\n        <button sc-camel-on-click=\"{{ s.onClick }}\" style=\"cursor:pointer; border:none; border-radius:999px; padding:9px 18px; font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:11px; letter-spacing:0.1em; text-transform:uppercase; background:{{ s.bg }}; color:{{ s.color }};\">{{ s.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n      <button sc-camel-on-click=\"{{ openHelp }}\" title=\"How Issues, Topics, Posts works\" style=\"cursor:pointer; border:1px solid #0f9d76; border-radius:999px; padding:8px 16px; font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:11px; letter-spacing:0.1em; background:#ffffff; color:#0f9d76;\" style-hover=\"background:#0f9d76; color:#ffffff;\">???<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ openCoin }}\" title=\"Coin-Up ? — donations, membership, log in\" style=\"cursor:pointer; border:1px solid #f4511e; border-radius:999px; padding:8px 16px; min-width:112px; font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:11px; letter-spacing:0.1em; text-transform:uppercase; background:#ffffff; color:{{ coinBtnColor }}; transition:color 0.3s ease;\" style-hover=\"background:#f4511e; color:#ffffff;\">{{ coinBtnLabel }}<\u002Fbutton>\n    <\u002Fdiv>\n  <sc-if value=\"{{ coinOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div sc-camel-on-click=\"{{ closeCoin }}\" style=\"position:fixed; inset:0; z-index:230; background:rgba(40,44,42,0.55); display:flex; align-items:center; justify-content:center; padding:clamp(12px,4vw,40px); box-sizing:border-box;\">\n      <div role=\"dialog\" aria-modal=\"true\" aria-label=\"Coin-Up ?\" sc-camel-on-click=\"{{ stopHelp }}\" style=\"position:relative; width:min(520px,100%); max-height:90vh; overflow-y:auto; background:#ffffff; border-radius:22px; box-shadow:0 24px 70px rgba(0,0,0,0.28); padding:clamp(26px,5vw,40px) clamp(22px,5vw,40px) clamp(22px,4vw,32px); box-sizing:border-box; display:flex; flex-direction:column; gap:18px;\">\n        <button type=\"button\" sc-camel-on-click=\"{{ closeCoin }}\" aria-label=\"Close\" style=\"position:absolute; top:16px; right:16px; width:32px; height:32px; padding:0; border:0; background:transparent; cursor:pointer;\"><img src=\"ee780f2b-f8f5-46c1-b66f-1d5ec6ca8e98\" alt=\"\" style=\"width:32px; height:32px; display:block;\"><\u002Fbutton>\n        <h2 style=\"margin:0; font-family:'Arial Black','Helvetica Neue',Helvetica,sans-serif; font-weight:900; font-size:clamp(34px,8vw,48px); line-height:0.92; letter-spacing:-0.02em; text-transform:uppercase; color:#1f2321;\">Coin-Up <span style=\"color:#8fd6bd;\">?<\u002Fspan><\u002Fh2>\n        <p style=\"margin:0; font-family:Georgia,serif; font-size:16px; line-height:1.55; color:#3a3f3d; text-wrap:pretty;\"><strong>YES<\u002Fstrong>, The JanuaryAI Project needs donations, grants and membership to fund its future. But this doesn't buy votes. This is a non-profit organization solidly grounded in democratic coordination <strong>1 Person, 1 Vote<\u002Fstrong>.<\u002Fp>\n        <p style=\"margin:0; font-family:'Arial Black','Helvetica Neue',Helvetica,sans-serif; font-weight:900; font-size:14px; letter-spacing:0.04em; text-transform:uppercase; line-height:1.35; color:#0f9d76;\">Become a Member, Patron, Contributor or Partner and VOTE !<\u002Fp>\n        <div style=\"display:flex; flex-direction:column; gap:10px; border-top:1px solid #e6ebe9; padding-top:18px;\">\n          <label style=\"display:flex; align-items:center; gap:10px;\">\n            <span style=\"flex:none; width:92px; font-family:'Arial Black','Helvetica Neue',Helvetica,sans-serif; font-weight:900; font-size:12px; letter-spacing:0.1em; text-transform:uppercase; color:#0f9d76;\">ID<\u002Fspan>\n            <input type=\"text\" inputmode=\"email\" autocomplete=\"username\" autocapitalize=\"off\" placeholder=\"phone# or email\" value=\"{{ coinContact }}\" sc-camel-on-change=\"{{ onCoinContact }}\" sc-camel-on-key-down=\"{{ coinKey }}\" sc-camel-enter-key-hint=\"next\" aria-label=\"Member ID: phone number or email\" style=\"flex:1; min-width:0; border:1px solid #c7c9c8; border-radius:12px; padding:0 14px; min-height:48px; font-family:Georgia,serif; font-size:16px; color:#1f2321; outline:none; box-sizing:border-box;\">\n          <\u002Flabel>\n          <label style=\"display:flex; align-items:center; gap:10px;\">\n            <span style=\"flex:none; width:92px; font-family:'Arial Black','Helvetica Neue',Helvetica,sans-serif; font-weight:900; font-size:12px; letter-spacing:0.1em; text-transform:uppercase; color:#0f9d76;\">{{ coinPwLabelText }}<\u002Fspan>\n            <input type=\"{{ coinPwType }}\" autocomplete=\"{{ coinPwAuto }}\" inputmode=\"{{ coinPwMode }}\" placeholder=\"{{ coinPwPh }}\" value=\"{{ coinPw }}\" sc-camel-on-change=\"{{ onCoinPw }}\" sc-camel-on-key-down=\"{{ coinKey }}\" sc-camel-enter-key-hint=\"go\" aria-label=\"Password\" style=\"flex:1; min-width:0; border:1px solid #c7c9c8; border-radius:12px; padding:0 14px; min-height:48px; font-family:Georgia,serif; font-size:16px; color:#1f2321; outline:none; box-sizing:border-box;\">\n          <\u002Flabel>\n          <div style=\"display:flex; flex-wrap:wrap; align-items:center; gap:12px; padding-left:102px;\">\n            <button type=\"button\" sc-camel-on-click=\"{{ coinLogin }}\" style=\"cursor:pointer; border:0; border-radius:12px; padding:0 26px; min-height:48px; background:#0f9d76; color:#ffffff; font-family:'Arial Black','Helvetica Neue',Helvetica,sans-serif; font-weight:900; font-size:14px; letter-spacing:0.08em; text-transform:uppercase;\" style-hover=\"background:#0b7f5f;\">{{ coinBtnText }}<\u002Fbutton>\n            <sc-if value=\"{{ coinShowHelp }}\" hint-placeholder-val=\"{{ false }}\">\n              <button type=\"button\" sc-camel-on-click=\"{{ coinHelp }}\" style=\"cursor:pointer; border:1px solid #0f9d76; border-radius:12px; padding:0 20px; min-height:48px; background:#ffffff; color:#0f9d76; font-family:'Arial Black','Helvetica Neue',Helvetica,sans-serif; font-weight:900; font-size:14px; letter-spacing:0.08em; text-transform:uppercase;\" style-hover=\"background:#e8f6f0;\">Help<\u002Fbutton>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <p style=\"margin:0; padding-left:102px; font-family:Georgia,serif; font-style:italic; font-size:16px; line-height:1.5; color:#3a3f3d;\">Thank You for your Support<\u002Fp>\n          <sc-if value=\"{{ hasCoinStatus }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-family:Georgia,serif; font-size:14px; line-height:1.45; color:{{ coinStatusColor }};\">{{ coinStatus }}<\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ coinIn }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex; align-items:center; gap:16px; border:1px solid #ececec; border-radius:14px; padding:12px 16px; background:#ffffff;\">\n              <div style=\"display:flex; flex-direction:column; align-items:center; gap:2px; flex:none; width:44px;\">\n                <button type=\"button\" sc-camel-on-click=\"{{ donUp }}\" title=\"Increase by $1\" aria-label=\"Increase monthly donation by one dollar\" style=\"cursor:pointer; background:none; border:none; padding:0; line-height:1; font-size:22px; min-width:44px; min-height:34px; color:#0f9d76;\">▲<\u002Fbutton>\n                <button type=\"button\" sc-camel-on-click=\"{{ donDown }}\" title=\"Decrease by $1\" aria-label=\"Decrease monthly donation by one dollar\" style=\"cursor:pointer; background:none; border:none; padding:0; line-height:1; font-size:22px; min-width:44px; min-height:34px; color:{{ donDownColor }};\">▼<\u002Fbutton>\n              <\u002Fdiv>\n              <div style=\"flex:1; min-width:0; display:flex; flex-direction:column; gap:4px;\">\n                <div style=\"font-family:'Arial Black','Helvetica Neue',Helvetica,sans-serif; font-weight:900; font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:#0f9d76;\">Member Monthly Donation<\u002Fdiv>\n                <div style=\"font-family:'Arial Black','Helvetica Neue',Helvetica,sans-serif; font-weight:900; font-size:30px; line-height:1; color:#1f2321;\">{{ donLabel }}<span style=\"font-family:Georgia,serif; font-weight:400; font-size:15px; color:#6a6a6a;\"> / month<\u002Fspan><\u002Fdiv>\n                <div style=\"font-family:Georgia,serif; font-size:13px; line-height:1.4; color:#6a6a6a;\">{{ donNote }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"font-family:Georgia,serif; font-size:13px; line-height:1.5; color:#5d6361; border-top:1px solid #e6ebe9; padding-top:14px;\">Donations are tax-deductible. Free Membership by request.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ helpOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div sc-camel-on-click=\"{{ closeHelp }}\" style=\"position:fixed; inset:0; z-index:220; background:rgba(40,44,42,0.55); display:flex; align-items:center; justify-content:center; padding:clamp(12px,4vw,40px); box-sizing:border-box;\">\n      <div role=\"dialog\" aria-modal=\"true\" aria-label=\"How Issues, Topics, Posts works\" sc-camel-on-click=\"{{ stopHelp }}\" style=\"position:relative; width:min(720px,100%); max-height:88vh; background:#ffffff; border-radius:22px; box-shadow:0 24px 70px rgba(0,0,0,0.28); display:flex; flex-direction:column; overflow:hidden;\">\n        <button type=\"button\" sc-camel-on-click=\"{{ closeHelp }}\" aria-label=\"Close\" style=\"position:absolute; top:16px; right:16px; width:32px; height:32px; padding:0; border:0; background:transparent; cursor:pointer; z-index:2;\"><img src=\"ee780f2b-f8f5-46c1-b66f-1d5ec6ca8e98\" alt=\"\" style=\"width:32px; height:32px; display:block;\"><\u002Fbutton>\n        <div style=\"padding:clamp(26px,5vw,40px) clamp(22px,5vw,44px) 14px; border-bottom:1px solid #e6ebe9;\">\n          <div style=\"font-family:'Arial Black','Helvetica Neue',Helvetica,sans-serif; font-weight:900; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:#0f9d76;\">The Commons · Explainer<\u002Fdiv>\n          <div style=\"margin-top:10px; display:flex; flex-direction:column; font-family:'Arial Black','Helvetica Neue',Helvetica,sans-serif; font-weight:900; text-transform:uppercase; line-height:0.95; font-size:clamp(24px,5vw,34px); color:#c7c9c8;\">\n            <span>How Issues,<\u002Fspan><span>Topics, Posts<\u002Fspan><span style=\"color:#8fd6bd;\">Works<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"overflow-y:auto; -webkit-overflow-scrolling:touch; padding:22px clamp(22px,5vw,44px) 30px; text-wrap:pretty;\">\n          <p style=\"margin:0 0 14px; font-family:Georgia,'Times New Roman',serif; font-size:16px; line-height:1.62; color:#4a4a4a;\">This is the Commons — the first stage of the Virtuous Cycle. Anyone can post an issue, an idea or a question. Members read, vote and comment. The ideas the community carries forward move on to Meeting of the Minds, where working groups turn them into proposals for the January Summit.<\u002Fp>\n\n          <div style=\"font-family:'Arial Black','Helvetica Neue',Helvetica,sans-serif; font-weight:900; font-size:clamp(15px,3vw,18px); text-transform:uppercase; color:#2f2f2f; margin:26px 0 10px;\">Reading the feed<\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:10px; margin:0 0 14px;\">\n            <div style=\"display:flex; gap:12px; font-family:Georgia,'Times New Roman',serif; font-size:16px; line-height:1.55; color:#4a4a4a;\"><strong style=\"flex:none; min-width:52px; font-family:'Arial Black',Helvetica,sans-serif; font-size:12px; color:#0f9d76; padding-top:2px;\">HOT<\u002Fstrong><span>What the community is engaging with right now — score weighted by how recent it is.<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex; gap:12px; font-family:Georgia,'Times New Roman',serif; font-size:16px; line-height:1.55; color:#4a4a4a;\"><strong style=\"flex:none; min-width:52px; font-family:'Arial Black',Helvetica,sans-serif; font-size:12px; color:#0f9d76; padding-top:2px;\">NEW<\u002Fstrong><span>Newest posts first. Where fresh ideas get their first look.<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex; gap:12px; font-family:Georgia,'Times New Roman',serif; font-size:16px; line-height:1.55; color:#4a4a4a;\"><strong style=\"flex:none; min-width:52px; font-family:'Arial Black',Helvetica,sans-serif; font-size:12px; color:#0f9d76; padding-top:2px;\">TOP<\u002Fstrong><span>Highest score of all time.<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"margin:0 0 14px; font-family:Georgia,'Times New Roman',serif; font-size:16px; line-height:1.62; color:#4a4a4a;\">Topic chips filter the feed. <strong>My Idea !<\u002Fstrong> opens the composer to post your own.<\u002Fp>\n\n          <div style=\"font-family:'Arial Black','Helvetica Neue',Helvetica,sans-serif; font-weight:900; font-size:clamp(15px,3vw,18px); text-transform:uppercase; color:#2f2f2f; margin:26px 0 10px;\">Two ways to vote<\u002Fdiv>\n          <p style=\"margin:0 0 14px; font-family:Georgia,'Times New Roman',serif; font-size:16px; line-height:1.62; color:#4a4a4a;\"><strong>Up / down arrows<\u002Fstrong> rank a post in the feed — “this deserves attention” or “not ready yet.”<\u002Fp>\n          <p style=\"margin:0 0 14px; font-family:Georgia,'Times New Roman',serif; font-size:16px; line-height:1.62; color:#4a4a4a;\"><strong>Vote YES / Vote NO<\u002Fstrong> inside a post records your position on the question itself. One member, one vote per post. You can change your vote at any time before the question resolves; every change is kept in the public record.<\u002Fp>\n\n          <div style=\"font-family:'Arial Black','Helvetica Neue',Helvetica,sans-serif; font-weight:900; font-size:clamp(15px,3vw,18px); text-transform:uppercase; color:#2f2f2f; margin:26px 0 10px;\">Like Kalshi — without the bet<\u002Fdiv>\n          <p style=\"margin:0 0 14px; font-family:Georgia,'Times New Roman',serif; font-size:16px; line-height:1.62; color:#4a4a4a;\">Predictive AI Market questions work like an event contract on Kalshi: a clear yes-or-no question, a resolve-by date, and a named source that settles it. The running YES/NO tally is the community’s forecast.<\u002Fp>\n          <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; margin:0 0 14px;\">\n            <div style=\"border:1px solid #d6ebe3; border-radius:14px; padding:14px 16px; font-family:Georgia,serif; font-size:15px; line-height:1.55; color:#4a4a4a;\"><div style=\"font-family:'Arial Black',Helvetica,sans-serif; font-weight:900; font-size:11px; letter-spacing:0.1em; color:#0f9d76; margin-bottom:6px;\">THE SAME<\u002Fdiv>Yes/no events · resolve-by dates · named resolution sources · a live crowd forecast · you can change your position<\u002Fdiv>\n            <div style=\"border:1px solid #fbd3c4; border-radius:14px; padding:14px 16px; font-family:Georgia,serif; font-size:15px; line-height:1.55; color:#4a4a4a;\"><div style=\"font-family:'Arial Black',Helvetica,sans-serif; font-weight:900; font-size:11px; letter-spacing:0.1em; color:#f4511e; margin-bottom:6px;\">DIFFERENT<\u002Fdiv>No money is staked · no prices, no payouts · one member, one vote — conviction counts, wealth doesn’t<\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"margin:0 0 14px; font-family:Georgia,'Times New Roman',serif; font-size:16px; line-height:1.62; color:#4a4a4a;\">You cannot place a bet on any event here. What you earn is <em>standing<\u002Fem> — a record of how well you forecast.<\u002Fp>\n\n          <div style=\"font-family:'Arial Black','Helvetica Neue',Helvetica,sans-serif; font-weight:900; font-size:clamp(15px,3vw,18px); text-transform:uppercase; color:#2f2f2f; margin:26px 0 10px;\">How to uplevel<\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:12px; margin:0 0 14px;\">\n            <div style=\"display:flex; gap:12px; font-family:Georgia,'Times New Roman',serif; font-size:16px; line-height:1.55; color:#4a4a4a;\"><span style=\"flex:none; width:26px; height:26px; border-radius:50%; background:#1d8fe1; color:#ffffff; font-family:'Arial Black',Helvetica,sans-serif; font-weight:900; font-size:12px; display:flex; align-items:center; justify-content:center;\">1<\u002Fspan><span><strong>Visitor.<\u002Fstrong> Read everything, no sign-in needed.<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex; gap:12px; font-family:Georgia,'Times New Roman',serif; font-size:16px; line-height:1.55; color:#4a4a4a;\"><span style=\"flex:none; width:26px; height:26px; border-radius:50%; background:#7b2d8b; color:#ffffff; font-family:'Arial Black',Helvetica,sans-serif; font-weight:900; font-size:12px; display:flex; align-items:center; justify-content:center;\">2<\u002Fspan><span><strong>Citizen Member.<\u002Fstrong> Sign in with the globe using your phone# or email. You can now vote YES/NO, rank posts, comment and post ideas.<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex; gap:12px; font-family:Georgia,'Times New Roman',serif; font-size:16px; line-height:1.55; color:#4a4a4a;\"><span style=\"flex:none; width:26px; height:26px; border-radius:50%; background:#3ab54a; color:#ffffff; font-family:'Arial Black',Helvetica,sans-serif; font-weight:900; font-size:12px; display:flex; align-items:center; justify-content:center;\">3<\u002Fspan><span><strong>Forecaster.<\u002Fstrong> Vote on questions and explain your reasoning in the comments. When questions resolve, your record builds standing.<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex; gap:12px; font-family:Georgia,'Times New Roman',serif; font-size:16px; line-height:1.55; color:#4a4a4a;\"><span style=\"flex:none; width:26px; height:26px; border-radius:50%; background:#f26522; color:#ffffff; font-family:'Arial Black',Helvetica,sans-serif; font-weight:900; font-size:12px; display:flex; align-items:center; justify-content:center;\">4<\u002Fspan><span><strong>Contributor.<\u002Fstrong> Post ideas the community ranks up, bring evidence that changes minds, and your posts move toward Meeting of the Minds working groups.<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex; gap:12px; font-family:Georgia,'Times New Roman',serif; font-size:16px; line-height:1.55; color:#4a4a4a;\"><span style=\"flex:none; width:26px; height:26px; border-radius:50%; background:#0f9d76; color:#ffffff; font-family:'Arial Black',Helvetica,sans-serif; font-weight:900; font-size:12px; display:flex; align-items:center; justify-content:center;\">5<\u002Fspan><span><strong>Patron.<\u002Fstrong> A $6 gift adds a Summit seat and account credit. It never adds voting weight — one human, one vote.<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:30px; padding:18px 18px 20px; border:1px dashed #c7c9c8; border-radius:16px; background:#fafafa;\">\n            <div style=\"display:flex; align-items:center; gap:8px; font-family:'Arial Black',Helvetica,sans-serif; font-weight:900; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:#6a6a6a;\"><span style=\"width:8px; height:8px; border-radius:50%; background:#f4511e;\"><\u002Fspan>Comments to the Admin<\u002Fdiv>\n            <p style=\"margin:8px 0 12px; font-family:Georgia,serif; font-size:14px; line-height:1.5; color:#8a8a8a;\">Flag a problem, a correction, or a question about this page. Comments are addressed to the admin and listed publicly below.<\u002Fp>\n            <textarea value=\"{{ adminNote }}\" sc-camel-on-change=\"{{ onAdminNote }}\" placeholder=\"Your note to the admin…\" rows=\"4\" style=\"width:100%; box-sizing:border-box; resize:vertical; background:#ffffff; border:1px solid #e2e2e2; border-radius:12px; padding:12px 14px; font-family:Georgia,serif; font-size:16px; line-height:1.5; color:#2f2f2f; outline:none;\"><\u002Ftextarea>\n            <div style=\"display:flex; flex-wrap:wrap; align-items:center; gap:12px; margin-top:10px;\">\n              <button sc-camel-on-click=\"{{ sendAdminNote }}\" style=\"cursor:pointer; border:none; border-radius:999px; padding:10px 22px; min-height:44px; background:#0f9d76; color:#ffffff; font-family:'Arial Black',Helvetica,sans-serif; font-weight:900; font-size:11px; letter-spacing:0.1em; text-transform:uppercase;\">Send to Admin<\u002Fbutton>\n              <span style=\"font-family:Helvetica,Arial,sans-serif; font-size:12px; color:#8a8a8a;\">{{ adminStatus }}<\u002Fspan>\n            <\u002Fdiv>\n            <sc-if value=\"{{ hasAdminNotes }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"margin-top:18px; border-top:1px solid #e2e2e2; padding-top:14px;\">\n                <div style=\"font-family:'Arial Black',Helvetica,sans-serif; font-weight:900; font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:#0f9d76; margin-bottom:8px;\">Comments · {{ adminCount }}<\u002Fdiv>\n                <sc-for list=\"{{ adminNotes }}\" as=\"n\" hint-placeholder-count=\"2\">\n                  <div style=\"padding:10px 0; border-bottom:1px solid #eeeeee; font-family:Georgia,serif; font-size:15px; line-height:1.5; color:#4a4a4a;\"><div style=\"font-family:Helvetica,Arial,sans-serif; font-size:12px; color:#9a9a9a; margin-bottom:3px;\">{{ n.meta }}<\u002Fdiv>{{ n.text }}<\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <div style=\"margin-top:22px; text-align:center; font-family:Helvetica,Arial,sans-serif; font-size:12px; color:#a8a8a8;\">© 2026 DL Thomas. All Rights Reserved.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n    <button sc-camel-on-click=\"{{ openComposer }}\" style=\"margin-left:auto; flex:none; cursor:pointer; border:none; border-radius:999px; padding:11px 24px; min-height:44px; font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:clamp(15px,2.6vw,18px); letter-spacing:0.06em; text-transform:uppercase; background:#f4511e; color:#ffffff;\" style-hover=\"background:#d93f10;\">My Idea !<\u002Fbutton>\n    <div style=\"display:flex; gap:8px; flex-wrap:wrap; flex-basis:100%;\">\n      <sc-for list=\"{{ topicFilters }}\" as=\"t\" hint-placeholder-count=\"4\">\n        <button sc-camel-on-click=\"{{ t.onClick }}\" style=\"display:inline-flex; align-items:center; gap:6px; cursor:pointer; border:1px solid {{ t.border }}; border-radius:999px; padding:7px 14px 7px 8px; font-family:Helvetica, Arial, sans-serif; font-size:12px; background:{{ t.bg }}; color:{{ t.color }};\">\n          <span style=\"width:16px; height:16px; display:block; flex:none; background-image:{{ t.iconCss }}; background-size:contain; background-repeat:no-repeat; background-position:center;\"><\u002Fspan>\n          <span>{{ t.label }}<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"width:min(820px,100%); margin-top:22px; display:flex; flex-direction:column; gap:12px;\">\n    <div id=\"open-letter-openai\" style=\"display:flex; gap:16px; align-items:flex-start; border:1px solid #ececec; border-radius:14px; padding:16px 18px; background:#ffffff;\">\n      <div style=\"flex:none; width:44px;\"><\u002Fdiv>\n      <div style=\"flex:1; min-width:0;\">\n        <div style=\"display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:6px;\">\n          <span style=\"display:inline-flex; align-items:center; font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:10px; letter-spacing:0.09em; text-transform:uppercase; color:#0f9d76; background:#e8f6f0; padding:4px 10px; border-radius:999px;\">Open Letter<\u002Fspan>\n          <span style=\"font-family:Helvetica, Arial, sans-serif; font-size:12px; color:#9a9a9a;\">pinned · posted by DL Thomas · {{ letterCommentCount }} comments<\u002Fspan>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ openLetterPost }}\" style=\"display:block; width:100%; text-align:left; background:none; border:none; padding:0; cursor:pointer; font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:clamp(16px,2.6vw,19px); line-height:1.3; color:#2f2f2f; margin-bottom:8px;\" style-hover=\"color:#0f9d76;\">Open Letter to the OpenAI Foundation<\u002Fbutton>\n        <p style=\"font-size:clamp(15px,2.6vw,17px); line-height:1.55; color:#5a5a5a; margin:0;\">Dear Anna Makanju, Bret Taylor and the OpenAI Foundation Civil Society &amp; Philanthropy Team, Good Morning, the Sun is shining in Colorado! I am the founder of the JanuaryAI Project (JAI), an emerging civil-society initiative built around a straightforward proposition: AI should advance the human condition—and humanity should advance alongside AI.<\u002Fp>\n        <div style=\"display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-top:12px;\">\n          <button sc-camel-on-click=\"{{ openLetterPost }}\" style=\"cursor:pointer; border:1px solid #e2e2e2; border-radius:999px; min-height:36px; padding:0 16px; background:#ffffff; color:#6a6a6a; font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:11px; letter-spacing:0.09em; text-transform:uppercase;\" style-hover=\"border-color:#0f9d76; color:#0f9d76;\">Full Transcript<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ openLetterComments }}\" style=\"cursor:pointer; border:1px solid #e2e2e2; border-radius:999px; min-height:36px; padding:0 16px; background:#ffffff; color:#6a6a6a; font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:11px; letter-spacing:0.09em; text-transform:uppercase;\" style-hover=\"border-color:#0f9d76; color:#0f9d76;\">Comment<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <sc-if value=\"{{ isAdminDel }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"border:1px dashed #f4511e; border-radius:14px; padding:14px 16px; background:#fff8f5; display:flex; flex-direction:column; gap:10px;\">\n        <div style=\"font-family:'Arial Black','Helvetica Neue',Helvetica,sans-serif; font-weight:900; font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:#f4511e;\">Admin · Deleted posts · {{ delCount }}<\u002Fdiv>\n        <sc-if value=\"{{ delEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-family:Helvetica, Arial, sans-serif; font-size:13px; color:#8a8a8a;\">No deletions yet.<\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-for list=\"{{ delLog }}\" as=\"d\" hint-placeholder-count=\"0\">\n          <div style=\"display:flex; flex-wrap:wrap; align-items:center; gap:10px; padding:10px 0; border-top:1px solid #f4dcd2;\">\n            <div style=\"flex:1 1 260px; min-width:0; display:flex; flex-direction:column; gap:3px;\">\n              <span style=\"font-family:'Arial Black','Helvetica Neue',Helvetica,sans-serif; font-weight:900; font-size:13px; color:#2f2f2f;\">{{ d.title }}<\u002Fspan>\n              <span style=\"font-family:Helvetica, Arial, sans-serif; font-size:12px; color:#6a6a6a;\">by {{ d.author }} · deleted by {{ d.deletedBy }} · {{ d.when }}<\u002Fspan>\n              <span style=\"font-family:Georgia, serif; font-size:14px; font-style:italic; color:#4a4a4a;\">“{{ d.reason }}”<\u002Fspan>\n              <span style=\"font-family:Helvetica, Arial, sans-serif; font-size:12px; color:{{ d.statusColor }};\">{{ d.status }}<\u002Fspan>\n            <\u002Fdiv>\n            <sc-if value=\"{{ d.canRestore }}\" hint-placeholder-val=\"{{ false }}\">\n              <button type=\"button\" sc-camel-on-click=\"{{ d.onRestore }}\" style=\"cursor:pointer; border:1px solid #0f9d76; border-radius:999px; min-height:40px; padding:0 16px; background:#ffffff; color:#0f9d76; font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:11px; letter-spacing:0.08em; text-transform:uppercase;\" style-hover=\"background:#e8f6f0;\">Restore<\u002Fbutton>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-for list=\"{{ posts }}\" as=\"post\" hint-placeholder-count=\"6\">\n      <div id=\"{{ post.anchor }}\" style=\"display:flex; gap:16px; align-items:flex-start; border:1px solid #ececec; border-radius:14px; padding:16px 18px; background:#ffffff;\">\n        <div style=\"display:flex; flex-direction:column; align-items:center; gap:2px; flex:none; width:44px;\">\n          <button sc-camel-on-click=\"{{ post.onUp }}\" title=\"Upvote\" style=\"cursor:pointer; background:none; border:none; padding:0; line-height:1; font-size:22px; min-width:44px; min-height:34px; color:{{ post.upColor }};\">▲<\u002Fbutton>\n          <div style=\"font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:15px; color:#2f2f2f;\">{{ post.score }}<\u002Fdiv>\n          <button sc-camel-on-click=\"{{ post.onDown }}\" title=\"Downvote\" style=\"cursor:pointer; background:none; border:none; padding:0; line-height:1; font-size:22px; min-width:44px; min-height:34px; color:{{ post.downColor }};\">▼<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"flex:1; min-width:0;\">\n          <div style=\"display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:6px;\">\n            <span style=\"display:inline-flex; align-items:center; gap:6px; font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:10px; letter-spacing:0.09em; text-transform:uppercase; color:{{ post.topicColor }}; background:{{ post.topicTint }}; padding:4px 10px 4px 4px; border-radius:999px;\">\n              <span style=\"width:18px; height:18px; display:block; flex:none; background-image:{{ post.topicIconCss }}; background-size:contain; background-repeat:no-repeat; background-position:center;\"><\u002Fspan>\n              <span>{{ post.chipLabel }}<\u002Fspan>\n            <\u002Fspan>\n            <sc-if value=\"{{ post.isMarket }}\" hint-placeholder-val=\"{{ false }}\">\n              <span style=\"display:inline-flex; align-items:center; font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color:#4a1a57; background:#ece3f3; border:1px solid #d9c8e6; border-radius:999px; padding:4px 9px;\">Predictive AI Market<\u002Fspan>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ post.isDemo }}\" hint-placeholder-val=\"{{ true }}\">\n              <span style=\"display:inline-flex; align-items:center; font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color:#f4511e; border:1px solid rgba(244,81,30,0.35); border-radius:999px; padding:4px 9px;\">Demo<\u002Fspan>\n            <\u002Fsc-if>\n            <span style=\"font-family:Helvetica, Arial, sans-serif; font-size:12px; color:#9a9a9a;\">{{ post.meta }}<\u002Fspan>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ post.onOpen }}\" sc-camel-on-context-menu=\"{{ post.onCtx }}\" title=\"Right-click for edit options\" style=\"display:block; width:100%; text-align:left; background:none; border:none; padding:0; cursor:pointer; font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:clamp(16px,2.6vw,19px); line-height:1.3; color:#2f2f2f; margin-bottom:8px;\" style-hover=\"color:#0f9d76;\">{{ post.title }}<\u002Fbutton>\n          <p style=\"font-size:clamp(15px,2.6vw,17px); line-height:1.55; color:#5a5a5a; margin:0;\">{{ post.body }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <div style=\"width:min(820px,100%); margin-top:clamp(48px,8vh,72px); border-top:1px solid #e2e2e2; padding-top:32px;\">\n    <button sc-camel-on-click=\"{{ toggleRules }}\" style=\"display:flex; align-items:center; gap:16px; width:100%; background:none; border:none; cursor:pointer; padding:0; text-align:left; font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:clamp(20px,4vw,26px); line-height:1.2; color:#2f2f2f; text-transform:uppercase; letter-spacing:0.01em;\">\n      <span style=\"font-size:28px; color:#a7ddc9; display:inline-block; transition:transform 0.2s ease; transform:{{ rulesArrow }};\">▶<\u002Fspan>\n      <span>Community Rules<\u002Fspan>\n    <\u002Fbutton>\n    <sc-if value=\"{{ rulesOpen }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"margin-top:22px;\">\n        <p style=\"font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">Voting is how the Commons sets its own agenda, so voting is a matter of record. Every vote is attributed, logged, and auditable by the community.<\u002Fp>\n        <div style=\"display:flex; flex-direction:column; gap:14px; margin:0 0 22px;\">\n          <div style=\"font-size:clamp(16px,3vw,18px); line-height:1.55; color:#4a4a4a;\"><strong>One member, one vote per post.<\u002Fstrong> You may change your vote; the change is logged, the original is not erased.<\u002Fdiv>\n          <div style=\"font-size:clamp(16px,3vw,18px); line-height:1.55; color:#4a4a4a;\"><strong>Votes are attributed.<\u002Fstrong> The log records the member, the topic, the post, the direction of the vote, and the time it was cast.<\u002Fdiv>\n          <div style=\"font-size:clamp(16px,3vw,18px); line-height:1.55; color:#4a4a4a;\"><strong>Vote the substance, not the person.<\u002Fstrong> Downvotes signal “this is not ready or not accurate,” never “I dislike who said it.”<\u002Fdiv>\n          <div style=\"font-size:clamp(16px,3vw,18px); line-height:1.55; color:#4a4a4a;\"><strong>Evidence outranks volume.<\u002Fstrong> Ranking informs the working groups; it does not replace their review.<\u002Fdiv>\n          <div style=\"font-size:clamp(16px,3vw,18px); line-height:1.55; color:#4a4a4a;\"><strong>No brigading or vote trading.<\u002Fstrong> Coordinated voting is visible in the log and forfeits standing in the cycle.<\u002Fdiv>\n          <div style=\"font-size:clamp(16px,3vw,18px); line-height:1.55; color:#4a4a4a;\"><strong>The log is public.<\u002Fstrong> JAN, our Fair Witness, keeps the record so results can be verified rather than trusted.<\u002Fdiv>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ toggleRules }}\" style=\"display:flex; align-items:center; justify-content:center; width:100%; background:none; border:none; cursor:pointer; padding:20px 0 4px;\">\n          <img src=\"ee780f2b-f8f5-46c1-b66f-1d5ec6ca8e98\" alt=\"Close section\" style=\"width:32px; height:32px; display:block;\">\n        <\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n\n  <div style=\"width:min(820px,100%); margin-top:clamp(40px,6vh,56px); border-top:1px solid #e2e2e2; padding-top:32px;\">\n    <button sc-camel-on-click=\"{{ toggleLog }}\" style=\"display:flex; align-items:center; gap:16px; width:100%; background:none; border:none; cursor:pointer; padding:0; text-align:left; font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:clamp(20px,4vw,26px); line-height:1.2; color:#2f2f2f; text-transform:uppercase; letter-spacing:0.01em;\">\n      <span style=\"font-size:28px; color:#a7ddc9; display:inline-block; transition:transform 0.2s ease; transform:{{ logArrow }};\">▶<\u002Fspan>\n      <span>Your Vote Log<\u002Fspan>\n    <\u002Fbutton>\n    <sc-if value=\"{{ logOpen }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"margin-top:22px;\">\n        <div style=\"display:flex; align-items:center; gap:10px; margin-bottom:18px;\">\n          <span style=\"font-family:Helvetica, Arial, sans-serif; font-size:13px; color:#9a9a9a;\">Member<\u002Fspan>\n          <input type=\"text\" value=\"{{ member }}\" sc-camel-on-change=\"{{ onMember }}\" placeholder=\"your member name\" style=\"flex:1; max-width:280px; box-sizing:border-box; background:rgba(217,217,217,0.55); border:none; border-radius:6px; padding:10px 14px; font-family:Helvetica, Arial, sans-serif; font-size:14px; color:#3a3a3a; outline:none;\">\n        <\u002Fdiv>\n        <sc-if value=\"{{ hasLog }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:flex; flex-direction:column; gap:0;\">\n            <div style=\"display:grid; grid-template-columns:{{ logGrid }}; gap:12px; padding:0 0 10px; border-bottom:1px solid #ececec; font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:10px; letter-spacing:0.08em; text-transform:uppercase; color:#9a9a9a;\">\n              <div>Member<\u002Fdiv>\n              <div>Topic<\u002Fdiv>\n              <div>Post<\u002Fdiv>\n              <div>Vote<\u002Fdiv>\n              <div>Logged<\u002Fdiv>\n            <\u002Fdiv>\n            <sc-for list=\"{{ voteLog }}\" as=\"row\" hint-placeholder-count=\"3\">\n              <div style=\"display:grid; grid-template-columns:{{ logGrid }}; gap:6px 12px; padding:12px 0; border-bottom:1px solid #f4f4f4; font-family:Helvetica, Arial, sans-serif; font-size:13px; line-height:1.4; color:#4a4a4a;\">\n                <div>{{ row.member }}<\u002Fdiv>\n                <div>{{ row.topic }}<\u002Fdiv>\n                <div>{{ row.title }}<\u002Fdiv>\n                <div style=\"font-weight:700; color:{{ row.voteColor }};\">{{ row.vote }}<\u002Fdiv>\n                <div style=\"color:#9a9a9a;\">{{ row.when }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ noLog }}\" hint-placeholder-val=\"{{ false }}\">\n          <p style=\"font-size:16px; line-height:1.6; color:#9a9a9a; margin:0;\">No votes recorded yet. Every up or down vote you cast above is written here with the topic, the post, and the time.<\u002Fp>\n        <\u002Fsc-if>\n        <button sc-camel-on-click=\"{{ toggleLog }}\" style=\"display:flex; align-items:center; justify-content:center; width:100%; background:none; border:none; cursor:pointer; padding:24px 0 4px;\">\n          <img src=\"ee780f2b-f8f5-46c1-b66f-1d5ec6ca8e98\" alt=\"Close section\" style=\"width:32px; height:32px; display:block;\">\n        <\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n\n\n  <sc-if value=\"{{ composerOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed; inset:0; z-index:210; background:rgba(20,20,20,0.55); display:flex; align-items:center; justify-content:center; padding:clamp(12px,3vw,40px);\">\n      <div style=\"width:min(620px,100%); max-height:88vh; overflow-y:auto; background:#ffffff; border-radius:18px; box-shadow:0 24px 60px rgba(0,0,0,0.28);\">\n        <div style=\"display:flex; align-items:flex-start; gap:14px; padding:22px 24px 14px; border-bottom:1px solid #f0f0f0;\">\n          <div style=\"flex:1; min-width:0;\">\n            <div style=\"display:inline-flex; align-items:center; font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color:#ffffff; background:#f4511e; border-radius:999px; padding:5px 11px;\">My Idea<\u002Fdiv>\n            <div style=\"font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:clamp(18px,3vw,23px); line-height:1.25; color:#2f2f2f; margin-top:10px;\">Post to the Commons<\u002Fdiv>\n            <div style=\"font-family:Georgia, 'Times New Roman', serif; font-size:15px; line-height:1.5; color:#8a8a8a; margin-top:6px;\">Your post goes to the top of the list. The community ranks it from there.<\u002Fdiv>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ closeComposer }}\" title=\"Close\" style=\"flex:none; background:none; border:none; cursor:pointer; padding:0; line-height:1;\">\n            <img src=\"ee780f2b-f8f5-46c1-b66f-1d5ec6ca8e98\" alt=\"Close\" style=\"width:26px; height:26px; display:block;\">\n          <\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:14px; padding:20px 24px 8px;\">\n          <input type=\"text\" value=\"{{ draftMember }}\" sc-camel-on-change=\"{{ onDraftMember }}\" placeholder=\"Your name\" style=\"width:100%; box-sizing:border-box; background:rgba(217,217,217,0.45); border:none; border-radius:6px; padding:14px 16px; font-family:Helvetica, Arial, sans-serif; font-size:16px; color:#3a3a3a; outline:none;\">\n          <div style=\"display:flex; flex-wrap:wrap; gap:8px;\">\n            <sc-for list=\"{{ draftTopics }}\" as=\"d\" hint-placeholder-count=\"8\">\n              <button sc-camel-on-click=\"{{ d.onClick }}\" style=\"display:inline-flex; align-items:center; gap:6px; cursor:pointer; border:1px solid {{ d.border }}; border-radius:999px; padding:7px 14px 7px 8px; font-family:Helvetica, Arial, sans-serif; font-size:12px; background:{{ d.bg }}; color:{{ d.color }};\">\n                <span style=\"width:16px; height:16px; display:block; flex:none; background-image:{{ d.iconCss }}; background-size:contain; background-repeat:no-repeat; background-position:center;\"><\u002Fspan>\n                <span>{{ d.label }}<\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <input type=\"text\" value=\"{{ draftTitle }}\" sc-camel-on-change=\"{{ onDraftTitle }}\" placeholder=\"Title — state the idea in one line\" style=\"width:100%; box-sizing:border-box; background:rgba(217,217,217,0.45); border:none; border-radius:6px; padding:14px 16px; font-family:Helvetica, Arial, sans-serif; font-size:16px; color:#3a3a3a; outline:none;\">\n          <textarea value=\"{{ draftBody }}\" sc-camel-on-change=\"{{ onDraftBody }}\" rows=\"6\" placeholder=\"What is the problem, what have you seen, and what would you have the community do?\" style=\"width:100%; box-sizing:border-box; background:rgba(217,217,217,0.45); border:none; border-radius:6px; padding:14px 16px; font-family:Helvetica, Arial, sans-serif; font-size:16px; line-height:1.55; color:#3a3a3a; outline:none; resize:vertical;\"><\u002Ftextarea>\n          <div style=\"display:flex; flex-direction:column; gap:10px;\">\n            <div style=\"font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color:#8a8a8a;\">Add media (optional)<\u002Fdiv>\n            <div style=\"display:flex; flex-wrap:wrap; gap:8px;\">\n              <label style=\"display:inline-flex; align-items:center; justify-content:center; gap:6px; cursor:pointer; border:1.5px solid #8fd6bd; border-radius:999px; min-height:44px; padding:0 16px; box-sizing:border-box; background:#ffffff; font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:#0f9d76;\" style-hover=\"background:#eef8f4;\">Image<input type=\"file\" accept=\"image/*\" sc-camel-on-change=\"{{ onPickImage }}\" style=\"display:none;\"><\u002Flabel>\n              <label style=\"display:inline-flex; align-items:center; justify-content:center; gap:6px; cursor:pointer; border:1.5px solid #8fd6bd; border-radius:999px; min-height:44px; padding:0 16px; box-sizing:border-box; background:#ffffff; font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:#0f9d76;\" style-hover=\"background:#eef8f4;\">Audio file<input type=\"file\" accept=\"audio/*\" sc-camel-on-change=\"{{ onPickAudio }}\" style=\"display:none;\"><\u002Flabel>\n              <button type=\"button\" sc-camel-on-click=\"{{ startRecAudio }}\" style=\"display:inline-flex; align-items:center; justify-content:center; gap:6px; cursor:pointer; border:1.5px solid #8fd6bd; border-radius:999px; min-height:44px; padding:0 16px; box-sizing:border-box; background:#ffffff; font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:#0f9d76;\" style-hover=\"background:#eef8f4;\">Record audio<\u002Fbutton>\n              <button type=\"button\" sc-camel-on-click=\"{{ startRecAv }}\" style=\"display:inline-flex; align-items:center; justify-content:center; gap:6px; cursor:pointer; border:1.5px solid #8fd6bd; border-radius:999px; min-height:44px; padding:0 16px; box-sizing:border-box; background:#ffffff; font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:#0f9d76;\" style-hover=\"background:#eef8f4;\">Live camera + audio<\u002Fbutton>\n            <\u002Fdiv>\n            <sc-if value=\"{{ recOpen }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex; flex-direction:column; gap:10px; padding:12px; border-radius:12px; background:#f4f6f5;\">\n                <sc-if value=\"{{ recIsAv }}\" hint-placeholder-val=\"{{ false }}\">\n                  <video ref=\"{{ previewRef }}\" sc-camel-auto-play=\"{{ true }}\" muted=\"{{ true }}\" sc-camel-plays-inline=\"{{ true }}\" style=\"width:100%; max-height:260px; border-radius:10px; background:#111; object-fit:cover; display:block;\"><\u002Fvideo>\n                <\u002Fsc-if>\n                <div style=\"display:flex; flex-wrap:wrap; align-items:center; gap:10px;\">\n                  <span style=\"font-family:Helvetica, Arial, sans-serif; font-size:14px; color:{{ recColor }};\">{{ recLabel }}<\u002Fspan>\n                  <div style=\"display:flex; gap:8px; margin-left:auto;\">\n                    <sc-if value=\"{{ recCanStart }}\" hint-placeholder-val=\"{{ false }}\">\n                      <button type=\"button\" sc-camel-on-click=\"{{ recStart }}\" style=\"cursor:pointer; border:none; border-radius:999px; min-height:44px; padding:0 20px; font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; background:#f4511e; color:#ffffff;\">● Record<\u002Fbutton>\n                    <\u002Fsc-if>\n                    <sc-if value=\"{{ recording }}\" hint-placeholder-val=\"{{ false }}\">\n                      <button type=\"button\" sc-camel-on-click=\"{{ recStop }}\" style=\"cursor:pointer; border:none; border-radius:999px; min-height:44px; padding:0 20px; font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; background:#2f2f2f; color:#ffffff;\">■ Stop<\u002Fbutton>\n                    <\u002Fsc-if>\n                    <button type=\"button\" sc-camel-on-click=\"{{ recCancel }}\" style=\"cursor:pointer; background:none; border:none; min-height:44px; padding:0 8px; font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:#8a8a8a;\">Cancel<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ draftImageUrl }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex; align-items:center; gap:10px;\">\n                <img src=\"{{ draftImageUrl }}\" alt=\"Your image\" style=\"width:96px; height:64px; object-fit:cover; border-radius:8px; display:block;\">\n                <span style=\"flex:1; font-family:Helvetica, Arial, sans-serif; font-size:13px; color:#6a6a6a;\">Image attached — shows in your post popup.<\u002Fspan>\n                <button type=\"button\" sc-camel-on-click=\"{{ clearImage }}\" title=\"Remove image\" style=\"flex:none; width:32px; height:32px; padding:0; border:none; background:transparent; cursor:pointer;\"><img src=\"ee780f2b-f8f5-46c1-b66f-1d5ec6ca8e98\" alt=\"Remove\" style=\"width:26px; height:26px; display:block;\"><\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ draftVideoUrl }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex; align-items:center; gap:10px;\">\n                <video src=\"{{ draftVideoUrl }}\" controls=\"{{ true }}\" sc-camel-plays-inline=\"{{ true }}\" style=\"flex:1; min-width:0; max-height:180px; border-radius:8px; background:#111; display:block;\"><\u002Fvideo>\n                <button type=\"button\" sc-camel-on-click=\"{{ clearVideo }}\" title=\"Remove recording\" style=\"flex:none; width:32px; height:32px; padding:0; border:none; background:transparent; cursor:pointer;\"><img src=\"ee780f2b-f8f5-46c1-b66f-1d5ec6ca8e98\" alt=\"Remove\" style=\"width:26px; height:26px; display:block;\"><\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ draftAudioUrl }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex; align-items:center; gap:10px;\">\n                <audio src=\"{{ draftAudioUrl }}\" controls=\"{{ true }}\" style=\"flex:1; min-width:0; display:block;\"><\u002Faudio>\n                <button type=\"button\" sc-camel-on-click=\"{{ clearAudio }}\" title=\"Remove audio\" style=\"flex:none; width:32px; height:32px; padding:0; border:none; background:transparent; cursor:pointer;\"><img src=\"ee780f2b-f8f5-46c1-b66f-1d5ec6ca8e98\" alt=\"Remove\" style=\"width:26px; height:26px; display:block;\"><\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <sc-if value=\"{{ draftError }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-family:Helvetica, Arial, sans-serif; font-size:14px; color:#f4511e;\">{{ draftError }}<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"display:flex; flex-wrap:wrap; align-items:center; gap:12px; padding:14px 24px 22px;\">\n          <button sc-camel-on-click=\"{{ submitDraft }}\" style=\"cursor:pointer; border:none; border-radius:999px; min-height:44px; padding:0 24px; font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:12px; letter-spacing:0.08em; text-transform:uppercase; background:#f4511e; color:#ffffff;\" style-hover=\"background:#d93f10;\">Post it<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ closeComposer }}\" style=\"cursor:pointer; background:none; border:none; min-height:44px; font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:#8a8a8a;\">Cancel<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ ctxOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div sc-camel-on-click=\"{{ closeCtx }}\" sc-camel-on-context-menu=\"{{ closeCtx }}\" style=\"position:fixed; inset:0; z-index:240;\">\n      <div role=\"menu\" sc-camel-on-click=\"{{ stopHelp }}\" style=\"position:fixed; left:{{ ctxX }}px; top:{{ ctxY }}px; width:230px; background:#ffffff; border:1px solid #e6ebe9; border-radius:12px; box-shadow:0 14px 40px rgba(0,0,0,0.18); overflow:hidden; display:flex; flex-direction:column; padding:6px 0;\">\n        <div style=\"padding:6px 16px 8px; font-family:Helvetica, Arial, sans-serif; font-size:12px; line-height:1.35; color:#8a8a8a; border-bottom:1px solid #f0f0f0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;\">{{ ctxTitle }}<\u002Fdiv>\n        <button type=\"button\" sc-camel-on-click=\"{{ ctxOpenPost }}\" style=\"display:flex; align-items:center; width:100%; min-height:40px; padding:0 16px; border:none; background:#ffffff; cursor:pointer; text-align:left; font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:#2f2f2f;\" style-hover=\"background:#f4f6f5;\">Open post<\u002Fbutton>\n        <sc-if value=\"{{ ctxCanEdit }}\" hint-placeholder-val=\"{{ false }}\">\n          <button type=\"button\" sc-camel-on-click=\"{{ ctxEdit }}\" style=\"display:flex; align-items:center; width:100%; min-height:40px; padding:0 16px; border:none; background:#ffffff; cursor:pointer; text-align:left; font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:#0f9d76;\" style-hover=\"background:#eef8f4;\">Edit post<\u002Fbutton>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ ctxNoEdit }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:8px 16px; font-family:Helvetica, Arial, sans-serif; font-size:12px; color:#9a9a9a;\">{{ ctxNoEditMsg }}<\u002Fdiv>\n        <\u002Fsc-if>\n        <button type=\"button\" sc-camel-on-click=\"{{ ctxCopy }}\" style=\"display:flex; align-items:center; width:100%; min-height:40px; padding:0 16px; border:none; background:#ffffff; cursor:pointer; text-align:left; font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:#2f2f2f;\" style-hover=\"background:#f4f6f5;\">{{ ctxCopyLabel }}<\u002Fbutton>\n        <button type=\"button\" sc-camel-on-click=\"{{ ctxDelete }}\" style=\"display:flex; align-items:center; width:100%; min-height:40px; padding:0 16px; border:none; background:#ffffff; cursor:pointer; text-align:left; font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:#f4511e;\" style-hover=\"background:#fff1ec;\">Delete post<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ editOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div sc-camel-on-click=\"{{ closeEdit }}\" style=\"position:fixed; inset:0; z-index:230; background:rgba(20,20,20,0.55); display:flex; align-items:center; justify-content:center; padding:clamp(12px,3vw,40px); box-sizing:border-box;\">\n      <div role=\"dialog\" aria-modal=\"true\" aria-label=\"Edit post\" sc-camel-on-click=\"{{ stopHelp }}\" style=\"width:min(640px,100%); max-height:90vh; overflow-y:auto; background:#ffffff; border-radius:22px; box-shadow:0 24px 70px rgba(0,0,0,0.28);\">\n        <div style=\"display:flex; align-items:flex-start; gap:14px; padding:22px 24px 14px; border-bottom:1px solid #f0f0f0;\">\n          <div style=\"flex:1; min-width:0;\">\n            <div style=\"font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color:#0f9d76;\">Edit post<\u002Fdiv>\n            <div style=\"font-family:Georgia, 'Times New Roman', serif; font-size:14px; line-height:1.5; color:#8a8a8a; margin-top:6px;\">Changes show for everyone. The previous version is kept in the edit log for admin review.<\u002Fdiv>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ closeEdit }}\" title=\"Close\" style=\"flex:none; background:none; border:none; cursor:pointer; padding:0; line-height:1;\"><img src=\"ee780f2b-f8f5-46c1-b66f-1d5ec6ca8e98\" alt=\"Close\" style=\"width:26px; height:26px; display:block;\"><\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:14px; padding:20px 24px 8px;\">\n          <div style=\"display:flex; flex-wrap:wrap; gap:8px;\">\n            <sc-for list=\"{{ editTopics }}\" as=\"d\" hint-placeholder-count=\"8\">\n              <button sc-camel-on-click=\"{{ d.onClick }}\" style=\"display:inline-flex; align-items:center; gap:6px; cursor:pointer; border:1px solid {{ d.border }}; border-radius:999px; padding:7px 14px 7px 8px; font-family:Helvetica, Arial, sans-serif; font-size:12px; background:{{ d.bg }}; color:{{ d.color }};\">\n                <span style=\"width:16px; height:16px; display:block; flex:none; background-image:{{ d.iconCss }}; background-size:contain; background-repeat:no-repeat; background-position:center;\"><\u002Fspan>\n                <span>{{ d.label }}<\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <input type=\"text\" value=\"{{ editTitle }}\" sc-camel-on-change=\"{{ onEditTitle }}\" placeholder=\"Title\" style=\"width:100%; box-sizing:border-box; background:rgba(217,217,217,0.45); border:none; border-radius:6px; padding:14px 16px; font-family:Helvetica, Arial, sans-serif; font-size:16px; color:#3a3a3a; outline:none;\">\n          <textarea value=\"{{ editBody }}\" sc-camel-on-change=\"{{ onEditBody }}\" rows=\"8\" placeholder=\"Post text\" style=\"width:100%; box-sizing:border-box; background:rgba(217,217,217,0.45); border:none; border-radius:6px; padding:14px 16px; font-family:Helvetica, Arial, sans-serif; font-size:16px; color:#3a3a3a; outline:none; line-height:1.55; resize:vertical;\"><\u002Ftextarea>\n          <sc-if value=\"{{ editError }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-family:Helvetica, Arial, sans-serif; font-size:14px; color:#f4511e;\">{{ editError }}<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"display:flex; flex-wrap:wrap; align-items:center; gap:12px; padding:14px 24px 22px;\">\n          <button sc-camel-on-click=\"{{ saveEdit }}\" style=\"cursor:pointer; border:none; border-radius:999px; min-height:44px; padding:0 24px; font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; font-size:12px; background:#0f9d76; color:#ffffff;\" style-hover=\"background:#0b7f5f;\">Save changes<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ closeEdit }}\" style=\"cursor:pointer; background:none; border:none; min-height:44px; font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:#8a8a8a;\">Cancel<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ letterOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div sc-camel-on-click=\"{{ closeLetterPost }}\" style=\"position:fixed; inset:0; z-index:205; background:rgba(20,20,20,0.55); display:flex; align-items:center; justify-content:center; padding:clamp(12px,3vw,40px); box-sizing:border-box;\">\n      <div role=\"dialog\" aria-modal=\"true\" aria-label=\"Open Letter to the OpenAI Foundation\" sc-camel-on-click=\"{{ stopHelp }}\" style=\"position:relative; width:min(720px,100%); max-height:90vh; background:#ffffff; border-radius:22px; box-shadow:0 24px 70px rgba(0,0,0,0.28); display:flex; flex-direction:column; overflow:hidden;\">\n        <button type=\"button\" sc-camel-on-click=\"{{ closeLetterPost }}\" aria-label=\"Close\" style=\"position:absolute; top:16px; right:16px; width:32px; height:32px; padding:0; border:0; background:transparent; cursor:pointer; z-index:2;\"><img src=\"ee780f2b-f8f5-46c1-b66f-1d5ec6ca8e98\" alt=\"\" style=\"width:32px; height:32px; display:block;\"><\u002Fbutton>\n        <div style=\"padding:clamp(24px,4vw,34px) clamp(22px,5vw,44px) 14px; border-bottom:1px solid #e6ebe9;\">\n          <div style=\"font-family:'Arial Black','Helvetica Neue',Helvetica,sans-serif; font-weight:900; font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:#0f9d76;\">📌 Pinned · Open Letter · Full Transcript<\u002Fdiv>\n          <div style=\"margin-top:10px; display:flex; flex-direction:column; font-family:'Arial Black','Helvetica Neue',Helvetica,sans-serif; font-weight:900; text-transform:uppercase; line-height:0.95; font-size:clamp(24px,5vw,34px); color:#2f2f2f;\"><span>To the OpenAI<\u002Fspan><span style=\"color:#8fd6bd;\">Foundation<\u002Fspan><\u002Fdiv>\n          <div style=\"margin-top:10px; font-size:15px; font-style:italic; color:#6a6a6a;\">DL Thomas → Anna Makanju · OpenAI Foundation<\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ letterBodyShown }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"overflow-y:auto; -webkit-overflow-scrolling:touch; padding:22px clamp(22px,5vw,44px) 30px; font-family:Georgia,'Times New Roman',serif; font-size:17px; line-height:1.62; color:#3f3f3f; text-wrap:pretty;\">\n          <p style=\"margin:0 0 16px;\">Dear Anna Makanju, Bret Taylor and the OpenAI Foundation Civil Society &amp; Philanthropy Team,<\u002Fp>\n          <p style=\"margin:0 0 16px;\">Good Morning, the Sun is shining in Colorado!<\u002Fp>\n          <p style=\"margin:0 0 16px;\">I am the founder of the JanuaryAI Project (JAI), an emerging civil-society initiative built around a straightforward proposition:<\u002Fp>\n          <p style=\"margin:0 0 16px; font-style:italic; font-size:19px; color:#0f9d76;\">AI should advance the human condition—and humanity should advance alongside AI.<\u002Fp>\n          <p style=\"margin:0 0 16px;\">Our vision is to deliver abundance and AI for Good for All. JanuaryAI is being developed as a new kind of civic institution through which everyday people, technologists, educators, nonprofit and community leaders, philanthropists, entrepreneurs, government and industry can participate in determining how AI can produce measurable public benefit.<\u002Fp>\n          <p style=\"margin:0 0 16px;\">Our mission is: Discover disruption, challenges and opportunity. Innovate and orchestrate solutions that aid humane transition. Advance individual well-being and happiness.<\u002Fp>\n          <p style=\"margin:0 0 16px;\">We are beginning this work in Colorado through the JanuaryAI Project, our broader majaii community, and a community planning process we call JAI Meeting of the Minds.<\u002Fp>\n          <div style=\"margin:28px 0 12px; font-family:'Arial Black','Helvetica Neue',Helvetica,sans-serif; font-weight:900; font-size:15px; letter-spacing:0.04em; text-transform:uppercase; color:#2f2f2f;\">Meeting of the Minds<\u002Fdiv>\n          <p style=\"margin:0 0 16px;\">Meeting of the Minds is designed to move a community from conversation to coordinated action. Citizens and subject-matter experts consider how AI can positively affect education, health and wellness, energy, manufacturing, economic opportunity and other areas of everyday life.<\u002Fp>\n          <p style=\"margin:0 0 10px;\">The underlying principle is deliberately democratic:<\u002Fp>\n          <div style=\"margin:0 0 16px; font-family:'Arial Black','Helvetica Neue',Helvetica,sans-serif; font-weight:900; font-size:22px; color:#0f9d76;\">1 PERSON / 1 VOTE<\u002Fdiv>\n          <p style=\"margin:0 0 16px;\">As community members post ideas, debate alternatives, contribute expertise and identify problems, promising ideas can begin to develop community consensus. Consensus initiatives can become proposed JAI Programs. Citizen Members can then vote on whether JanuaryAI should authorize resources to launch a program, measure its results and determine whether a successful solution can be scaled and deployed more broadly.<\u002Fp>\n          <p style=\"margin:0 0 10px;\">We call this process the Virtuous Cycle:<\u002Fp>\n          <div style=\"margin:0 0 16px; padding:14px 16px; background:#f1f8f5; border-radius:12px; font-family:'Arial Black','Helvetica Neue',Helvetica,sans-serif; font-weight:900; font-size:12px; letter-spacing:0.06em; line-height:1.8; color:#0f9d76;\">DISCOVER → DISCUSS → BUILD CONSENSUS → VOTE → FUND → ACT → MEASURE → LEARN → SCALE → DISCOVER AGAIN<\u002Fdiv>\n          <p style=\"margin:0 0 16px;\">The objective is democratic coordination of AI for Good. Rather than assuming that the priorities of the AI transition should be determined exclusively by technology companies, government, philanthropy or experts, JanuaryAI asks another question:<\u002Fp>\n          <p style=\"margin:0 0 16px; font-style:italic; font-size:19px; color:#0f9d76;\">Can everyday citizens be given a meaningful democratic mechanism for helping determine where AI should be applied for public benefit?<\u002Fp>\n          <p style=\"margin:0 0 16px;\">We believe they can—while still bringing the expertise, capital and institutional capabilities of government, industry, philanthropy, academia and civil society into the process. That creates another important element of the Virtuous Cycle: collaboration between what we describe as virtuous citizens and responsible capitalists.<\u002Fp>\n          <p style=\"margin:0 0 16px;\">Funding for initiatives can potentially combine citizen investment and philanthropy with industry and government resources. Different participants contribute different forms of value, but the objective remains shared: identify common ground and convert it into measurable action.<\u002Fp>\n          <p style=\"margin:0 0 10px;\">This leads to a principle that is becoming central to JanuaryAI:<\u002Fp>\n          <p style=\"margin:0 0 16px; font-style:italic; font-size:19px; color:#0f9d76;\">Rather than research leading eventually to action, action itself can become research.<\u002Fp>\n          <p style=\"margin:0 0 16px;\">A community identifies a problem. It develops a potential AI-enabled solution. Citizens authorize an experiment. Partners contribute expertise and resources. The program is deployed. Results are measured. Results produce valuable knowledge. Successful solutions can then be improved, replicated and scaled. That knowledge returns to the community and begins another Virtuous Cycle.<\u002Fp>\n          <div style=\"margin:28px 0 12px; font-family:'Arial Black','Helvetica Neue',Helvetica,sans-serif; font-weight:900; font-size:15px; letter-spacing:0.04em; text-transform:uppercase; color:#2f2f2f;\">Why Colorado<\u002Fdiv>\n          <p style=\"margin:0 0 16px;\">Colorado provides an unusually interesting environment in which to begin testing this model. Through JAI Meeting of the Minds, we intend to explore how citizens, educators, government, philanthropy, technology companies and responsible private enterprise can collaborate around practical AI-for-Good initiatives.<\u002Fp>\n          <p style=\"margin:0 0 16px;\">Colorado Attorney General Phil Weiser's perspective on education, technology, public policy and productive public/private partnerships can contribute an important real-world perspective to that conversation.<\u002Fp>\n          <p style=\"margin:0 0 16px;\">The larger question for JanuaryAI is not simply how resources should be allocated. It is whether citizens, government, philanthropy, educators, technology companies and responsible private capital can develop better mechanisms for collectively discovering, testing and scaling beneficial uses of AI.<\u002Fp>\n          <div style=\"margin:28px 0 12px; font-family:'Arial Black','Helvetica Neue',Helvetica,sans-serif; font-weight:900; font-size:15px; letter-spacing:0.04em; text-transform:uppercase; color:#2f2f2f;\">Why I am contacting the OpenAI Foundation<\u002Fdiv>\n          <p style=\"margin:0 0 16px;\">I have been studying the OpenAI Foundation's work in AI for Civil Society &amp; Philanthropy, particularly its emphasis on putting AI to work on real community challenges, helping civil-society organizations adopt AI responsibly, and developing infrastructure and lessons that can benefit the broader social sector.<\u002Fp>\n          <p style=\"margin:0 0 16px;\">There appears to be meaningful common ground between those objectives and what we are attempting to build with JanuaryAI. At this stage, I am not approaching the OpenAI Foundation with a grant request. I would instead like to begin a conversation.<\u002Fp>\n          <p style=\"margin:0 0 16px;\">I would value the opportunity to introduce JanuaryAI, learn what your team is discovering as you develop the Civil Society &amp; Philanthropy initiative, and understand where an emerging organization such as ours might contribute. The question I would particularly like to explore with you is:<\u002Fp>\n          <p style=\"margin:0 0 16px; font-style:italic; font-size:19px; color:#0f9d76;\">Could democratic community coordination become another useful component of the infrastructure for AI for Good?<\u002Fp>\n          <p style=\"margin:0 0 16px;\">JanuaryAI and Meeting of the Minds could provide a real-world environment in which to investigate that question—starting in Colorado. Rather than arrive with a predetermined proposal, I would prefer to listen first.<\u002Fp>\n          <p style=\"margin:0 0 16px;\">I would welcome a conversation with you or an appropriate member of the Civil Society &amp; Philanthropy team about the Foundation's priorities, the problems you believe deserve greater attention, and whether JanuaryAI's developing community, democratic coordination model and Virtuous Cycle could contribute to the work you are undertaking.<\u002Fp>\n          <p style=\"margin:0 0 22px;\">Thank you for considering the introduction.<\u002Fp>\n          <p style=\"margin:0 0 4px;\">Warm regards,<\u002Fp>\n          <div style=\"font-family:'Arial Black','Helvetica Neue',Helvetica,sans-serif; font-weight:900; font-size:16px; text-transform:uppercase; color:#2f2f2f;\">DL Thomas<\u002Fdiv>\n          <div style=\"font-size:15px; color:#6a6a6a; margin:2px 0 20px;\">Founder, The JanuaryAI Project | majaii<\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:10px; padding-top:16px; border-top:1px solid #e6ebe9; font-size:15px; line-height:1.55;\">\n            <div><span style=\"font-family:'Arial Black','Helvetica Neue',Helvetica,sans-serif; font-weight:900; font-size:11px; letter-spacing:0.12em; color:#0f9d76;\">VISION<\u002Fspan> &nbsp;Deliver abundance and AI for Good for All.<\u002Fdiv>\n            <div><span style=\"font-family:'Arial Black','Helvetica Neue',Helvetica,sans-serif; font-weight:900; font-size:11px; letter-spacing:0.12em; color:#0f9d76;\">MISSION<\u002Fspan> &nbsp;Discover disruption, challenges and opportunity. Innovate and orchestrate solutions that aid humane transition. Advance individual well-being and happiness.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top:26px; text-align:center; font-family:Helvetica,Arial,sans-serif; font-size:12px; color:#a8a8a8;\">© 2026 DL Thomas. All Rights Reserved.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"display:flex; flex-wrap:wrap; align-items:center; gap:10px; padding:12px clamp(22px,5vw,44px); border-top:1px solid #f0f0f0;\">\n          <button sc-camel-on-click=\"{{ toggleLetterComments }}\" style=\"cursor:pointer; border:1px solid {{ letterCommentBorder }}; background:{{ letterCommentBg }}; color:{{ letterCommentColor }}; border-radius:999px; padding:9px 18px; min-height:40px; font-family:'Arial Black','Helvetica Neue',Helvetica,sans-serif; font-weight:900; font-size:11px; letter-spacing:0.09em; text-transform:uppercase;\">{{ letterCommentLabel }}<\u002Fbutton>\n          <a href=\"./open-letter.html#jai-library\" style=\"margin-left:auto; font-family:'Arial Black','Helvetica Neue',Helvetica,sans-serif; font-weight:900; font-size:11px; letter-spacing:0.09em; text-transform:uppercase; color:#0f9d76; text-decoration:none;\">Library+Letters →<\u002Fa>\n        <\u002Fdiv>\n        <sc-if value=\"{{ letterCommentsShown }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"overflow-y:auto; -webkit-overflow-scrolling:touch; padding:6px clamp(22px,5vw,44px) 24px; border-top:1px solid #f0f0f0; display:flex; flex-direction:column; gap:14px;\">\n            <div style=\"margin-top:12px; border:2px solid #8fd6bd; border-radius:14px; padding:14px 16px; background:#f4fbf8;\">\n              <div style=\"font-family:'Arial Black','Helvetica Neue',Helvetica,sans-serif; font-weight:900; font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:#0f9d76;\">📌 Response from the OpenAI Foundation<\u002Fdiv>\n              <sc-if value=\"{{ hasRecipientReply }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"margin-top:8px;\">\n                  <div style=\"display:flex; gap:10px; align-items:center; margin-bottom:6px;\"> nLcText }}\" rows=\"3\" placeholder=\"Add a comment…\" style=\"box-sizing:border-box; background:rgba(217,217,217,0.45); border:none; border-radius:10px; padding:11px 14px; font-family:Georgia, serif; font-size:16px; color:#2f2f2f; outline:none; resize:vertical; line-height:1.5;\"><\u002Ftextarea>\n              <label style=\"display:flex; gap:10px; align-items:flex-start; font-family:Helvetica, Arial, sans-serif; font-size:13px; line-height:1.45; color:#5a5a5a; cursor:pointer;\">\n                <input type=\"checkbox\" checked=\"{{ lcRecipient }}\" sc-camel-on-change=\"{{ onLcRecipient }}\" style=\"margin-top:2px; width:18px; height:18px; flex:none;\">\n                <span>I am responding on behalf of the OpenAI Foundation. Pinned at the top once the admin verifies it.<\u002Fspan>\n              <\u002Flabel>\n              <div style=\"display:flex; flex-wrap:wrap; align-items:center; gap:12px;\">\n                <button sc-camel-on-click=\"{{ postLetterComment }}\" style=\"cursor:pointer; border:none; border-radius:999px; min-height:44px; padding:0 24px; background:#0f9d76; color:#ffffff; font-family:'Arial Black','Helvetica Neue',Helvetica,sans-serif; font-weight:900; font-size:12px; letter-spacing:0.08em; text-transform:uppercase;\" style-hover=\"background:#0b7f5f;\">Post comment<\u002Fbutton>\n                <span style=\"font-family:Helvetica, Arial, sans-serif; font-size:13px; color:#0f9d76;\">{{ lcStatus }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <sc-if value=\"{{ hasPendingLc }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"border:1px dashed #f4511e; border-radius:14px; padding:14px 16px; background:#fff8f5;\">\n                <div style=\"font-family:'Arial Black','Helvetica Neue',Helvetica,sans-serif; font-weight:900; font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:#f4511e;\">Admin · Recipient responses awaiting approval<\u002Fdiv>\n                <sc-for list=\"{
