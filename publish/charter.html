 progress honestly.<br>Share successes.<br>Explain failures.<br>Document lessons learned.<br>Identify emerging priorities.<br>Maintain accountability.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">The report should become part of the institution’s annual rhythm.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">The community does not simply decide what to do.<br>It learns from what it has done.<\u002Fp>\n        <p style=\"font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:clamp(20px,4vw,24px); color:#2f2f2f; margin:0 0 18px;\">Measuring the Unmeasurable<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">Not everything valuable can be reduced to a number.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">Some of January AI’s most important outcomes may be relational:<br>A researcher meeting an entrepreneur.<br>A student discovering a career path.<br>A nonprofit finding a technology partner.<br>A philanthropist discovering a meaningful purpose.<br>A community gaining confidence that it has a voice in the AI future.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">These outcomes matter because institutions are ultimately built through human relationships.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">Metrics should illuminate reality.<br>They should never replace judgment.<\u002Fp>\n        <p style=\"font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:clamp(20px,4vw,24px); color:#2f2f2f; margin:0 0 18px;\">The Danger of Optimizing the Wrong Things<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">Every measurement system creates incentives.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">Poorly designed metrics can unintentionally damage an institution.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">For example:<br>A focus on attendance may encourage larger events but weaker engagement.<br>A focus on funding totals may encourage accepting money without sufficient alignment.<br>A focus on publication counts may prioritize visibility over usefulness.<br>A focus on speed may sacrifice thoughtful evaluation.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">January AI must therefore continually ask:<br>“Are we measuring what we truly value, or are we valuing what is easiest to measure?”<\u002Fp>\n        <p style=\"font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:clamp(20px,4vw,24px); color:#2f2f2f; margin:0 0 18px;\">Success as a Living System<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">The ultimate measure of January AI is whether the ecosystem becomes more capable over time.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">Does each year produce better questions?<br>Better solutions?<br>Better partnerships?<br>Better decisions?<br>Better outcomes?<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">A successful January AI does not simply repeat an annual cycle.<br>It improves the cycle.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">The institution learns how to learn.<\u002Fp>\n        <p style=\"font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:clamp(20px,4vw,24px); color:#2f2f2f; margin:0 0 18px;\">Closing Reflection<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">The greatest achievement of January AI would not be that it predicted the future of artificial intelligence.<br>It would be that it helped society participate in creating that future.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">Success is therefore not measured by control over AI.<br>It is measured by expanded human capability.<br>Not by technological dominance.<br>But by responsible stewardship.<br>Not by the concentration of intelligence.<br>But by the distribution of intelligence.<\u002Fp>\n        <p style=\"font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:clamp(20px,4vw,24px); color:#2f2f2f; margin:0 0 18px;\">Transition to Section XII<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0;\">The next section moves from aspiration to execution:<br>How does January AI actually begin?<br>It will describe the first five years: founding structure, initial community formation, first Commons, first Meeting of the Minds, first Summit, development of JAN, early capital strategy, and the transition from founder-led vision to community-led institution.<\u002Fp>\n    <\u002Fdiv>\n    <button sc-camel-on-click=\"{{ toggle_metrics }}\" style=\"display:flex; align-items:center; justify-content:center; width:100%; background:none; border:none; cursor:pointer; padding:20px 0 4px;\">\n        <img src=\"0032e619-25d1-43f8-b719-020703ed33e2\" alt=\"Close section\" style=\"width:32px; height:32px; display:block;\">\n      <\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fsection>\n  <section id=\"plan\" data-screen-label=\"The 5 Year Plan\" style=\"max-width:640px; width:100%; margin:0 auto; padding-top:64px;\">\n    <div style=\"border-top:1px solid #e2e2e2; padding-top:32px;\">\n      <button sc-camel-on-click=\"{{ toggle_plan }}\" style=\"display:flex; align-items:center; gap:16px; width:100%; background:none; border:none; cursor:pointer; padding:0; text-align:left; font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:clamp(20px,4vw,26px); line-height:1.2; color:#2f2f2f; text-transform:uppercase; letter-spacing:0.01em;\">\n        <span style=\"font-size:28px; color:#a7ddc9; display:inline-block; transition:transform 0.2s ease; transform:{{ arrow_plan }};\">▶<\u002Fspan>\n        <span>The 5 Year Plan<\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fdiv>\n    <sc-if value=\"{{ open_plan }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"padding-top:22px;\">\n    <div style=\"text-align:left;\">\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-style:italic; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px; text-align:center;\">From Founding Vision to Enduring Institution<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">Great institutions are rarely created fully formed.<br>They emerge through disciplined experimentation.<br>The founders of enduring organizations often begin with a simple but powerful question:<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">What is the smallest version of this idea that can prove the larger possibility?<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">January AI must follow the same principle.<br>Its ambition may be global.<br>Its beginning must be focused.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">The first five years should not be measured by size alone.<br>They should be measured by institutional maturity.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">The objective is to demonstrate that the January AI model works:<br>That communities can organize around AI challenges.<br>That diverse stakeholders can collaborate.<br>That solutions can be developed responsibly.<br>That capital can be aligned with impact.<br>That governance can preserve trust.<br>That artificial intelligence can strengthen collective human capability.<\u002Fp>\n        <p style=\"font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:clamp(20px,4vw,24px); color:#2f2f2f; margin:0 0 18px;\">Year One: Foundation and Formation<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">The first year is dedicated to creating the foundation of the ecosystem.<br>The priority is not scale.<br>The priority is legitimacy.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\"><strong>Establish the Foundation<\u002Fstrong><br>Create the legal, governance, and operational framework necessary for a mission-driven institution.<br>Define: purpose, principles, governance responsibilities, conflict-of-interest policies, transparency commitments, relationship framework with BÕDEN.<br>The institution must establish trust before asking others to participate.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\"><strong>Launch the Commons<\u002Fstrong><br>The first version of the January AI Commons becomes the gathering place for the community.<br>Its purpose is to: attract early participants, identify important challenges, test engagement models, discover emerging leaders, begin building institutional memory.<br>The Commons is the seed from which the larger ecosystem grows.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\"><strong>Begin Development of JAN<\u002Fstrong><br>The first version of JAN should focus on practical utility.<br>Initial capabilities may include: organizing community knowledge, summarizing discussions, identifying themes, connecting participants, preserving institutional memory.<br>The first goal is not technological sophistication.<br>The first goal is usefulness.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\"><strong>Build the Founding Community<\u002Fstrong><br>The first community should be intentionally diverse.<br>It should include representatives from: technology, education, entrepreneurship, philanthropy, research, government, nonprofit organizations, communities affected by AI transformation.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">The founding community establishes the culture that future generations inherit.<\u002Fp>\n        <p style=\"font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:clamp(20px,4vw,24px); color:#2f2f2f; margin:0 0 18px;\">Year Two: First Innovation Cycle<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">The second year demonstrates the complete January AI model.<br>The annual cycle begins:<br>The Commons identifies challenges.<br>The Meeting of the Minds develops solutions.<br>The Summit evaluates and authorizes initiatives.<br>The institution begins producing evidence.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">The objective is not to fund hundreds of projects.<br>It is to prove that the process creates better outcomes.<\u002Fp>\n        <p style=\"font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:clamp(20px,4vw,24px); color:#2f2f2f; margin:0 0 18px;\">The First Meeting of the Minds<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">The initial gathering should focus on a limited number of high-impact challenges.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">Potential themes: workforce transition, AI education, small business empowerment, healthcare access, scientific acceleration, community resilience.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">Each initiative should have: clear objectives, committed participants, measurable outcomes, realistic implementation plans.<\u002Fp>\n        <p style=\"font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:clamp(20px,4vw,24px); color:#2f2f2f; margin:0 0 18px;\">The First Summit<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">The first Summit establishes the culture.<br>It should communicate:<br>This is not a conference.<br>This is a community exercising responsibility for the AI future.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">The first Summit should demonstrate: transparency, participation, intellectual seriousness, optimism balanced by responsibility.<\u002Fp>\n        <p style=\"font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:clamp(20px,4vw,24px); color:#2f2f2f; margin:0 0 18px;\">Year Three: Demonstrating Impact<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">By year three, January AI transitions from proving the concept to proving impact.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">The focus shifts toward: successful pilots, evidence generation, partnerships, broader participation, institutional credibility.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">JAN becomes increasingly valuable as the knowledge base grows.<br>The Commons becomes richer.<br>The Innovation Pipeline becomes more refined.<br>The Summit becomes more influential.<\u002Fp>\n        <p style=\"font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:clamp(20px,4vw,24px); color:#2f2f2f; margin:0 0 18px;\">Building the Capital Ecosystem<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">During this period, January AI begins expanding relationships with: philanthropic foundations, family offices, corporations, government programs, impact investors, educational institutions.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">The message is clear:<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">January AI does not merely seek funding.<br>It provides a trusted mechanism through which aligned resources can create measurable impact.<\u002Fp>\n        <p style=\"font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:clamp(20px,4vw,24px); color:#2f2f2f; margin:0 0 18px;\">Year Four: Expansion and Replication<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">By year four, the institution begins extending beyond its initial community.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">Expansion may occur through: regional communities, university partnerships, industry collaborations, international relationships.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">However, expansion must preserve culture.<br>Growth without integrity weakens institutions.<br>Growth with integrity strengthens them.<\u002Fp>\n        <p style=\"font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:clamp(20px,4vw,24px); color:#2f2f2f; margin:0 0 18px;\">Year Five: Institutional Maturity<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">At the five-year mark, January AI should demonstrate the characteristics of an emerging enduring institution.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">It should have: a functioning annual cycle, a trusted governance structure, an active Commons, successful innovation projects, measurable impact, a mature JAN platform, diversified funding, a growing leadership community.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">Most importantly, it should begin transitioning from founder-driven energy to community-driven momentum.<\u002Fp>\n        <p style=\"font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:clamp(20px,4vw,24px); color:#2f2f2f; margin:0 0 18px;\">The Founder’s Evolution<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">The founder’s role evolves:<br>From creator, to builder, to guardian, to mentor.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">Every founder faces a transition.<br>The early stage requires vision.<br>The growth stage requires organization.<br>The mature stage requires stewardship.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">The greatest accomplishment is not remaining central.<br>It is creating something valuable enough that others willingly carry it forward.<\u002Fp>\n        <p style=\"font-family:'Arial Black', 'Helvetica Neue', Helvetica, sans-serif; font-weight:900; font-size:clamp(20px,4vw,24px); color:#2f2f2f; margin:0 0 18px;\">The Long View<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0 0 22px;\">Five years is only the beginning.<br>The true measure of January AI is not whether it succeeds quickly.<br>It is whether it remains valuable decades from now.<\u002Fp>\n        <p style=\"font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px,3.2vw,20px); line-height:1.6; color:#4a4a4a; margin:0;\">The institution should always ask:<br>Will this decision strengthen the next generation?<br>Will this governance model survive leadership changes?<br>Will this technology empower communities beyond our own?<br>Will this work contribute to a future where AI expands opportunity?<\u002Fp>\n    <\u002Fdiv>\n    <button sc-camel-on-click=\"{{ toggle_plan }}\" style=\"display:flex; align-items:center; justify-content:center; width:100%; background:none; border:none; cursor:pointer; padding:20px 0 4px;\">\n        <img src=\"0032e619-25d1-43f8-b719-020703ed33e2\" alt=\"Close section\" style=\"width:32px; height:32px; display:block;\">\n      <\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fsection>\n  \n  <div style=\"text-align:center; font-family:Helvetica, Arial, sans-serif; font-size:12px; color:#a8a8a8; margin-top:72px;\">© 2026 DL Thomas. All Rights Reserved.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  railHover = -1;\n  railDefs = [\n    { label: 'Issues, Topics, Posts', href: './index.html' },\n    { label: 'Meeting of the Minds', href: './meeting-of-the-minds.html' },\n    { label: 'Your Invitation', href: './invitation.html', always: true },\n    { label: 'Majaii', href: './majaii.html', always: true },\n    { label: 'Library+Letters', href: './open-letter.html' },\n    { label: 'Donors, Sponsors, Partners', href: './sponsors.html', always: true },\n    { label: '', href: '', inert: true },\n    { label: 'JanuaryAI Summit 2027', href: './summit.html', always: true },\n    { label: 'Global AI Community', href: './global-ai-community.html' },\n    { label: '', href: '', inert: true },\n    { label: 'JAI-Charter', href: '#plan', always: true },\n    { label: '', href: '', inert: true },\n    { label: 'Contact', href: './contact.html' }\n  ];\n\n  railWide = typeof window !== 'undefined' ? window.innerWidth >= 700 : true;\n\n  railOpen = false;\n  railLockedByTouch = false;\n  setRailOpen = (v) => {\n    if (this.railLockedByTouch) return;\n    if (this.railOpen !== v) { this.railOpen = v; this.forceUpdate(); }\n  };\n  toggleRailOpen = () => {\n    this.railOpen = !this.railOpen;\n    this.railLockedByTouch = this.railOpen;\n    this.railTouchedAt = Date.now();\n    this.forceUpdate();\n  };\n  railTap = (e) => {\n    if (e && e.target && e.target.closest && e.target.closest('[href]')) return;\n    if (this.railTouchedAt && Date.now() - this.railTouchedAt < 700) return;\n    this.toggleRailOpen();\n  };\n\n  setRailHover = (i) => { this.railHover = i; this.forceUpdate(); };\n\n  watchRailWidth() {\n    this.onRailResize = () => {\n      const wide = window.innerWidth >= 700;\n      if
